/* ===== 當天備料統計 ===== */
/* 舊訂單沒有結構化欄位，就從品項文字還原 */
const MENU_NAMES = MENU.flatMap(s => s.items.map(it => ({ name: it.name, cat: s.cat, it }))).sort((a, b) => b.name.length - a.name.length);
function parseLine(l){
  if (l.nm && l.kind) return { cat: l.cat, nm: l.nm, sp: l.sp || "", kind: l.kind, q: Number(l.q) || 1, est: l.est, sub: l.sub };
  const txt = String(l.short || l.item || "");
  const hit = MENU_NAMES.find(m => m.cat === l.cat && txt.startsWith(m.name)) || MENU_NAMES.find(m => txt.startsWith(m.name));
  if (!hit) return null;
  const rest = txt.slice(hit.name.length);
  if (hit.it.type === "amount") return { cat: hit.cat, nm: hit.name, sp: "", kind: "amount", q: 1, est: l.est, sub: l.sub };
  const m = rest.match(/^(.*?)×(\d+)/);
  const q = m ? Number(m[2]) : 1;
  if (hit.it.type === "piece") return { cat: hit.cat, nm: hit.name, sp: "", kind: "piece", q, est: l.est, sub: l.sub };
  let sp = m ? m[1].trim() : "";
  if (!sp && hit.it.opts && hit.it.opts.length === 1) sp = hit.it.opts[0].label;
  const opt = hit.it.opts && hit.it.opts.find(o => o.label.replace(/\s*一份/, "") === sp || o.label === sp);
  return { cat: hit.cat, nm: hit.name, sp: opt ? opt.label : sp, kind: "qty", q, est: l.est, sub: l.sub };
}
/* 「半」的份量算 0.5，用來估計要準備幾隻／幾顆 */
const WHOLE_UNIT = { "一隻": "隻", "一顆": "顆" };
function prepSummary(orders){
  const map = new Map();
  for (const o of orders) for (const l of o.items || []) {
    const p = parseLine(l); if (!p) continue;
    const key = p.cat + "|" + p.nm;
    if (!map.has(key)) map.set(key, { cat: p.cat, nm: p.nm, kind: p.kind, specs: new Map(), q: 0, amt: 0, noAmt: 0, n: 0 });
    const g = map.get(key);
    g.n++;
    if (p.kind === "amount") { const v = p.sub ?? p.est; if (v) g.amt += Number(v); else g.noAmt++; }
    else if (p.kind === "piece") g.q += p.q;
    else g.specs.set(p.sp, (g.specs.get(p.sp) || 0) + p.q);
  }
  // 依菜單順序排列
  const order = MENU_NAMES.slice().sort((a, b) => MENU.findIndex(s => s.cat === a.cat) - MENU.findIndex(s => s.cat === b.cat)
    || MENU.find(s => s.cat === a.cat).items.indexOf(a.it) - MENU.find(s => s.cat === b.cat).items.indexOf(b.it));
  return order.map(m => map.get(m.cat + "|" + m.name)).filter(Boolean).map(g => {
    if (g.kind === "qty") {
      const opts = (MENU.find(s => s.cat === g.cat).items.find(it => it.name === g.nm) || {}).opts || [];
      const specs = [...g.specs].sort((a, b) => opts.findIndex(o => o.label === a[0]) - opts.findIndex(o => o.label === b[0]));
      const wholeLabel = opts.map(o => o.label).find(x => WHOLE_UNIT[x]);
      let main, sub = "";
      if (wholeLabel) {
        const eq = specs.reduce((s, [sp, q]) => s + q * (sp === wholeLabel ? 1 : sp.includes("半") ? 0.5 : 0), 0);
        main = `約 ${eq % 1 ? eq.toFixed(1) : eq} ${WHOLE_UNIT[wholeLabel]}`;
        sub = specs.map(([sp, q]) => `${sp} ${q}`).join("、");
      } else {
        const tot = specs.reduce((s, [, q]) => s + q, 0);
        const mm = specs.length === 1 ? specs[0][0].match(/^一(.)(?:（(.+)）)?/) : null;
        main = `${tot}${mm ? " " + mm[1] : ""}`;
        sub = specs.length > 1 ? specs.map(([sp, q]) => `${sp} ${q}`).join("、") : (mm && mm[2] ? `${mm[2]}一份` : "");
      }
      return { ...g, main, sub };
    }
    if (g.kind === "piece") return { ...g, main: `${g.q} 塊`, sub: `${g.n} 筆訂單・秤重` };
    return { ...g, main: g.amt ? `約 $${g.amt}` : `${g.n} 份`, sub: `${g.n} 份` + (g.noAmt ? `（${g.noAmt} 份沒寫金額）` : "") + "・秤重" };
  });
}
function prepListText(date, mk, rows, orders){
  let t = `【備料】${fmtDate(date)}${mk ? "・" + mk : ""}\n共 ${orders.length} 筆訂單\n`;
  let cat = "";
  for (const r of rows) {
    if (r.cat !== cat) { cat = r.cat; t += `\n〔${cat}〕\n`; }
    t += `${r.nm}　${r.main}${r.sub ? `（${r.sub}）` : ""}\n`;
  }
  return t.trim();
}
let prepDate = null, prepMk = "";
function showPrep(){
  if (!Vault.orders) { openOrders(); return; }
  armIdle();
  const all = Vault.orders;
  if (!prepDate) {
    // 預設：今天；今天沒單就跳到最近有單的日子
    const today = ymd(new Date()), dates = [...new Set(all.map(o => o.date).filter(Boolean))].sort();
    prepDate = dates.includes(today) ? today : (dates.find(d => d >= today) || dates[dates.length - 1] || today);
  }
  const dayOrders = all.filter(o => o.date === prepDate && (!prepMk || o.market === prepMk) && o.st !== "cancel");   // 取消的不用備料
  const rows = prepSummary(dayOrders);
  const known = dayOrders.reduce((s, o) => s + calcTotal(o.items), 0);
  const pend = dayOrders.filter(o => hasPending(o.items)).length;
  const [y, m, d] = prepDate.split("-").map(Number), info = dayInfo(new Date(y, m - 1, d));
  let cat = "";
  sheet.dataset.view = "orders"; sheet.dataset.sub = "prep";
  sheet.innerHTML = `<h3>當天備料統計</h3>
    <div class="day-nav"><button type="button" id="dPrev" aria-label="前一天">‹</button>
      <b>${fmtDate(prepDate)}<small>${escapeHtml(info.hol || info.wor || (info.lun ? "農曆" + info.lun : ""))}</small></b>
      <button type="button" id="dNext" aria-label="後一天">›</button></div>
    <div class="seg" id="prepMk" style="margin-bottom:12px">
      ${["", "爸爸市場", "媽媽市場", "早市", "外送"].map(x => `<button type="button" data-pm="${x}" class="${x === prepMk ? "on" : ""}">${x || "全部"}</button>`).join("")}</div>
    <div class="prep-stats"><div><b>${dayOrders.length}</b><span>筆訂單</span></div>
      <div><b>$${known}</b><span>已知金額</span></div><div><b>${pend}</b><span>待秤重</span></div></div>
    ${rows.length ? `<div class="rows">` + rows.map(r => {
        const head = r.cat !== cat ? (cat = r.cat, `</div><p class="prep-cat">${escapeHtml(r.cat)}</p><div class="rows">`) : "";
        return head + `<div class="prep-row"><div><div class="nm">${escapeHtml(r.nm)}</div>${r.sub ? `<div class="det">${escapeHtml(r.sub)}</div>` : ""}</div>
          <div class="tot">${escapeHtml(r.main)}</div></div>`;
      }).join("") + `</div>` : `<p class="note">這天${prepMk ? "在" + escapeHtml(prepMk) : ""}沒有訂單。</p>`}
    ${rows.length ? `<div class="share-actions" style="margin-top:12px">
      <button type="button" class="btn share" id="prepShare">${ICON.share}分享備料清單</button>
      <button type="button" class="btn ghost" id="prepCopy">${ICON.copy}複製備料清單</button></div>
      <p class="note" style="margin-top:8px">備料清單只有品項和數量，不含客人姓名電話。</p>` : ""}
    <div class="actions"><button type="button" class="btn ghost" id="prepBack">回訂單列表</button></div>`;
  sheet.innerHTML = sheet.innerHTML.replace('<div class="rows"></div>', "");
  sheet.scrollTop = 0;
  const shift = n => { const dt = new Date(y, m - 1, d + n); prepDate = ymd(dt); showPrep(); };
  document.getElementById("dPrev").onclick = () => shift(-1);
  document.getElementById("dNext").onclick = () => shift(1);
  sheet.querySelectorAll("[data-pm]").forEach(b => b.onclick = () => { prepMk = b.dataset.pm; showPrep(); });
  document.getElementById("prepBack").onclick = showOrders;
  const txt = () => prepListText(prepDate, prepMk, rows, dayOrders);
  const sh = document.getElementById("prepShare"); if (sh) sh.onclick = e => shareText(txt(), e.currentTarget);
  const cp = document.getElementById("prepCopy"); if (cp) cp.onclick = e => copyText(txt(), e.currentTarget);
}

/* 停用裝置：只停用（家人換手機）或停用並更換密碼（手機遺失） */
function revokeFlow(uid, name){
  dlgBox.innerHTML = `<h4>停用「${escapeHtml(name)}」？</h4>
    <p>停用後這支裝置會立刻無法讀取和上傳訂單、剩貨。<br>但知道店家密碼的人還是可以重新加入，所以<b>手機遺失或被拿走時，請選「停用並更換密碼」</b>。</p>

      <button type="button" class="btn danger" data-rot>停用並更換密碼（手機遺失）</button>
      <button type="button" class="btn ghost" data-only>只停用這支</button>
      <button type="button" class="btn ghost" data-no>取消</button></div>`;
  dlg.classList.add("show");
  const doRevoke = async () => {

/* 從備份復原：只補回手機上沒有（或已刪除）的訂單與剩貨，不覆蓋現有資料 */
async function restoreBackup(data){
  let keys = null;
  const cur = Vault.meta();
  if (Vault.keys && data.meta && cur && await kidOf(data.meta) === await kidOf(cur)) keys = Vault.keys;
  if (!keys) {
    if (!data.meta) { toast("這份備份沒有金鑰，無法復原", true); return; }
    keys = await askPassword({ title: "輸入備份的店家密碼", min: data.meta.shared ? 8 : 4, ok: "復原",
      msg: `這份備份建立於 ${when(data.at)}。請輸入當時使用的店家密碼。`,
      check: async pw => (await Backup.keys(data.meta, pw)) || "密碼不正確" });
    if (!keys) return;
  }
  await Backup.snapshot("before-restore");
  const local = new Map(Vault.records().map(r => [r.id, r]));
  let n = 0, bad = 0;
  for (const rec of data.orders || []) {
    if (rec.del) continue;
    const l = local.get(rec.id);
    if (l && !l.del) continue;
    if (l && l.del) { Vault.restore([rec.id]); n++; continue; }
    try { const o = await Backup.openRec(keys, rec); o.id = rec.id; await Vault.put(o); n++; } catch (e) { bad++; }
  }
  let s = 0;
  try { s = Backup.restoreStock(await Backup.openStock(keys, data), !!StockCfg.get().room); } catch (e) {}
  await Vault.reload();
  toast(n || s ? `已復原 ${n} 筆訂單${s ? `、${s} 筆剩貨` : ""}${bad ? `（${bad} 筆無法解開）` : ""}` : "備份裡的資料這支手機都已經有了");
  Sync.soon();
  showManage();
}

async function rotatePassword(oldPw, newPw, say){
  const oldRoom = Sync.cfg().room;
  say("同步最新資料…");
  if ((await roomOf(oldPw)).room !== oldRoom) throw new Error("pw");
  const rd0 = await Cloud.room(oldRoom);
  if (rd0 && rd0.retired && !Sync.cfg().rotating) throw new Error("retired");
  if (!Sync.cfg().rotating) {
    Sync.upd({ need: "" });
    await Sync.run(true); await Sync.run(true);
    if (Sync.need() || Vault.records().some(r => r.p) || Sync.merges().length) throw new Error("pending");
    await Backup.snapshot("before-rotate");
  }
  say("產生新金鑰…");
  const newRoom = (await roomOf(newPw)).room;
  let meta;
  const rot = Sync.cfg().rotating;
  if (rot && rot.room === newRoom) {
    const r = await Cloud.enter(newPw);
    if (r.state !== "joined") throw new Error("taken");
    meta = r.meta;
  } else {
    if (await Cloud.room(newRoom)) throw new Error("taken");
    const ring = await Vault.rawKeys(Vault.meta(), oldPw);
    if (!ring) throw new Error("pw");
    const nm = await Vault.makeMeta(newPw, true, ring);
    const r = await Cloud.enter(newPw, { create: true, newMeta: nm });
    if (r.state !== "created") throw new Error("taken");   // 新密碼剛好是另一家舊版店家的密碼：不能用
    meta = nm;
    Sync.upd({ rotating: { room: newRoom } });
  }
  say("停用舊密碼…");
  const rd = await Cloud.room(oldRoom);
  if (!rd || !rd.retired) await Cloud.retire(oldRoom);
  say("搬移資料…");
  const docs = await Cloud.list(oldRoom);
  const have = new Set((await Cloud.list(newRoom)).map(d => d.id));
  const newPub = await crypto.subtle.importKey("jwk", meta.pub, RSA, false, ["wrapKey"]), newKid = await kidOf(meta);
  const oldSK = await stockKeyOf(oldPw), newSK = await stockKeyOf(newPw), uid = await Cloud.uid();
  let writes = [], n = 0;
  for (const d of docs) {
    if (d.id === "_meta" || have.has(d.id) || !d.data.ct) continue;
    let iv = d.data.iv, ct = d.data.ct, kid = d.data.kid;
    if (ORDER_ID.test(d.id)) {
      try { const o = await Vault.open(Sync.fromDoc(d)); const s = await Vault.seal(o, newPub, newKid); iv = s.iv; ct = s.wk + "." + s.ct; kid = newKid; } catch (e) {}   // 解不開的照原樣搬，不遺失
    } else if (STOCK_ID.test(d.id)) {
      try { const s = await aesSeal(newSK, await aesOpen(oldSK, iv, ct)); iv = s.iv; ct = s.ct; } catch (e) {}
    } else continue;
    const del = d.data.del || 0;
    writes.push(Cloud.write(`/rooms/${newRoom}/orders/${d.id}`, { iv, ct, upd: d.data.upd || 0, ver: 1, del, kid: kid || undefined, by: uid }, { stamp: del ? ["ts", "dts"] : true }));
    n++;
    if (writes.length >= 200) { await Cloud.commit(writes); writes = []; say(`搬移資料… ${n} 筆`); }
  }
  if (writes.length) await Cloud.commit(writes);
  say("確認資料…");
  const after = new Set((await Cloud.list(newRoom)).map(d => d.id));
  if (docs.some(d => d.id !== "_meta" && d.data.ct && (ORDER_ID.test(d.id) || STOCK_ID.test(d.id)) && !after.has(d.id))) throw new Error("verify");
  say("更新這支手機…");
  await Sync.switchTo(newRoom, meta, newPw);
  // 舊房間停用 7 天後才清除（規則也這樣限制），期間舊手機仍能把還沒上傳的資料帶過來
  Sync.upd({ rotating: null, purge: { room: oldRoom, after: Date.now() + 7 * DAY + 3600 * 1000 }, need: "" });
  await Sync.run(true);
}

const LUN_D = ["", "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十", "十一", "十二", "十三", "十四", "十五",

let lunarFmt = null;

function cnNum(s){
  if (/\d/.test(s)) return parseInt(s.replace(/\D/g, ""));
  s = s.replace(/[月日閏]/g, "").replace("初", "").replace("廿", "二十");
  if (s.length === 1) return CN[s] || 0;
  if (s[0] === "十") return 10 + (CN[s[1]] || 0);

  return CN[s[0]] || 0;
}
function lunar(d){
  if (!lunarFmt) return null;
  try {
    const p = lunarFmt.formatToParts(d);
    const m = p.find(x => x.type === "month").value, dd = p.find(x => x.type === "day").value;
    return { m: cnNum(m), d: cnNum(dd), leap: /閏/.test(m) };

}
function dayInfo(d){
  const info = { hol: "", wor: "", lun: "" };

  const tag = info.hol || info.wor;
  document.getElementById("todayLine").innerHTML =
    `今天 ${d.getMonth() + 1}/${d.getDate()}（星期${WK[d.getDay()]}）` +
    `<small>${lunTxt}${tag ? "・" + tag : ""}</small>`;
})();

/* 清空表單準備下一筆（和重新整理後的畫面一樣；單價會保留） */
function resetForm(){
  Object.keys(qty).forEach(k => { qty[k] = 0; const s = document.getElementById("s-" + k); if (s) { setQ(s, 0); s.classList.remove("on"); } });
  [amounts, pcPrice, want].forEach(o => Object.keys(o).forEach(k => delete o[k]));
  document.querySelectorAll("#menu [data-amt], #menu [data-pcp]").forEach(i => i.value = "");
  document.querySelectorAll("#menu [data-want]").forEach(b => b.classList.remove("on"));
  ["surname", "phone", "memo", "ptime", "deposit", "addr"].forEach(id => document.getElementById(id).value = "");
  title = ""; document.querySelectorAll("#titleSeg button").forEach(x => { x.classList.remove("on"); x.setAttribute("aria-checked", false); });
  setWalk(false);
  market = ""; document.querySelectorAll("#marketSeg button").forEach(x => x.classList.remove("on")); paintMarket();
  pay = "none"; document.querySelectorAll("#paySeg button").forEach(x => x.classList.toggle("on", x.dataset.pay === "none"));
  document.getElementById("depositBox").style.display = "none";
  Object.assign(prep, { cut: "要切", pepper: "要", oil: "要", sauce: "要" });
  document.querySelectorAll(".seg[data-group]").forEach(seg => seg.querySelectorAll("button").forEach((x, i) => x.classList.toggle("on", i === 0)));
  ["nameErr", "phoneErr", "dateErr", "itemsErr", "addrErr"].forEach(id => showErr(id, false));
  paintAddr(); fillTimes();
  editing = null; $id("editBar").hidden = true;
  setDate("");
  modal.classList.remove("show");
  update();
  window.scrollTo({ top: 0 });
}

/* 打字時隱藏底部列，避免手機鍵盤彈出時畫面跳動 */
document.addEventListener("focusin", e => { if (e.target.matches("input,textarea")) document.body.classList.add("typing"); });
document.addEventListener("focusout", () => setTimeout(() => {
  if (!document.activeElement || !document.activeElement.matches("input,textarea")) document.body.classList.remove("typing");
}, 100));

render();
// LINE 中午提醒的按鈕：?today 直接打開「今天」的訂單
if (/[?&]today\b/.test(location.search)) {
  listFilter = "today";
  history.replaceState(null, "", location.pathname);
  setTimeout(openOrders, 300);
}
</script>
