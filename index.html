<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="訂購">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>煙燻滷味訂購</title>
<style>
  :root{
    --paper:#F7F6F3; --card:#FFFFFF; --ink:#1E1A17; --sub:#8A847D; --hair:#ECE9E4; --fill:#F1EFEB; --fill-press:#E6E3DE;
    --soy:#7B1F24; --soy-press:#5E171B; --soy-tint:#F5E9E9;
    --gold:#9A6B17; --gold-soft:#F7F0E1; --red:#B3261E; --red-soft:#FBECEA;
    --r:14px; --gut:16px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
    padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  input,textarea,button{-webkit-appearance:none;appearance:none;font-family:inherit;color:inherit}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  button{touch-action:manipulation;cursor:pointer;border:none;background:none;padding:0}
  :focus-visible{outline:2px solid var(--soy);outline-offset:2px}
  .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* 頂部 */
  .top{position:sticky;top:0;z-index:5;background:rgba(247,246,243,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    padding:calc(10px + env(safe-area-inset-top)) var(--gut) 10px;border-bottom:1px solid var(--hair)}
  .top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
  .today{margin:2px 0 0;font-size:13px;color:var(--sub)}
  .today small{font-size:13px;color:var(--sub)}
  .today small{display:block;margin-top:1px}
  .hdr-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:20px;background:var(--card);
    border:1px solid var(--hair);font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
  .hdr-btn:active{background:var(--fill-press)}

  main{max-width:600px;margin:0 auto;padding:4px var(--gut) 24px}
  .sec{margin:22px 4px 8px;font-size:13px;font-weight:500;color:var(--sub);display:flex;align-items:baseline;gap:6px}
  .sec span{font-weight:400}
  .card{background:var(--card);border-radius:var(--r);padding:0 14px}

  /* 行內列 */
  .line{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-top:1px solid var(--hair)}
  .card > .line:first-child,.card > .block:first-child + .line,.card > :first-child{border-top:none}
  .block{padding:12px 0;border-top:1px solid var(--hair)}
  .lbl{flex:none;width:52px;font-size:15px;color:var(--sub)}
  .line input[type=text],.line input[type=number],.line input[type=time]{flex:1;min-width:0;height:44px;border:none;background:transparent;
    font-size:16px;padding:0;outline:none;border-radius:0}
  .line input[type=time]{text-align:left;display:flex;align-items:center}
  input::placeholder,textarea::placeholder{color:#B9B3AC}
  textarea{flex:1;min-width:0;border:none;background:transparent;font-size:16px;padding:12px 0;resize:none;outline:none;line-height:1.45}
  .line.memo{align-items:flex-start}
  .line.memo .lbl{padding-top:12px}
  .err{color:var(--red);font-size:13px;padding:0 0 10px 64px;display:none}
  .owe{flex:none;font-size:14px;color:var(--sub)}

  .field-btn{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:16px}
  .field-btn .ic{color:#B9B3AC}
  .date-field.empty #dateLabel{color:#B9B3AC}
  #dateLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 橫向選擇按鈕 */
  .seg{display:flex;gap:4px;padding:3px;background:var(--fill);border-radius:12px;flex:1;min-width:0}
  .seg button{flex:1;min-width:0;min-height:42px;border-radius:9px;font-size:15px;color:var(--ink);white-space:nowrap;
    transition:background .12s,transform .08s}
  .seg button:active{transform:scale(.96);background:var(--fill-press)}
  .seg button.on{background:var(--soy);color:#fff}
  .seg button.on:active{background:var(--soy-press)}
  .seg.small{flex:none;width:136px}
  .chips{display:flex;gap:6px;padding:0 0 12px 64px}
  .chips button{flex:1;min-width:0;min-height:36px;padding:0 6px;border-radius:18px;background:var(--fill);font-size:13px;white-space:nowrap}
  .chips button:active{background:var(--fill-press)}
  .chips button.on{background:var(--soy);color:#fff}

  /* 品項（行內） */
  .it{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-top:1px solid var(--hair)}
  .card > .it:first-child,.card > .grp:first-child{border-top:none}
  .grp{border-top:1px solid var(--hair);padding-top:12px}
  .grp-name{font-size:16px;font-weight:500}
  .grp .it{border-top:none;min-height:56px;padding:4px 0 4px 12px}
  .grp .it + .it{border-top:1px dashed var(--hair)}
  .grp .it-sub{margin-top:0;font-size:15px}
  .grp .it-sub .spec{color:var(--ink);min-width:44px}
  .it-main{flex:1;min-width:0}
  .it-name{font-size:16px;font-weight:500;line-height:1.3}
  .it-sub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-top:4px;font-size:13px;color:var(--sub)}
  .pin{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px;background:var(--fill);border-radius:8px;color:var(--sub)}
  .pin input{width:58px;height:32px;border:none;background:transparent;font-size:16px;color:var(--ink);padding:0;outline:none;text-align:left}
  .pin:focus-within{background:var(--soy-tint);color:var(--soy)}
  .wtag{color:var(--gold)}

  .stepper{flex:none;display:flex;align-items:center;gap:2px}
  .stepper button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fill);
    color:var(--ink);transition:background .12s,transform .08s}
  .stepper button .ic{width:18px;height:18px;stroke-width:2.2}
  .stepper button:active{transform:scale(.9);background:var(--fill-press)}
  .stepper button[data-d="1"]{background:var(--soy-tint);color:var(--soy)}
  .stepper button[data-d="1"]:active{background:var(--soy);color:#fff}
  .stepper .q{min-width:28px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums;color:#C4BEB7}
  .stepper.on .q{color:var(--ink);font-weight:600}
  .stepper:not(.on) button[data-d="-1"]{color:#C4BEB7}
  .want{flex:none;min-width:72px;min-height:44px;border-radius:22px;background:var(--fill);font-size:15px;transition:background .12s,transform .08s}
  .want:active{transform:scale(.94);background:var(--fill-press)}
  .want.on{background:var(--soy);color:#fff}
  .want::after{content:"要"}
  .want.on::after{content:"已選"}

  /* 底部訂單列 */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--hair);padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom))}
  .bar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .sum{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .sum-l{font-size:13px;color:var(--sub)}
  .sum b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  body.typing .bar{display:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;
    background:var(--soy);color:#fff;font-size:16px;font-weight:500;white-space:nowrap;transition:background .12s,transform .08s}
  .btn:active{transform:scale(.97);background:var(--soy-press)}
  .btn:disabled{opacity:.55}
  .btn.ghost{background:var(--fill);color:var(--ink)}
  .btn.ghost:active{background:var(--fill-press)}
  .btn.small{min-height:44px;padding:0 12px;font-size:15px;border-radius:10px}
  .btn.share{background:var(--soy);color:#fff}
  .bar .btn{min-width:132px}

  /* 底部彈窗 */
  .modal{position:fixed;inset:0;background:rgba(30,26,23,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.show{display:flex}
  .sheet{position:relative;background:var(--paper);width:100%;max-width:600px;max-height:90vh;max-height:90dvh;overflow:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:18px 18px 0 0;
    padding:26px var(--gut) calc(20px + env(safe-area-inset-bottom))}
  .sheet::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#D8D4CE}
  .sheet h3{margin:0 0 14px;font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px}
  .sheet h3 .ic{width:22px;height:22px;color:var(--soy)}
  .rows{background:var(--card);border-radius:var(--r);padding:0 14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--hair);font-size:15px}
  .rows .row:first-child{border-top:none}
  .row span:first-child{color:var(--sub);flex:none}
  .row span:last-child{text-align:right;min-width:0}
  .rows.items .row span:first-child{color:var(--ink);flex:1}
  .total{font-size:17px;font-weight:600}
  .total span:first-child{color:var(--ink)!important}
  .actions{display:flex;gap:10px;margin-top:12px}
  .actions .btn{flex:1;min-width:0}
  .note{font-size:13px;color:var(--sub);margin:0 0 12px}

  .order{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .order.pending{box-shadow:inset 3px 0 0 var(--gold)}
  .pend-tag{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);margin-bottom:8px}
  .pend-tag .ic{width:16px;height:16px}
  .order-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .order-btns .weigh-btn{grid-column:1 / -1;background:var(--gold-soft);color:var(--gold)}
  .order-btns .weigh-btn:active{background:#EFE3C8}
  .order-btns .btn{min-width:0}
  .preview{white-space:pre-wrap;word-break:break-word;background:var(--card);border-radius:var(--r);padding:14px;font-family:inherit;
    font-size:15px;line-height:1.7;margin:0 0 12px;user-select:text;-webkit-user-select:text}
  .order .preview{background:var(--paper);border-radius:10px;padding:12px}

  .share-actions{display:flex;gap:10px;margin-top:4px}
  .share-actions .btn{flex:1;min-width:0;padding:0 12px}
  @media (max-width:380px){ .share-actions{flex-direction:column} }
  @media (max-width:340px){ .order-btns{grid-template-columns:1fr} .seg.small{width:120px} .pin input{width:46px} .grp .it-sub .spec{min-width:0} .grp .it{padding-left:6px} }

  .toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;z-index:20;
    background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.5;text-align:center;
    opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .toast.err{background:var(--red)}

  /* 日曆 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-size:18px;font-weight:600}
  .cal-head button{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:22px;color:var(--ink)}
  .cal-head button:active{background:var(--fill-press)}
  .cal-head button:disabled{opacity:.3}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wk{text-align:center;font-size:14px;color:var(--sub);padding:4px 0}
  .cal-wk:first-child,.cal-wk:last-child{color:var(--red)}
  .cal-d{min-height:66px;border:1.5px solid transparent;border-radius:10px;background:var(--card);padding:5px 1px;display:flex;flex-direction:column;
    align-items:center;gap:1px;transition:transform .08s}
  .cal-d:active{transform:scale(.94)}
  .cal-d .n{font-size:16px;font-weight:500;line-height:1.2}
  .cal-d .l{font-size:12px;color:var(--sub);line-height:1.2}
  .cal-d .h{font-size:12px;line-height:1.15;max-width:100%;word-break:break-all}
  .cal-d.hol{background:var(--red-soft)}
  .cal-d.hol .n,.cal-d.hol .h{color:var(--red)}
  .cal-d.wor{background:var(--gold-soft)}
  .cal-d.wor .h{color:var(--gold)}
  .cal-d.today{border-color:var(--ink)}
  .cal-d.sel{background:var(--soy);border-color:var(--soy)}
  .cal-d.sel .n,.cal-d.sel .l,.cal-d.sel .h{color:#fff}
  .cal-d:disabled{opacity:.3}
  .cal-legend{display:flex;gap:16px;font-size:14px;color:var(--sub);margin-top:12px;flex-wrap:wrap}
  .cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .mk-warn{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:#FBF1DE;color:#8A5A00;font-size:14px;font-weight:500;text-align:center}
  #marketSeg.need{box-shadow:0 0 0 2px #E2A33B}
  .mk-pick{display:grid;grid-template-columns:1fr;gap:8px}
  .mk-pick .btn{min-height:52px;font-size:17px}
  @media (max-width:430px){ .sync-pill{font-size:0;gap:0;padding:0 12px} }   /* 窄螢幕只留同步圓點 */
  /* UX 調整 */
  .it.picked{background:var(--soy-tint);margin:0 -14px;padding-left:14px;padding-right:14px;box-shadow:inset 4px 0 0 var(--soy)}
  .grp .it.picked{padding-left:26px}
  .it.picked .it-name,.it.picked .spec{color:var(--soy);font-weight:600}
  .err.box{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--red-soft);font-size:15px}
  .err{font-size:14px}
  .sheet h3.bad{color:var(--red)}
  .state{padding:10px 12px;border-radius:12px;font-size:15px;margin:-4px 0 12px;line-height:1.5}
  .state.ok{background:#E7F2EA;color:#2F6B3D}
  .state.warn{background:#FBF1DE;color:#8A5A00}
  .state.bad{background:var(--red-soft);color:var(--red)}
  .net-bar,.edit-bar{position:sticky;z-index:4;padding:9px 16px;font-size:14px;text-align:center}
  .net-bar{top:0;background:#FBF1DE;color:#8A5A00}
  .edit-bar{top:0;background:var(--soy);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
  .edit-bar .link-btn{color:#fff;min-height:36px}
  .pend-n{color:#B26A00;font-size:13px}
  .order-btns{margin-top:8px}
  .order .weigh-btn{width:100%;background:var(--gold-soft);color:var(--gold)}
  .order-tools{flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:2px 10px;margin-top:6px}
  .del-btn{margin-left:auto;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #E9C2BE;color:var(--red);font-size:14px;background:#fff}
  .del-btn:active{background:var(--red-soft)}
  /* 姓氏＋稱謂 */
  #surname{flex:1;min-width:0}
  #titleSeg{width:128px}
  /* 對話框 */
  .dlg{position:fixed;inset:0;z-index:30;background:rgba(30,26,23,.45);display:none;align-items:center;justify-content:center;padding:20px}
  .dlg.show{display:flex}
  .dlg-box{background:var(--card);border-radius:16px;width:100%;max-width:340px;padding:20px}
  .dlg-box h4{margin:0 0 8px;font-size:18px;font-weight:600}
  .dlg-box p{margin:0 0 14px;font-size:15px;color:var(--sub);line-height:1.55}
  .dlg-btns{display:flex;gap:10px;margin-top:6px}
  .dlg-btns .btn{flex:1;min-width:0;padding:0 10px}
  .pin-in{width:100%;height:48px;border:none;border-radius:10px;background:var(--fill);font-size:20px;letter-spacing:.3em;text-align:center;margin-bottom:10px;outline:none}
  .pin-in:focus{background:var(--soy-tint)}
  .dlg-err{color:var(--red);font-size:13px;min-height:18px;margin:-4px 0 6px}
  .btn.danger{background:var(--red);color:#fff}
  .btn.danger:active{background:#8F1E18}
  .link-btn{min-height:44px;padding:0 4px;font-size:14px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
  .link-btn.danger{color:var(--red)}
  .link-btn:active{opacity:.6}
  /* 電話保護 */
  .phone-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 10px;font-size:13px;color:var(--sub)}
  .phone-opt .warn{color:var(--red)}
  .order-tools{display:flex;justify-content:space-between;gap:4px;margin-top:4px}
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .list-head h3{margin:0}
  .privacy{font-size:12px;color:var(--sub);margin:0 0 12px}
  .prep-open{width:100%;margin-bottom:8px}
  .hdr-right{display:flex;align-items:center;gap:6px;flex:none}
  [hidden]{display:none!important}
  .sync-pill{min-height:40px;padding:0 10px;border-radius:20px;font-size:12px;color:var(--sub);background:transparent;display:inline-flex;align-items:center;gap:5px}
  .sync-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:#5B9A68}
  .sync-pill.busy::before{background:var(--gold)}
  .sync-pill.off::before,.sync-pill.err::before{background:var(--red)}
  .sync-box{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;color:var(--sub);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sync-box b{color:var(--ink);font-weight:500}
  .sync-box.cta{display:block}
  .sync-box.cta .btn{width:100%;margin-top:10px}
  .pw-in{width:100%;height:48px;border:none;border-radius:10px;background:var(--fill);font-size:17px;padding:0 14px;margin-bottom:10px;outline:none}
  .pw-in:focus{background:var(--soy-tint)}
  .sync-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .sync-btns .btn{min-width:0}
  .sync-btns .btn:only-child{grid-column:1 / -1}
  .code-in{width:100%;min-height:110px;border:none;border-radius:12px;background:var(--card);padding:12px;font-size:14px;font-family:ui-monospace,Menlo,monospace;
    word-break:break-all;resize:vertical;outline:none;margin-bottom:10px}
  .code-in:focus{box-shadow:0 0 0 2px var(--soy-tint)}
  .sheet .pin-in{background:var(--card)}
  .file-btn{position:relative;overflow:hidden}
  .file-btn input{position:absolute;inset:0;opacity:0;font-size:16px}
  @media (max-width:340px){ .sync-btns{grid-template-columns:1fr} }
  .day-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:var(--r);padding:4px;margin-bottom:10px}
  .day-nav button{width:44px;height:44px;border-radius:12px;font-size:22px}
  .day-nav button:active{background:var(--fill-press)}
  .day-nav b{font-size:17px;font-weight:600;text-align:center}
  .day-nav b small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
  .prep-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .prep-stats div{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center}
  .prep-stats b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .prep-stats span{font-size:12px;color:var(--sub)}

<script>
/* 線條 icon */
const ICON = (() => {
  const svg = d => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  return {
    plus:  svg('<path d="M12 5v14M5 12h14"/>'),
    minus: svg('<path d="M5 12h14"/>'),
    share: svg('<path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/>'),
    copy:  svg('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/>'),
    scale: svg('<path d="M12 4v16M7 20h10M5 8h14M5 8l-3 6a3 3 0 0 0 6 0zM19 8l-3 6a3 3 0 0 0 6 0z"/>'),
    check: svg('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>'),
    download: svg('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 15v3.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V15"/>'),
    edit:  svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
    list:  svg('<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>'),
  };
})();

/* =====================================================
   品項清單
   單價直接在網頁上打，會自動記住（同一台裝置下次打開還在）
   price 是預設值，可留 0
   ===================================================== */
const MENU = [
  { cat: "煙燻", items: [
    { name: "雞肉",   opts: [{ label: "一隻", price: 0 }, { label: "半隻", price: 0 }] },
    { name: "鴨肉",   opts: [{ label: "一隻", price: 0 }, { label: "半隻", price: 0 }, { label: "前半", price: 0 }, { label: "後半", price: 0 }] },
    { name: "鴨頭",   opts: [{ label: "一支", price: 0 }] },
    { name: "鴨翅",   opts: [{ label: "一支", price: 0 }] },
    { name: "豬頭皮", type: "amount" },                 // 客人自填要買多少錢
    { name: "腱子肉", type: "piece" },                  // 秤重：一塊多少錢 × 幾塊
    { name: "魚板",   opts: [{ label: "一個", price: 0 }] },
    { name: "鳥蛋",   opts: [{ label: "一份（4個）", price: 0 }] },
    { name: "甜不辣", opts: [{ label: "一份（4個）", price: 0 }] },
    { name: "雞脖",   opts: [{ label: "一個", price: 0 }] },
    { name: "豬舌頭", opts: [{ label: "一顆", price: 0 }, { label: "半顆", price: 0 }] },
    { name: "豬心",   opts: [{ label: "一顆", price: 0 }, { label: "半顆", price: 0 }] },
    { name: "鴨心",   opts: [{ label: "一個", price: 0 }] },
    { name: "鴨舌",   opts: [{ label: "一個", price: 0 }] },
    { name: "鴨胗",   opts: [{ label: "一個", price: 0 }] },
    { name: "雞腳",   type: "money" },                  // 客人說要買多少錢（不用秤重）
  ]},
  { cat: "滷味", items: [
    { name: "米血",     opts: [{ label: "一片", price: 0 }] },
    { name: "豆乾",     opts: [{ label: "一個", price: 0 }] },
    { name: "海帶",     opts: [{ label: "一個", price: 0 }] },
    { name: "鴨胗",     opts: [{ label: "一個", price: 0 }] },
    { name: "鴨腸",     type: "amount" },               // 秤重：要買多少錢
    { name: "口香糖",   type: "amount" },
    { name: "大腸",     type: "amount" },
    { name: "百頁豆腐", opts: [{ label: "一個", price: 0 }] },
    { name: "豆包",     opts: [{ label: "一個", price: 0 }] },
    { name: "麵腸",     opts: [{ label: "一個", price: 0 }] },
    { name: "滷蛋",     opts: [{ label: "一個", price: 0 }] },
    { name: "雞肝",     opts: [{ label: "一個", price: 0 }] },
  ]},
];

const qty = {};      // key -> 數量
const amounts = {};  // key -> 金額（豬頭皮）
const prices = {};   // key -> 單價（頁面上直接打）
const pcPrice = {};  // key -> 腱子肉每塊金額（秤重，每次不同）
const want = {};     // key -> 秤重品項有沒有要
let savedPrices = {};
try { savedPrices = JSON.parse(localStorage.getItem("prices") || "{}"); } catch (e) {}
function savePrices(){ try { localStorage.setItem("prices", JSON.stringify(prices)); } catch (e) {} }

/* 排列：同一個字開頭的放在一起；不同開頭的群組依字數由短到長，同群組內也依字數 */
function sortNames(arr, name){
  const g = {};
  arr.forEach((x, i) => { const n = name(x), f = n[0]; if (!g[f]) g[f] = { min: n.length, first: i }; else g[f].min = Math.min(g[f].min, n.length); });
  return arr.map((x, i) => [x, i]).sort((a, b) => {
    const na = name(a[0]), nb = name(b[0]), ga = g[na[0]], gb = g[nb[0]];
    return ga.min - gb.min || ga.first - gb.first || na.length - nb.length || a[1] - b[1];
  });
}
/* 顯示順序（資料仍用原本的位置，記住的單價不受影響） */
function byLen(items){ return sortNames(items, it => it.name); }

function render(){
  const menu = document.getElementById("menu");
  const stepper = key => `<div class="stepper" id="s-${key}">
      <button type="button" data-k="${key}" data-d="-1" aria-label="減少">${ICON.minus}</button>
      <span class="q">0</span>
      <button type="button" data-k="${key}" data-d="1" aria-label="增加">${ICON.plus}</button></div>`;
  const priceIn = (attr, key, val, ph) =>
    `<label class="pin">$<input type="number" min="0" inputmode="numeric" ${attr}="${key}" value="${val || ""}" placeholder="${ph}"></label>`;
  MENU.forEach((sec, si) => {
    const h = document.createElement("h2");
    h.className = "sec";
    h.innerHTML = `${sec.cat}<span>${sec.items.length} 項</span>`;
    menu.appendChild(h);
    const card = document.createElement("section");
    card.className = "card";
    let html = "";
    byLen(sec.items).forEach(([it, ii]) => {
      if (it.type === "money") {
        const key = `${si}-${ii}-amt`;
        html += `<div class="it"><div class="it-main"><div class="it-name">${it.name}</div>
          <div class="it-sub">要買 ${priceIn("data-amt", key, "", "金額")}</div></div>
          <button type="button" class="want" data-want="${key}" aria-label="${it.name}要不要"></button></div>`;
      } else if (it.type === "amount") {
        const key = `${si}-${ii}-amt`;
        html += `<div class="it"><div class="it-main"><div class="it-name">${it.name}</div>
          <div class="it-sub">約 ${priceIn("data-amt", key, "", "金額")}<span class="wtag">秤重</span></div></div>
          <button type="button" class="want" data-want="${key}" aria-label="${it.name}要不要"></button></div>`;
      } else if (it.type === "piece") {
        const key = `${si}-${ii}-pc`;
        qty[key] = 0;
        html += `<div class="it"><div class="it-main"><div class="it-name">${it.name}</div>
          <div class="it-sub">一塊約 ${priceIn("data-pcp", key, "", "可不填")}<span class="wtag">按塊・秤重</span></div></div>
          ${stepper(key)}</div>`;
      } else {
        const rows = it.opts.map((o, oi) => {
          const key = `${si}-${ii}-${oi}`;
          qty[key] = 0;
          const saved = savedPrices[key];
          prices[key] = saved !== undefined ? saved : (o.price || 0);
          const ph = it.unit ? "一" + it.unit + "多少" : "單價";
          const multi = it.opts.length > 1;
          return `<div class="it"><div class="it-main">
              ${multi ? "" : `<div class="it-name">${it.name}</div>`}
              <div class="it-sub"><span class="spec">${o.label}</span>${priceIn("data-p", key, prices[key], ph)}</div></div>
            ${stepper(key)}</div>`;
        }).join("");
        html += it.opts.length > 1 ? `<div class="grp"><div class="grp-name">${it.name}</div>${rows}</div>` : rows;
      }
    });
    card.innerHTML = html;
    menu.appendChild(card);
  });

  menu.addEventListener("click", e => {
    const w = e.target.closest("button[data-want]");
    if (w) { const k = w.dataset.want; want[k] = !want[k]; w.classList.toggle("on", want[k]); update(); return; }
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const k = b.dataset.k;
    qty[k] = Math.max(0, qty[k] + Number(b.dataset.d));
    const s = document.getElementById("s-" + k);
    s.querySelector(".q").textContent = qty[k];
    s.classList.toggle("on", qty[k] > 0);
    update();
  });
  menu.addEventListener("input", e => {
    if (e.target.dataset.amt) {
      const k = e.target.dataset.amt; amounts[k] = Number(e.target.value) || 0;
      if (amounts[k] > 0 && !want[k]) { want[k] = true; menu.querySelector(`[data-want="${k}"]`).classList.add("on"); }
      update();
    }
    if (e.target.dataset.pcp) { pcPrice[e.target.dataset.pcp] = Number(e.target.value) || 0; update(); }
    if (e.target.dataset.p) { prices[e.target.dataset.p] = Number(e.target.value) || 0; savePrices(); update(); }
  });
}

function getLines(){
  const lines = [];
  MENU.forEach((sec, si) => byLen(sec.items).forEach(([it, ii]) => {
    if (it.type === "money") {
      const k = `${si}-${ii}-amt`, a = amounts[k] || 0;
      if (want[k] || a > 0) lines.push({ cat: sec.cat, nm: it.name, kind: "amount", q: 1, weigh: false, est: null,
        short: it.name, item: `${it.name} $${a}`, text: `【${sec.cat}】${it.name}`, sub: a > 0 ? a : null });
    } else if (it.type === "amount") {
      const k = `${si}-${ii}-amt`, a = amounts[k] || 0;
      if (want[k] || a > 0) lines.push({ cat: sec.cat, nm: it.name, kind: "amount", q: 1, weigh: true, est: a || null,
        short: `${it.name}${a ? " 約$" + a : ""}`, item: `${it.name}${a ? " 約$" + a : ""}`,
        text: `【${sec.cat}】${it.name}${a ? " 約$" + a : ""}`, sub: null });
    } else if (it.type === "piece") {
      const k = `${si}-${ii}-pc`, q = qty[k], p = pcPrice[k] || 0;
      if (q > 0) lines.push({ cat: sec.cat, nm: it.name, kind: "piece", q, weigh: true, est: p ? p * q : null, short: `${it.name}×${q}塊`, item: `${it.name} × ${q} 塊`,
        text: `【${sec.cat}】${it.name} × ${q} 塊${p ? "　一塊約$" + p : ""}`, sub: null });
    } else {
      it.opts.forEach((o, oi) => {
        const k = `${si}-${ii}-${oi}`, q = qty[k], p = prices[k];
        const lab = it.opts.length > 1 ? o.label.replace(/\s*一份/, "") : "";
        if (q > 0) lines.push({ cat: sec.cat, nm: it.name, sp: o.label, kind: "qty", q, short: `${it.name}${lab}×${q}${it.unit || ""}`, item: `${it.name}（${o.label}）× ${q}${p ? "　單價$" + p : ""}`,
          text: `【${sec.cat}】${it.name}（${o.label}）× ${q}${p ? "　@$" + p : ""}`, sub: p ? p * q : null });
      });
    }
  }));
  return lines;
}

/* 防注入：任何要放進 HTML 的文字都先轉義 */
function escapeHtml(s){ return String(s ?? "").replace(/[&<>"'`]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" }[c])); }

/* 電話遮蔽：0912-***-678 */
function maskPhone(p){
  const d = String(p || "").replace(/\D/g, "");
  if (d.length >= 10) return `${d.slice(0, 4)}-***-${d.slice(-3)}`;
  if (d.length > 4) return `${d.slice(0, 2)}***${d.slice(-2)}`;
  return "***";
}

/* 產生可複製的純文字訂單 */
/* opts.fullPhone=true 才會出現完整電話；預設遮蔽 */
function buildText(o, opts = {}){
  let t = `${o.name} ${opts.fullPhone ? String(o.phone || "") : maskPhone(o.phone)}\n`;
  if (o.odate) t += `訂購 ${fmtDate(o.odate)}\n`;
  if (o.date) t += `取貨 ${fmtDate(o.date)}${o.ptime ? " " + o.ptime : ""}${o.market ? "・" + o.market : ""}\n`;
  if (o.prep) t += prepText(o.prep) + "\n";
  if (o.memo) t += `備註：${o.memo}\n`;
  t += o.items.map(l => `${l.sub !== null && l.weigh ? (l.short || l.item).replace(/ 約\$\d+/, "") : (l.short || l.item)}${l.sub === null ? (l.weigh ? "（待秤）" : "") : " $" + l.sub}`).join("\n");
  o.total = calcTotal(o.items);
  t += `\n合計 $${o.total}${hasPending(o.items) ? "＋秤重另計" : ""}`;
  if (o.pay) t += `\n${payText(o)}`;
  return t;
}
function calcTotal(items){ return items.reduce((s, l) => s + (l.sub || 0), 0); }
function hasPending(items){ return items.some(l => l.weigh && l.sub === null); }

/* 複製文字（回傳 Promise：true=成功） */
function copyText(text, btn){
  const done = () => {
    if (btn) { const old = btn.innerHTML; btn.innerHTML = ICON.check + "已複製"; setTimeout(() => btn.innerHTML = old, 1500); }
    return true;
  };
  function fallback(){
    // iPhone 舊版 Safari 也能用的複製方式
    const ta = document.createElement("textarea");
    ta.value = text; ta.readOnly = true;
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    if (ok) return done();
    toast("沒辦法自動複製，請長按訂單文字，選「全選」再複製", true);
    const pre = btn && btn.closest(".sheet") && btn.closest(".sheet").querySelector("pre");
    if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    return false;
  }
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(done, () => fallback());
  }
  return Promise.resolve(fallback());
}

/* 手機原生分享（LINE、Messenger、AirDrop…）：只分享純文字，內容和複製的一樣 */
function canNativeShare(data){
  if (!window.isSecureContext || typeof navigator.share !== "function") return false;
  if (typeof navigator.canShare === "function") {
    try { return navigator.canShare(data); } catch (e) { return false; }
  }
  return true;   // 舊版 Safari 有 share 但沒有 canShare
}
let sharing = false;
async function shareText(text, btn){
  if (sharing) return;                      // 避免連點開兩次分享選單
  const data = { text };
  if (!canNativeShare(data)) {
    // 不支援分享 → 改成複製
    const ok = await copyText(text, btn);
    if (ok) toast("這支手機不支援分享，已改成「已複製」，請到 LINE 貼上");
    return ok ? "copied" : "fail";
  }
  sharing = true;
  const old = btn ? btn.innerHTML : "";
  if (btn) { btn.disabled = true; btn.textContent = "開啟分享中…"; }
  try {
    await navigator.share(data);            // 必須在使用者點擊時直接呼叫
    toast("已交給分享選單，請到 LINE 等 App 確認有送出");
    return "shared";
  } catch (e) {
    if (e && e.name === "AbortError") { toast("已取消，沒有分享"); return "cancel"; }
    toast("分享沒有成功，請改按「複製」再貼上", true);
    return "fail";
  } finally {
    sharing = false; if (btn) { btn.disabled = false; btn.innerHTML = old; }
  }
}

let toastTimer = null;
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), isErr ? 4000 : 2600);
}

/* 訂單預覽＋電話選項＋分享／複製（共用同一份 buildText） */
function shareBlock(shareLabel, copyLabel){
  return `<pre class="preview" data-preview></pre>
    <div class="phone-opt"><span data-phstate></span><button type="button" class="link-btn" data-phtoggle></button></div>
    <div class="share-actions">
      <button type="button" class="btn share" data-act="share">${ICON.share}${shareLabel}</button>
      <button type="button" class="btn ghost" data-act="copy">${ICON.copy}${copyLabel}</button></div>`;
}
function bindShare(root, o){
  let full = false;
  const pre = root.querySelector("[data-preview]"), st = root.querySelector("[data-phstate]"), tg = root.querySelector("[data-phtoggle]");
  const text = () => buildText(o, { fullPhone: full });
  const paint = () => {
    pre.textContent = text();
    st.textContent = full ? "分享內容含完整電話" : "電話已遮蔽";
    st.className = full ? "warn" : "";
    tg.textContent = full ? "改回遮蔽" : "改成完整電話";
  };
  tg.onclick = async () => {
    if (!full && !(await askConfirm({ title: "分享完整電話？", ok: "包含完整電話", danger: true,
      msg: "分享或複製出去的文字會有客人的完整手機號碼。只有確定對方需要時才這樣做。" }))) return;
    full = !full; paint();
  };
  root.querySelector('[data-act="share"]').onclick = e => shareText(text(), e.currentTarget);
  root.querySelector('[data-act="copy"]').onclick = e => copyText(text(), e.currentTarget);
  paint();
}

const dlg = document.getElementById("dlg"), dlgBox = document.getElementById("dlgBox");
function closeDlg(){ dlg.classList.remove("show"); dlgBox.innerHTML = ""; }
function askConfirm({ title, msg, ok = "確定", cancel = "取消", danger = false }){
  return new Promise(resolve => {
    dlgBox.innerHTML = `<h4>${escapeHtml(title)}</h4><p>${escapeHtml(msg)}</p>
      <div class="dlg-btns"><button type="button" class="btn ghost" data-no>${escapeHtml(cancel)}</button>
      <button type="button" class="btn ${danger ? "danger" : ""}" data-yes>${escapeHtml(ok)}</button></div>`;
    dlg.classList.add("show");
    dlgBox.querySelector("[data-no]").onclick = () => { closeDlg(); resolve(false); };
    dlgBox.querySelector("[data-yes]").onclick = () => { closeDlg(); resolve(true); };
  });
}

/* ===== 訂單加密保存 =====
   每筆訂單用 AES-GCM 加密，金鑰再用 RSA 公鑰包起來。
   接單存檔只需要公鑰（不用輸入密碼）；讀取需要私鑰，私鑰由店家密碼（PBKDF2）加密保存。
   所有資料只存在這支手機的瀏覽器，不會傳到任何伺服器。 */
const VAULT_KEY = "orderVault", ENC_KEY = "ordersEnc", LEGACY_KEY = "orders";
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }
function unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
const RSA = { name: "RSA-OAEP", hash: "SHA-256" };
const Vault = {
  pub: null, priv: null, orders: null,
  supported(){ return !!(window.isSecureContext && window.crypto && crypto.subtle); },
  meta(){ try { return JSON.parse(localStorage.getItem(VAULT_KEY) || "null"); } catch (e) { return null; } },
  exists(){ return !!this.meta(); },
  records(){ try { return JSON.parse(localStorage.getItem(ENC_KEY) || "[]"); } catch (e) { return []; } },
  writeRecords(r){ localStorage.setItem(ENC_KEY, JSON.stringify(r)); },
  legacy(){ try { const a = JSON.parse(localStorage.getItem(LEGACY_KEY) || "[]"); return Array.isArray(a) ? a.filter(o => o && o.items) : []; } catch (e) { return []; } },
  async pinKey(pin, salt, iter){
    const base = await crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  },
  async loadPub(){
    if (this.pub) return;
    const m = this.meta(); if (!m) throw new Error("no vault");
    this.pub = await crypto.subtle.importKey("jwk", m.pub, RSA, false, ["wrapKey"]);
  },
  async setup(pin){
    const kp = await crypto.subtle.generateKey({ ...RSA, modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["wrapKey", "unwrapKey"]);
    const pubJwk = await crypto.subtle.exportKey("jwk", kp.publicKey);
    const pk8 = await crypto.subtle.exportKey("pkcs8", kp.privateKey);
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 200000;
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.pinKey(pin, salt, iter), pk8);
    localStorage.setItem(VAULT_KEY, JSON.stringify({ v: 1, iter, salt: b64(salt), iv: b64(iv), priv: b64(ct), pub: pubJwk }));
    this.pub = null; await this.loadPub();
    this.priv = await crypto.subtle.importKey("pkcs8", pk8, RSA, false, ["unwrapKey"]);
    this.orders = [];
    await this.migrateLegacy();
  },
  async unlock(pin){
    const m = this.meta(); if (!m || typeof pin !== "string" || pin.length < 4 || pin.length > 64) return false;
    let pk8;
    try { pk8 = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(m.iv) }, await this.pinKey(pin, unb64(m.salt), m.iter), unb64(m.priv)); }
    catch (e) { return false; }
    this.priv = await crypto.subtle.importKey("pkcs8", pk8, RSA, false, ["unwrapKey"]);
    const list = [];
    for (const rec of this.records()) { try { list.push(await this.open(rec)); } catch (e) {} }
    this.orders = list.sort((a, b) => b.id - a.id);
    armIdle();
    return true;
  },
  lock(){ this.priv = null; this.orders = null; },
  /* 產生一組新的金鑰，私鑰用店家密碼加密 */
  async makeMeta(pw, shared){
    const kp = await crypto.subtle.generateKey({ ...RSA, modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["wrapKey", "unwrapKey"]);
    const pubJwk = await crypto.subtle.exportKey("jwk", kp.publicKey);
    const pk8 = await crypto.subtle.exportKey("pkcs8", kp.privateKey);
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 300000;
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.pinKey(pw, salt, iter), pk8);
    return { v: 2, shared: !!shared, iter, salt: b64(salt), iv: b64(iv), priv: b64(ct),
      pub: { kty: pubJwk.kty, n: pubJwk.n, e: pubJwk.e, alg: pubJwk.alg, ext: true } };
  },
  /* 換成新的金鑰（加入或建立店家同步），把手上的訂單用新金鑰重新加密 */
  async install(meta, pw, carry){
    const keep = carry || [];
    const old = localStorage.getItem(VAULT_KEY), oldRecs = localStorage.getItem(ENC_KEY);
    try {
      localStorage.setItem(VAULT_KEY, JSON.stringify(meta));
      this.pub = null; this.priv = null;
      if (!(await this.unlock(pw))) throw new Error("pw");
      const recs = [];
      for (const o of keep) { o.upd = o.upd || o.id; const rec = await this.seal(o); if (meta.shared) rec.p = 1; recs.push(rec); }
      this.writeRecords(recs);
      this.orders = keep.slice().sort((a, b) => b.id - a.id);
      localStorage.removeItem(LEGACY_KEY);
    } catch (e) {
      // 失敗就還原，不遺失資料
      if (old) localStorage.setItem(VAULT_KEY, old); else localStorage.removeItem(VAULT_KEY);
      if (oldRecs) localStorage.setItem(ENC_KEY, oldRecs);
      this.pub = null; this.lock();
      throw e;
    }
  },
  /* 把雲端的加密資料合併進來；回傳有變動的 id */
  async mergeRemote(remote, known){
    const local = this.records(), byId = new Map(local.map(r => [r.id, r])), rIds = new Set(remote.map(r => r.id));
    const changed = [], removed = [];
    for (const rr of remote) {
      const l = byId.get(rr.id);
      if (!l || (!l.p && rr.upd > (l.upd || 0))) { byId.set(rr.id, rr); changed.push(rr.id); }
    }
    for (const l of local) {
      if (rIds.has(l.id) || l.p) continue;
      if (known.has(l.id)) { byId.delete(l.id); removed.push(l.id); }   // 其他手機刪掉了
      else { l.p = 1; }                                                  // 還沒上傳過
    }
    this.writeRecords([...byId.values()].sort((a, b) => b.id - a.id));
    if (this.orders && this.priv) {
      for (const id of changed) {
        try { const o = await this.open(byId.get(id)); const j = this.orders.findIndex(x => x.id === id); if (j >= 0) this.orders[j] = o; else this.orders.push(o); } catch (e) {}
      }
      if (removed.length) this.orders = this.orders.filter(o => !removed.includes(o.id));
      this.orders.sort((a, b) => b.id - a.id);
    }
    return { changed, removed };
  },
  markPushed(id){ const r = this.records(); const x = r.find(y => y.id === id); if (x) { delete x.p; this.writeRecords(r); } },
  async seal(order){
    await this.loadPub();
    const k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, te.encode(JSON.stringify(order)));
    const wk = await crypto.subtle.wrapKey("raw", k, this.pub, { name: "RSA-OAEP" });
    return { id: order.id, iv: b64(iv), wk: b64(wk), ct: b64(ct), upd: order.upd || order.id };
  },
  async open(rec){
    const k = await crypto.subtle.unwrapKey("raw", unb64(rec.wk), this.priv, { name: "RSA-OAEP" }, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(rec.iv) }, k, unb64(rec.ct))));
  },
  async put(order){
    order.upd = Date.now();
    const rec = await this.seal(order);
    if (Sync.on()) rec.p = 1;                       // 等待上傳
    const r = this.records(), i = r.findIndex(x => x.id === order.id);
    if (i >= 0) r[i] = rec; else r.unshift(rec);
    this.writeRecords(r);
    Sync.soon();
    if (this.orders) {
      const j = this.orders.findIndex(x => x.id === order.id);
      if (j >= 0) this.orders[j] = order; else this.orders.unshift(order);
    }
  },
  async putRaw(order){
    const rec = await this.seal(order);
    const r = this.records(), i = r.findIndex(x => x.id === order.id);
    if (i >= 0) r[i] = rec; else r.unshift(rec);
    this.writeRecords(r);
    if (this.orders) { const j = this.orders.findIndex(x => x.id === order.id); if (j >= 0) this.orders[j] = order; else this.orders.unshift(order); }
  },
  remove(id){
    this.writeRecords(this.records().filter(x => x.id !== id));
    Sync.queueDelete([id]);
    if (this.orders) this.orders = this.orders.filter(x => x.id !== id);
  },
  clearOrders(){ Sync.queueDelete(this.records().map(r => r.id)); this.writeRecords([]); localStorage.removeItem(LEGACY_KEY); if (this.orders) this.orders = []; },
  wipe(){ [VAULT_KEY, ENC_KEY, LEGACY_KEY].forEach(k => localStorage.removeItem(k)); this.pub = null; this.lock(); },
  /* 舊版明碼訂單 → 加密後才刪除原資料，避免遺失 */
  async migrateLegacy(){
    const old = this.legacy(); if (!old.length) return 0;
    const used = new Set(this.records().map(r => r.id));
    let base = Date.now();
    const recs = [];
    for (const o of old) {
      let id = Number(o.id) || base--;
      while (used.has(id)) id = base--;
      used.add(id);
      const n = { ...o, id, name: String(o.name || ""), phone: String(o.phone || "").replace(/\D/g, "") };
      delete n.time;
      recs.push({ rec: await this.seal(n), order: n });
    }
    this.writeRecords([...recs.map(x => x.rec), ...this.records()]);
    if (this.records().length >= recs.length) localStorage.removeItem(LEGACY_KEY);
    if (this.orders) { this.orders.push(...recs.map(x => x.order)); this.orders.sort((a, b) => b.id - a.id); }
    return recs.length;
  },
};

/* ===== 雲端同步（Firebase；訂單加密後才上傳，雲端只有亂碼） =====
   房間代號由店家密碼推算，沒有密碼找不到資料；只連到 Google Firebase，不連其他地方。 */
const FB = { apiKey: "AIzaSyCpzgphKvbKT77QNIsdj4r43VwF-6dAp1o", projectId: "smoked-order" };
const FS = `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const SYNC_KEY = "syncCfg";
const Sync = {
  idToken: null, exp: 0, busy: false, again: false, last: 0, state: "", timer: null,
  cfg(){ try { return JSON.parse(localStorage.getItem(SYNC_KEY) || "null") || {}; } catch (e) { return {}; } },
  saveCfg(c){ localStorage.setItem(SYNC_KEY, JSON.stringify(c)); },
  on(){ return !!this.cfg().room; },
  known(){ return new Set(this.cfg().known || []); },
  async token(){
    if (this.idToken && Date.now() < this.exp - 60000) return this.idToken;
    const c = this.cfg();
    if (c.rt) {
      const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`, { method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(c.rt) });
      if (r.ok) { const j = await r.json(); this.idToken = j.id_token; this.exp = Date.now() + Number(j.expires_in) * 1000; this.saveCfg({ ...this.cfg(), rt: j.refresh_token }); return this.idToken; }
    }
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ returnSecureToken: true }) });
    if (!r.ok) throw new Error("auth");
    const j = await r.json(); this.idToken = j.idToken; this.exp = Date.now() + Number(j.expiresIn) * 1000;
    this.saveCfg({ ...this.cfg(), rt: j.refreshToken });
    return this.idToken;
  },
  async api(method, path, body){
    const t = await this.token();
    const r = await fetch(FS + path, { method, headers: { Authorization: "Bearer " + t, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined });
    if (r.status === 404 && method !== "PATCH") return null;
    if (!r.ok) throw new Error("http " + r.status);
    return method === "DELETE" ? null : r.json();
  },
  async roomId(pw){
    const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: te.encode("smoked-order/room/v1"), iterations: 300000, hash: "SHA-256" }, base, 256);
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
  },
  doc(rec){ return { fields: { iv: { stringValue: rec.iv }, ct: { stringValue: rec.wk + "." + rec.ct }, upd: { integerValue: String(rec.upd || 0) } } }; },
  rec(d){
    const f = d.fields || {}, parts = String((f.ct && f.ct.stringValue) || "").split(".");
    return { id: Number(d.name.split("/").pop()), iv: f.iv && f.iv.stringValue, wk: parts[0], ct: parts[1], upd: Number((f.upd && f.upd.integerValue) || 0) };
  },
  async getMeta(room){ const d = await this.api("GET", `/rooms/${room}/orders/_meta`); return d ? JSON.parse(d.fields.ct.stringValue) : null; },
  async putMeta(room, meta){ await this.api("PATCH", `/rooms/${room}/orders/_meta`, { fields: { iv: { stringValue: "meta" }, ct: { stringValue: JSON.stringify(meta) }, upd: { integerValue: "0" } } }); },
  async listAll(room){
    const out = []; let tok = "";
    do {
      const j = await this.api("GET", `/rooms/${room}/orders?pageSize=300` + (tok ? "&pageToken=" + encodeURIComponent(tok) : ""));
      ((j && j.documents) || []).forEach(d => { if (!d.name.endsWith("/_meta")) { const r = this.rec(d); if (Number.isFinite(r.id) && r.ct) out.push(r); } });
      tok = j && j.nextPageToken;
    } while (tok);
    return out;
  },
  queueDelete(ids){ if (!this.on() || !ids.length) return; const c = this.cfg(); c.dels = [...new Set([...(c.dels || []), ...ids])]; this.saveCfg(c); this.soon(); },
  soon(){ clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 300); },
  async run(){
    if (!this.on()) { this.paint(); return; }
    if (this.busy) { this.again = true; return; }
    if (!navigator.onLine) { this.state = "off"; this.paint(); return; }
    this.busy = true; this.state = "busy"; this.paint();
    try {
      const room = this.cfg().room;
      for (const id of this.cfg().dels || []) {
        await this.api("DELETE", `/rooms/${room}/orders/${id}`);
        const c = this.cfg(); c.dels = (c.dels || []).filter(x => x !== id); this.saveCfg(c);
      }
      for (const r of Vault.records().filter(r => r.p)) { await this.api("PATCH", `/rooms/${room}/orders/${r.id}`, this.doc(r)); Vault.markPushed(r.id); }
      const remote = await this.listAll(room);
      const { changed, removed } = await Vault.mergeRemote(remote, this.known());
      for (const r of Vault.records().filter(r => r.p)) { await this.api("PATCH", `/rooms/${room}/orders/${r.id}`, this.doc(r)); Vault.markPushed(r.id); }
      this.saveCfg({ ...this.cfg(), known: Vault.records().map(r => r.id) });
      this.last = Date.now(); this.state = "ok";
      if ((changed.length || removed.length) && Vault.orders && modal.classList.contains("show")) {
        if (sheet.dataset.sub === "list") showOrders(); else if (sheet.dataset.sub === "prep") showPrep();
      }
    } catch (e) { this.state = navigator.onLine ? "err" : "off"; }
    finally { this.busy = false; this.paint(); if (this.again) { this.again = false; this.soon(); } }
  },
  label(){
    const t = this.last ? new Date(this.last).toTimeString().slice(0, 5) : "";
    return { busy: "同步中…", off: "離線，有網路後會自動同步", err: "同步失敗，稍後自動重試", ok: `已同步 ${t}` }[this.state] || "等待同步";
  },
  paint(){
    const p = document.getElementById("syncPill");
    if (!this.on()) { p.hidden = true; return; }
    p.hidden = false;
    p.className = "sync-pill " + (this.state || "");
    p.textContent = { busy: "同步中", off: "離線", err: "未同步", ok: "已同步" }[this.state] || "同步";
    const box = document.getElementById("syncLine"); if (box) box.textContent = this.label();
  },
};

const pwField = (id, ph) => `<input class="pw-in" id="${id}" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" placeholder="${ph}">`;
function storeDialog(carry, intro){
  return new Promise(resolve => {
    const done = v => { closeDlg(); resolve(v); };
    const step1 = () => {
      dlgBox.innerHTML = `<h4>輸入店家密碼</h4>
        <p>${intro || ""}其他手機已經在用的話，輸入同一組密碼就會自動同步訂單；第一次建立請自己設定一組（至少 8 碼，忘記就無法找回）。</p>
        ${pwField("spw", "店家密碼")}<div class="dlg-err" id="pwErr"></div>
        <div class="dlg-btns"><button type="button" class="btn ghost" data-no>取消</button><button type="button" class="btn" data-yes>下一步</button></div>`;
      dlg.classList.add("show");
      const inp = document.getElementById("spw"), err = document.getElementById("pwErr"), yes = dlgBox.querySelector("[data-yes]");
      setTimeout(() => inp.focus(), 50);
      dlgBox.querySelector("[data-no]").onclick = () => done(false);
      const go = async () => {
        const pw = inp.value;
        if (pw.length < 8) { err.textContent = "店家密碼至少 8 碼"; return; }
        if (!navigator.onLine) { err.textContent = "第一次設定需要網路，請連上網路再試"; return; }
        yes.disabled = true; err.textContent = "連線中…";
        try {
          const room = await Sync.roomId(pw);
          const meta = await Sync.getMeta(room);
          if (meta) {
            err.textContent = "加入中…";
            await Vault.install(meta, pw, carry);
            Sync.saveCfg({ ...Sync.cfg(), room, known: [] });
            done("joined");
          } else step2(pw, room);
        } catch (e) { yes.disabled = false; err.textContent = "連不上同步伺服器，請確認網路後再試"; }
      };
      inp.onkeydown = e => { if (e.key === "Enter") go(); };
      yes.onclick = go;
    };
    const step2 = (pw, room) => {
      dlgBox.innerHTML = `<h4>建立新的店家同步</h4>
        <p>找不到使用這組密碼的店家，會用它建立新的。如果其他手機已經在用，請按「返回」確認密碼有沒有打錯。</p>
        ${pwField("spw2", "再輸入一次店家密碼")}<div class="dlg-err" id="pwErr"></div>
        <div class="dlg-btns"><button type="button" class="btn ghost" data-no>返回</button><button type="button" class="btn" data-yes>建立</button></div>`;
      const inp = document.getElementById("spw2"), err = document.getElementById("pwErr"), yes = dlgBox.querySelector("[data-yes]");
      setTimeout(() => inp.focus(), 50);
      dlgBox.querySelector("[data-no]").onclick = step1;
      yes.onclick = async () => {
        if (inp.value !== pw) { err.textContent = "兩次輸入不一樣"; return; }
        yes.disabled = true; err.textContent = "建立中…";
        try {
          const meta = await Vault.makeMeta(pw, true);
          await Sync.putMeta(room, meta);
          await Vault.install(meta, pw, carry);
          Sync.saveCfg({ ...Sync.cfg(), room, known: [] });
          done("created");
        } catch (e) { yes.disabled = false; err.textContent = "建立失敗，請確認網路後再試"; }
      };
    };
    step1();
  });
}

/* 等這一筆真的上傳完（最多 ms 毫秒），回傳 synced／offline／retry */
async function syncOne(id, ms){
  const end = Date.now() + ms;
  while (Date.now() < end) {
    const rec = Vault.records().find(r => r.id === id);
    if (!rec || !rec.p) return "synced";
    if (!navigator.onLine) return "offline";
    if (!Sync.busy) await Sync.run(); else await new Promise(r => setTimeout(r, 250));
  }
  const rec = Vault.records().find(r => r.id === id);
  return !rec || !rec.p ? "synced" : navigator.onLine ? "retry" : "offline";
}

/* 儲存結果：成功／只存在手機／同步失敗／沒存到，分開顯示 */
function showSaveResult(order, state, edited){
  const ok = !["fail", "nosupport"].includes(state);
  const msg = {
    synced: ["ok", "已儲存，並同步到所有手機"],
    local: ["ok", "已儲存在這支手機（沒有開啟多支手機同步）"],
    offline: ["warn", "目前離線：已存在這支手機，有網路後會自動同步"],
    retry: ["warn", "已存在這支手機，但還沒同步成功，會自動重試"],
    fail: ["bad", "訂單沒有儲存成功。請先按「分享」或「複製」保留內容，再按「再試一次」"],
    nosupport: ["bad", "這個網址無法加密存檔（需要 https 網址），這筆沒有儲存，請先分享或複製"],
  }[state];
  sheet.dataset.view = ""; sheet.dataset.sub = "";
  sheet.innerHTML = `<h3 class="${ok ? "" : "bad"}">${ok ? ICON.check : ""}${ok ? (edited ? "訂單已修改" : "訂單已儲存") : "訂單沒有儲存"}</h3>
    <div class="state ${msg[0]}">${msg[1]}</div>
    ${shareBlock("分享訂單", "複製訂單文字")}
    <div class="actions">${state === "fail" ? `<button type="button" class="btn" id="retrySave">再試一次</button>` : ""}
      <button type="button" class="btn ghost" id="nextOrder">${ok ? "下一筆" : "放棄這筆"}</button></div>`;
  bindShare(sheet, order);
  const rs = document.getElementById("retrySave");
  if (rs) rs.onclick = async () => {
    rs.disabled = true; rs.textContent = "儲存中…";
    try { await Vault.put(order);
      showSaveResult(order, !Sync.on() ? "local" : await syncOne(order.id, 8000), edited);
    } catch (e) { rs.disabled = false; rs.textContent = "再試一次"; toast("還是沒有儲存成功", true); }
  };
  document.getElementById("nextOrder").onclick = async () => {
    if (!ok && !(await askConfirm({ title: "放棄這筆訂單？", msg: "這筆沒有儲存，離開後就找不回來了。", ok: "放棄", danger: true }))) return;
    location.reload();
  };
}

  Object.keys(amounts).forEach(k => delete amounts[k]);
  Object.keys(want).forEach(k => delete want[k]);
  Object.keys(pcPrice).forEach(k => delete pcPrice[k]);
  for (const l of o.items || []) {

    const ii = sec.items.findIndex(it => it.name === p.nm), it = sec.items[ii]; if (!it) continue;

    } else if (it.type === "piece") {

  }

/* 舊訂單沒有結構化欄位，就從品項文字還原 */
const MENU_NAMES = MENU.flatMap(s => s.items.map(it => ({ name: it.name, cat: s.cat, it }))).sort((a, b) => b.name.length - a.name.length);
function parseLine(l){
  if (l.nm && l.kind) return { cat: l.cat, nm: l.nm, sp: l.sp || "", kind: l.kind, q: Number(l.q) || 1, est: l.est, sub: l.sub };
  const txt = String(l.short || l.item || "");
  const hit = MENU_NAMES.find(m => m.cat === l.cat && txt.startsWith(m.name)) || MENU_NAMES.find(m => txt.startsWith(m.name));
  if (!hit) return null;
  const rest = txt.slice(hit.name.length);
  if (hit.it.type === "amount") return { cat: hit.cat, nm: hit.name, sp: "", kind: "amount", q: 1, est: l.est, sub: l.sub };
  const m = rest.match(/^(.*?)×(\d+)/);
  const q = m ? Number(m[2]) : 1;
  if (hit.it.type === "piece") return { cat: hit.cat, nm: hit.name, sp: "", kind: "piece", q, est: l.est, sub: l.sub };
  let sp = m ? m[1].trim() : "";
  if (!sp && hit.it.opts && hit.it.opts.length === 1) sp = hit.it.opts[0].label;
  const opt = hit.it.opts && hit.it.opts.find(o => o.label.replace(/\s*一份/, "") === sp || o.label === sp);
  return { cat: hit.cat, nm: hit.name, sp: opt ? opt.label : sp, kind: "qty", q, est: l.est, sub: l.sub };
}
/* 「半」的份量算 0.5，用來估計要準備幾隻／幾顆 */
const WHOLE_UNIT = { "一隻": "隻", "一顆": "顆" };
function prepSummary(orders){
  const map = new Map();
  for (const o of orders) for (const l of o.items || []) {
    const p = parseLine(l); if (!p) continue;
    const key = p.cat + "|" + p.nm;
    if (!map.has(key)) map.set(key, { cat: p.cat, nm: p.nm, kind: p.kind, specs: new Map(), q: 0, amt: 0, noAmt: 0, n: 0 });
    const g = map.get(key);
    g.n++;
    if (p.kind === "amount") { const v = p.sub ?? p.est; if (v) g.amt += Number(v); else g.noAmt++; }
    else if (p.kind === "piece") g.q += p.q;
    else g.specs.set(p.sp, (g.specs.get(p.sp) || 0) + p.q);
  }
  // 依菜單順序排列
  const order = MENU_NAMES.slice().sort((a, b) => MENU.findIndex(s => s.cat === a.cat) - MENU.findIndex(s => s.cat === b.cat)
    || MENU.find(s => s.cat === a.cat).items.indexOf(a.it) - MENU.find(s => s.cat === b.cat).items.indexOf(b.it));
  return order.map(m => map.get(m.cat + "|" + m.name)).filter(Boolean).map(g => {
    if (g.kind === "qty") {
      const opts = (MENU.find(s => s.cat === g.cat).items.find(it => it.name === g.nm) || {}).opts || [];
      const specs = [...g.specs].sort((a, b) => opts.findIndex(o => o.label === a[0]) - opts.findIndex(o => o.label === b[0]));
      const wholeLabel = opts.map(o => o.label).find(x => WHOLE_UNIT[x]);
      let main, sub = "";
      if (wholeLabel) {
        const eq = specs.reduce((s, [sp, q]) => s + q * (sp === wholeLabel ? 1 : sp.includes("半") ? 0.5 : 0), 0);
        main = `約 ${eq % 1 ? eq.toFixed(1) : eq} ${WHOLE_UNIT[wholeLabel]}`;
        sub = specs.map(([sp, q]) => `${sp} ${q}`).join("、");
      } else {
        const tot = specs.reduce((s, [, q]) => s + q, 0);
        const mm = specs.length === 1 ? specs[0][0].match(/^一(.)(?:（(.+)）)?/) : null;
        main = `${tot}${mm ? " " + mm[1] : ""}`;
        sub = specs.length > 1 ? specs.map(([sp, q]) => `${sp} ${q}`).join("、") : (mm && mm[2] ? `${mm[2]}一份` : "");
      }
      return { ...g, main, sub };
    }
    if (g.kind === "piece") return { ...g, main: `${g.q} 塊`, sub: `${g.n} 筆訂單・秤重` };
    return { ...g, main: g.amt ? `約 $${g.amt}` : `${g.n} 份`, sub: `${g.n} 份` + (g.noAmt ? `（${g.noAmt} 份沒寫金額）` : "") + "・秤重" };
  });
}
function prepListText(date, mk, rows, orders){
  let t = `【備料】${fmtDate(date)}${mk ? "・" + mk : ""}\n共 ${orders.length} 筆訂單\n`;
  let cat = "";
  for (const r of rows) {
    if (r.cat !== cat) { cat = r.cat; t += `\n〔${cat}〕\n`; }
    t += `${r.nm}　${r.main}${r.sub ? `（${r.sub}）` : ""}\n`;
  }
  return t.trim();
}

    ${rows.length ? `<div class="share-actions" style="margin-top:12px">

    <div class="actions"><button type="button" class="btn ghost" id="prepBack">回訂單列表</button></div>`;

/* ===== 取貨日期 ===== */
const WK = "日一二三四五六";
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function fmtDate(s){ if (!s) return ""; const [y, m, d] = s.split("-").map(Number); const dt = new Date(y, m - 1, d); return `${m}/${d}(${WK[dt.getDay()]})`; }
const pdate = document.getElementById("pdate"), chipsBox = document.getElementById("dateChips");
const dateBtn = document.getElementById("dateBtn"), dateLabel = document.getElementById("dateLabel");

/* 國定假日（國曆固定日） */
const SOLAR_HOL = { "1-1": "元旦", "2-28": "和平紀念日", "4-4": "兒童節", "5-1": "勞動節", "9-28": "教師節",
  "10-10": "國慶日", "10-25": "光復節", "12-25": "行憲紀念日" };
/* 清明、冬至（依年份） */
const TERMS = { "2026-04-05": "清明", "2026-12-22": "冬至", "2027-04-05": "清明", "2027-12-22": "冬至",
  "2028-04-04": "清明", "2028-12-21": "冬至", "2029-04-04": "清明", "2029-12-21": "冬至", "2030-04-05": "清明", "2030-12-22": "冬至" };
/* 農曆節日：hol=國定假日(紅)，其餘是拜拜(橘) */
const LUNAR_DAYS = { "1-1": ["春節", 1], "1-2": ["春節", 1], "1-3": ["春節", 1], "1-9": ["天公生", 0], "1-15": ["元宵", 0],
  "2-2": ["頭牙", 0], "3-23": ["媽祖生", 0], "5-5": ["端午節", 1], "7-7": ["七夕", 0], "7-15": ["中元", 0],
  "8-15": ["中秋節", 1], "9-9": ["重陽", 0], "12-16": ["尾牙", 0] };
const CN = { "正": 1, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10, "冬": 11, "臘": 12, "腊": 12 };
const LUN_D = ["", "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十", "十一", "十二", "十三", "十四", "十五",
  "十六", "十七", "十八", "十九", "二十", "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];
let lunarFmt = null;
try { lunarFmt = new Intl.DateTimeFormat("zh-TW-u-ca-chinese", { month: "numeric", day: "numeric" }); } catch (e) {}
function cnNum(s){
  if (/\d/.test(s)) return parseInt(s.replace(/\D/g, ""));
  s = s.replace(/[月日閏]/g, "").replace("初", "").replace("廿", "二十");
  if (s.length === 1) return CN[s] || 0;
  if (s[0] === "十") return 10 + (CN[s[1]] || 0);
  if (s[1] === "十") return CN[s[0]] * 10 + (CN[s[2]] || 0);
  return CN[s[0]] || 0;
}
function lunar(d){
  if (!lunarFmt) return null;
  try {
    const p = lunarFmt.formatToParts(d);
    const m = p.find(x => x.type === "month").value, dd = p.find(x => x.type === "day").value;
    return { m: cnNum(m), d: cnNum(dd), leap: /閏/.test(m) };
  } catch (e) { return null; }
}
function dayInfo(d){
  const info = { hol: "", wor: "", lun: "" };
  const k = `${d.getMonth() + 1}-${d.getDate()}`;
  if (SOLAR_HOL[k]) info.hol = SOLAR_HOL[k];
  if (TERMS[ymd(d)]) info.wor = TERMS[ymd(d)];
  const L = lunar(d);
  if (L) {
    info.lun = L.d === 1 ? (L.leap ? "閏" : "") + L.m + "月" : LUN_D[L.d];
    const nx = new Date(d); nx.setDate(d.getDate() + 1); const N = lunar(nx);
    if (!L.leap) {
      const f = LUNAR_DAYS[`${L.m}-${L.d}`];
      if (f) { if (f[1]) info.hol = info.hol || f[0]; else info.wor = info.wor || f[0]; }
    }
    if (N && N.m === 1 && N.d === 1 && !N.leap) info.hol = "除夕";
    if (!info.hol && !info.wor) {
      if (L.d === 1 || L.d === 15) info.wor = L.d === 1 ? "初一拜拜" : "十五拜拜";
      else if (L.d === 2 || L.d === 16) info.wor = "做牙";
    }
  }
  return info;
}

function setDate(v){
  pdate.value = v;
  if (v) {
    const [y, m, d] = v.split("-").map(Number), info = dayInfo(new Date(y, m - 1, d));
    const tag = info.hol || info.wor;
    dateLabel.textContent = `${y}/${m}/${d}（${WK[new Date(y, m - 1, d).getDay()]}）${info.lun ? " 農曆" + info.lun : ""}${tag ? "・" + tag : ""}`;
  } else dateLabel.textContent = "選擇日期";
  dateBtn.classList.toggle("empty", !v);
  chipsBox.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
["今天", "明天", "後天"].forEach((t, i) => {
  const d = new Date(); d.setDate(d.getDate() + i);
  const b = document.createElement("button"); b.type = "button"; b.dataset.v = ymd(d);
  b.textContent = `${t} ${d.getMonth() + 1}/${d.getDate()}`;
  b.onclick = () => setDate(b.dataset.v);
  chipsBox.appendChild(b);
});
setDate("");

/* 日曆彈出視窗 */
let calY, calM;
function openCal(){
  const base = pdate.value ? new Date(pdate.value + "T00:00") : new Date();
  calY = base.getFullYear(); calM = base.getMonth();
  drawCal(); modal.classList.add("show");
}
function drawCal(){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const first = new Date(calY, calM, 1), days = new Date(calY, calM + 1, 0).getDate();
  const isNow = calY === today.getFullYear() && calM === today.getMonth();
  let h = `<div class="cal-head"><button type="button" id="calPrev" ${isNow ? "disabled" : ""}>‹</button>
    <b>${calY} 年 ${calM + 1} 月</b><button type="button" id="calNext">›</button></div><div class="cal-grid">`;
  h += [...WK].map(w => `<div class="cal-wk">${w}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) h += "<div></div>";
  for (let d = 1; d <= days; d++) {
    const dt = new Date(calY, calM, d), v = ymd(dt), info = dayInfo(dt);
    const cls = ["cal-d"];
    if (info.hol) cls.push("hol"); else if (info.wor) cls.push("wor");
    if (dt.getTime() === today.getTime()) cls.push("today");
    if (v === pdate.value) cls.push("sel");
    const tag = info.hol || info.wor;
    h += `<button type="button" class="${cls.join(" ")}" data-v="${v}" ${dt < today ? "disabled" : ""}>
      <span class="n">${d}</span><span class="${tag ? "h" : "l"}">${tag ? tag.replace("拜拜", "") : info.lun}</span></button>`;
  }
  h += `</div><div class="cal-legend"><span><i style="background:var(--red-soft);border:1px solid var(--red)"></i>國定假日</span>
    <span><i style="background:var(--gold-soft);border:1px solid var(--gold)"></i>拜拜／節氣</span></div>
    <div class="actions"><button type="button" class="btn ghost" id="calClose">取消</button></div>`;
  sheet.innerHTML = h;
  document.getElementById("calPrev").onclick = () => { if (--calM < 0) { calM = 11; calY--; } drawCal(); };
  document.getElementById("calNext").onclick = () => { if (++calM > 11) { calM = 0; calY++; } drawCal(); };
  document.getElementById("calClose").onclick = () => modal.classList.remove("show");
  sheet.querySelectorAll(".cal-d").forEach(b => b.onclick = () => {
    setDate(b.dataset.v); modal.classList.remove("show");
    document.getElementById("dateErr").style.display = "none";
  });
}
dateBtn.onclick = openCal;

/* 處理方式 */
const prep = { cut: "要切", pepper: "要", oil: "要", sauce: "要" };
document.querySelectorAll(".seg[data-group]").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  prep[seg.dataset.group] = b.dataset.v;
  seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
}));
function prepText(p){
  if (!p) return "";
  const yes = [["pepper", "胡椒"], ["oil", "香油"], ["sauce", "醬油膏"]].filter(([k]) => p[k] === "要").map(x => x[1]);
  return `${p.cut}・${yes.length ? "加" + yes.join("、") : "不加調味"}`;
}

/* ===== 付款 ===== */
let pay = "none";
const depInput = document.getElementById("deposit");
document.getElementById("paySeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-pay]"); if (!b) return;
  pay = b.dataset.pay;
  document.querySelectorAll("#paySeg button").forEach(x => x.classList.toggle("on", x === b));
  document.getElementById("depositBox").style.display = pay === "deposit" ? "block" : "none";
  updateOwe();
});
depInput.addEventListener("input", updateOwe);
function currentTotal(){ return getLines().reduce((s, l) => s + (l.sub || 0), 0); }
function updateOwe(){
  const dep = Number(depInput.value) || 0, tot = currentTotal();
  document.getElementById("owe").textContent = dep && tot ? `尚欠 $${Math.max(0, tot - dep)}` : "";
}
function payText(o){
  if (o.pay === "full") return "已付清";
  if (o.pay === "deposit") return `訂金 $${o.deposit}・尚欠 $${Math.max(0, o.total - o.deposit)}${o.items && hasPending(o.items) ? "＋秤重" : ""}`;
  return "未付款";
}

/* ===== 取貨地點 ===== */
let market = "";
setTimeout(paintMarket, 0);
document.getElementById("marketSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  market = market === b.dataset.m ? "" : b.dataset.m;   // 再點一次可取消
  document.querySelectorAll("#marketSeg button").forEach(x => x.classList.toggle("on", x.dataset.m === market));
  paintMarket();
});

/* ===== 標題顯示今天日期 ===== */
(function showToday(){
  const d = new Date(), info = dayInfo(d), L = lunar(d);
  const LM = ["", "正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "冬", "臘"];
  const lunTxt = L ? `農曆${L.leap ? "閏" : ""}${LM[L.m]}月${LUN_D[L.d]}` : "";
  const tag = info.hol || info.wor;
  document.getElementById("todayLine").innerHTML =
    `今天 ${d.getMonth() + 1}/${d.getDate()}（星期${WK[d.getDay()]}）` +
    `<small>${lunTxt}${tag ? "・" + tag : ""}</small>`;
})();

/* 打字時隱藏底部列，避免手機鍵盤彈出時畫面跳動 */
document.addEventListener("focusin", e => { if (e.target.matches("input,textarea")) document.body.classList.add("typing"); });
document.addEventListener("focusout", () => setTimeout(() => {
  if (!document.activeElement || !document.activeElement.matches("input,textarea")) document.body.classList.remove("typing");
}, 100));

render();
</script>
