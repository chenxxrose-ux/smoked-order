<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="訂購">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self'; manifest-src 'self'; worker-src 'self'; connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://fodibhcjitnrgpvqttky.supabase.co; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>煙燻滷味訂購</title>
<style>
  :root{
    --paper:#F7F6F3; --card:#FFFFFF; --ink:#1E1A17; --sub:#8A847D; --hair:#ECE9E4; --fill:#F1EFEB; --fill-press:#E6E3DE;
    --soy:#7B1F24; --soy-press:#5E171B; --soy-tint:#F5E9E9;
    --gold:#9A6B17; --gold-soft:#F7F0E1; --red:#B3261E; --red-soft:#FBECEA;
    --r:14px; --gut:16px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
    padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  input,textarea,button{-webkit-appearance:none;appearance:none;font-family:inherit;color:inherit}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  button{touch-action:manipulation;cursor:pointer;border:none;background:none;padding:0}
  :focus-visible{outline:2px solid var(--soy);outline-offset:2px}
  .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* 頂部 */
  .top{position:sticky;top:0;z-index:5;background:rgba(247,246,243,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    padding:calc(10px + env(safe-area-inset-top)) var(--gut) 10px;border-bottom:1px solid var(--hair)}
  .top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
  .today{margin:2px 0 0;font-size:13px;color:var(--sub)}
  .today small{font-size:13px;color:var(--sub)}
  .today small{display:block;margin-top:1px}
  .hdr-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:20px;background:var(--card);
    border:1px solid var(--hair);font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
  .hdr-btn:active{background:var(--fill-press)}

  main{max-width:600px;margin:0 auto;padding:4px var(--gut) 24px}
  .sec{margin:22px 4px 8px;font-size:13px;font-weight:500;color:var(--sub);display:flex;align-items:baseline;gap:6px}
  .sec span{font-weight:400}
  .card{background:var(--card);border-radius:var(--r);padding:0 14px}

  /* 行內列 */
  .line{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-top:1px solid var(--hair)}
  .card > .line:first-child,.card > .block:first-child + .line,.card > :first-child{border-top:none}
  .block{padding:12px 0;border-top:1px solid var(--hair)}
  .lbl{flex:none;width:52px;font-size:15px;color:var(--sub)}
  .line input[type=text],.line input[type=number],.line input[type=time]{flex:1;min-width:0;height:44px;border:none;background:transparent;
    font-size:16px;padding:0;outline:none;border-radius:0}
  .line input[type=time]{text-align:left;display:flex;align-items:center}
  input::placeholder,textarea::placeholder{color:#B9B3AC}
  textarea{flex:1;min-width:0;border:none;background:transparent;font-size:16px;padding:12px 0;resize:none;outline:none;line-height:1.45}
  .line.memo{align-items:flex-start}
  .line.memo .lbl{padding-top:12px}
  .err{color:var(--red);font-size:13px;padding:0 0 10px 64px;display:none}
  .owe{flex:none;font-size:14px;color:var(--sub)}
  .owe.back{color:var(--soy);font-weight:600;font-size:15px}

  .field-btn{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:16px}
  .field-btn .ic{color:#B9B3AC}
  .date-field.empty #dateLabel{color:#B9B3AC}
  #dateLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 橫向選擇按鈕 */
  .seg{display:flex;gap:4px;padding:3px;background:var(--fill);border-radius:12px;flex:1;min-width:0}
  .seg button{flex:1;min-width:0;min-height:42px;border-radius:9px;font-size:15px;color:var(--ink);white-space:nowrap;
    transition:background .12s,transform .08s}
  .seg button:active{transform:scale(.96);background:var(--fill-press)}
  .seg button.on{background:var(--soy);color:#fff}
  .seg button.on:active{background:var(--soy-press)}
  .seg.small{flex:none;width:136px}
  .chips{display:flex;gap:6px;padding:0 0 12px 64px}
  .chips button{flex:1;min-width:0;min-height:36px;padding:0 6px;border-radius:18px;background:var(--fill);font-size:13px;white-space:nowrap}
  .chips button:active{background:var(--fill-press)}
  .chips button.on{background:var(--soy);color:#fff}

  /* 品項（行內） */
  .it{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-top:1px solid var(--hair)}
  .card > .it:first-child,.card > .grp:first-child{border-top:none}
  .grp{border-top:1px solid var(--hair);padding-top:12px}
  .grp-name{font-size:16px;font-weight:500}
  .grp .it{border-top:none;min-height:56px;padding:4px 0 4px 12px}
  .grp .it + .it{border-top:1px dashed var(--hair)}
  .grp .it-sub{margin-top:0;font-size:15px}
  .grp .it-sub .spec{color:var(--ink);min-width:44px}
  .it-main{flex:1;min-width:0}
  .it-name{font-size:16px;font-weight:500;line-height:1.3}
  .it-sub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-top:4px;font-size:13px;color:var(--sub)}
  .pin{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px;background:var(--fill);border-radius:8px;color:var(--sub)}
  .pin input{width:58px;height:32px;border:none;background:transparent;font-size:16px;color:var(--ink);padding:0;outline:none;text-align:left}
  .pin:focus-within{background:var(--soy-tint);color:var(--soy)}
  .wtag{flex:none;white-space:nowrap;font-size:12px;line-height:1;padding:5px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:500}

  .stepper{flex:none;display:flex;align-items:center;gap:2px}
  .stepper button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fill);
    color:var(--ink);transition:background .12s,transform .08s}
  .stepper button .ic{width:18px;height:18px;stroke-width:2.2}
  .stepper button:active{transform:scale(.9);background:var(--fill-press)}
  .stepper button[data-d="1"]{background:var(--soy-tint);color:var(--soy)}
  .stepper button[data-d="1"]:active{background:var(--soy);color:#fff}
  .stepper .q{min-width:28px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums;color:#C4BEB7}
  .stepper.on .q{color:var(--ink);font-weight:600}
  .stepper.typed input.q{width:88px;height:44px;border:none;border-radius:10px;background:var(--fill);text-align:center;font-size:18px;
    font-variant-numeric:tabular-nums;color:var(--ink);outline:none;padding:0;-moz-appearance:textfield;appearance:textfield}
  .stepper.typed input.q::-webkit-inner-spin-button,.stepper.typed input.q::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .stepper.typed input.q::placeholder{color:#C4BEB7;font-weight:400}
  .stepper.typed input.q:focus{background:var(--soy-tint);box-shadow:0 0 0 2px var(--soy)}
  .stepper.typed.on input.q{background:var(--card);color:var(--soy);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--soy)}
  .stepper:not(.on) button[data-d="-1"]{color:#C4BEB7}
  .want{flex:none;min-width:72px;min-height:44px;border-radius:22px;background:var(--fill);font-size:15px;transition:background .12s,transform .08s}
  .want:active{transform:scale(.94);background:var(--fill-press)}
  .want.on{background:var(--soy);color:#fff}
  .want::after{content:"要"}
  .want.on::after{content:"已選"}

  /* 底部訂單列 */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--hair);padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom))}
  .bar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .sum{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .sum-l{font-size:13px;color:var(--sub)}
  .sum b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  body.typing .bar{display:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;
    background:var(--soy);color:#fff;font-size:16px;font-weight:500;white-space:nowrap;transition:background .12s,transform .08s}
  .btn:active{transform:scale(.97);background:var(--soy-press)}
  .btn:disabled{opacity:.55}
  .btn.ghost{background:var(--fill);color:var(--ink)}
  .btn.ghost:active{background:var(--fill-press)}
  .btn.small{min-height:44px;padding:0 12px;font-size:15px;border-radius:10px}
  .btn.share{background:var(--soy);color:#fff}
  .bar .btn{min-width:132px}

  /* 底部彈窗 */
  .modal{position:fixed;inset:0;background:rgba(30,26,23,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.show{display:flex}
  .sheet{position:relative;background:var(--paper);width:100%;max-width:600px;max-height:90vh;max-height:90dvh;overflow:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:18px 18px 0 0;
    padding:26px var(--gut) calc(20px + env(safe-area-inset-bottom))}
  .sheet::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#D8D4CE}
  .sheet h3{margin:0 0 14px;font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px}
  .sheet h3 .ic{width:22px;height:22px;color:var(--soy)}
  .rows{background:var(--card);border-radius:var(--r);padding:0 14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--hair);font-size:15px}
  .rows .row:first-child{border-top:none}
  .row span:first-child{color:var(--sub);flex:none}
  .row span:last-child{text-align:right;min-width:0}
  .rows.items .row span:first-child{color:var(--ink);flex:1}
  .total{font-size:17px;font-weight:600}
  .total span:first-child{color:var(--ink)!important}
  .actions{display:flex;gap:10px;margin-top:12px}
  .actions .btn{flex:1;min-width:0}
  .note{font-size:13px;color:var(--sub);margin:0 0 12px}

  .order{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .order.pending{box-shadow:inset 3px 0 0 var(--gold)}
  .pend-tag{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);margin-bottom:8px}
  .pend-tag .ic{width:16px;height:16px}
  .cf-tag{color:var(--red);justify-content:space-between;font-weight:500}
  .line.bad{box-shadow:inset 3px 0 0 var(--red)}
  .order-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .order-btns .weigh-btn{grid-column:1 / -1;background:var(--gold-soft);color:var(--gold)}
  .order-btns .weigh-btn:active{background:#EFE3C8}
  .order-btns .btn{min-width:0}
  .preview{white-space:pre-wrap;word-break:break-word;background:var(--card);border-radius:var(--r);padding:14px;font-family:inherit;
    font-size:15px;line-height:1.7;margin:0 0 12px;user-select:text;-webkit-user-select:text}
  .order .preview{background:var(--paper);border-radius:10px;padding:12px}

  .share-actions{display:flex;gap:10px;margin-top:4px}
  .ln-full{width:100%;margin-top:4px}
  .share-actions .btn{flex:1;min-width:0;padding:0 12px}
  @media (max-width:380px){ .share-actions{flex-direction:column} }
  @media (max-width:340px){ .order-btns{grid-template-columns:1fr} .seg.small{width:120px} .pin input{width:46px} .grp .it-sub .spec{min-width:0} .grp .it{padding-left:6px} }

  .toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;z-index:20;
    background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.5;text-align:center;
    opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .toast.err{background:var(--red)}

  /* 日曆 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-size:18px;font-weight:600}
  .cal-head button{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:22px;color:var(--ink)}
  .cal-head button:active{background:var(--fill-press)}
  .cal-head button:disabled{opacity:.3}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wk{text-align:center;font-size:14px;color:var(--sub);padding:4px 0}
  .cal-wk:first-child,.cal-wk:last-child{color:var(--red)}
  .cal-d{min-height:66px;border:1.5px solid transparent;border-radius:10px;background:var(--card);padding:5px 1px;display:flex;flex-direction:column;
    align-items:center;gap:1px;transition:transform .08s}
  .cal-d:active{transform:scale(.94)}
  .cal-d .n{font-size:16px;font-weight:500;line-height:1.2}
  .cal-d .l{font-size:12px;color:var(--sub);line-height:1.2}
  .cal-d .h{font-size:12px;line-height:1.15;max-width:100%;word-break:break-all}
  .cal-d.hol{background:var(--red-soft)}
  .cal-d.hol .n,.cal-d.hol .h{color:var(--red)}
  .cal-d.wor{background:var(--gold-soft)}
  .cal-d.wor .h{color:var(--gold)}
  .cal-d.today{border-color:var(--ink)}
  .cal-d.sel{background:var(--soy);border-color:var(--soy)}
  .cal-d.sel .n,.cal-d.sel .l,.cal-d.sel .h{color:#fff}
  .cal-d:disabled{opacity:.3}
  .cal-legend{display:flex;gap:16px;font-size:14px;color:var(--sub);margin-top:12px;flex-wrap:wrap}
  .cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .mk-warn{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:#FBF1DE;color:#8A5A00;font-size:14px;font-weight:500;text-align:center}
  #marketSeg.need{box-shadow:0 0 0 2px #E2A33B}
  .mk-pick{display:grid;grid-template-columns:1fr;gap:8px}
  .mk-pick .btn{min-height:52px;font-size:17px}
  @media (max-width:430px){ .sync-pill{font-size:0;gap:0;padding:0 12px} }   /* 窄螢幕只留同步圓點 */
  /* 對齊：品名｜份量｜價格 三欄固定 */
  .it.one .it-main{display:grid!important;grid-template-columns:4.3em 2.4em minmax(0,1fr);align-items:center;column-gap:8px}
  .it.one .it-name{font-size:16px;white-space:nowrap}
  .it.one .spec-s,.it.one .spec-m{font-size:15px;white-space:nowrap}
  .it.one .spec-s{color:var(--sub)}
  .it.one .pr{justify-self:start;text-align:left;max-width:100%;line-height:1.25;padding:2px 4px;margin:0 -4px}
  .it.one .span2{grid-column:2 / 4;display:flex;align-items:center;gap:6px;min-width:0}
  .it.one .span2 .pin input{width:64px}
  .it.one .want,.it.one .stepper{flex:none}
  .want{width:120px}
  .it.one .span2 .pin{min-width:0;flex:0 1 auto}
  .it.one .span2 .pin input{min-width:0}
  /* 小螢幕：價格放到份量下面，欄位一樣對齊 */
  @media (max-width:360px){
    .it.one .it-main{grid-template-columns:4.2em minmax(0,1fr);column-gap:4px;row-gap:0}
    .it.one .it-name{grid-row:1 / 3;align-self:center}
    .it.one .approx{display:none}
    .it.one .spec-s,.it.one .spec-m{grid-column:2;grid-row:1;font-size:14px;line-height:1.25}
    .it.one .pr{grid-column:2;grid-row:2;margin:0;min-height:0;padding:0;font-size:12px;line-height:1.3}
    .it.one .span2{grid-column:2;grid-row:1 / 3}
    .it.one .span2 .pin{flex:1;padding:0 6px}
    .it.one .span2 .pin input{width:100%}
    .it.one .wtag{display:none}
  }
  /* 外送／時間 */
  #marketSeg button{font-size:15px;padding:0 2px}
  @media (max-width:360px){ #marketSeg button{font-size:14px} }
  .nav-btn{flex:none;min-height:40px;padding:0 14px;border-radius:20px;background:var(--soy);color:#fff;font-size:15px;display:inline-flex;align-items:center;text-decoration:none}
  .nav-btn.off{background:var(--fill);color:var(--sub)}
  #addr{flex:1;min-width:0}
  .line.dt select{flex:none;width:110px;height:44px;border:none;border-radius:10px;background:var(--fill);font-size:16px;padding:0 10px;color:var(--ink);
    -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
  .line.dt select:invalid,.line.dt select.empty{color:var(--sub)}
  @media (max-width:360px){ .line.dt select{width:calc(100% - 64px);margin-left:64px} }
  /* 精簡版面 */
  .it.one{min-height:50px!important;padding:3px 0!important}
  .grp.g1{padding-top:0}
  .grp.g1 .it{padding-left:0}
  .grp.g1 .it.sub{border-top:1px dashed var(--hair)}

  .spec-m{font-size:15px;color:var(--ink)}
  .grp.g1 .it.picked{padding-left:14px}
  .sec{margin:14px 4px 6px}
  .line.dt input[type=time]{flex:none;width:124px;text-align:right}
  .line.dt .field-btn .ic{display:none}
  @media (max-width:360px){ .line.dt{flex-wrap:wrap} }
  .line.dt .field-btn{min-width:0}

  .it.one .it-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .it.one .it-name.spec{font-weight:400;font-size:15px}
  .spec-s{font-size:13px;color:var(--sub)}
  .pr{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;min-height:32px;padding:0 4px;margin:-6px 0;border-radius:6px}
  .pr:active{background:var(--fill)}
  .pr.none{color:#C4A16A}
  .menu-head{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .menu-head .sec{margin-bottom:0}
  .sec-t{width:100%;display:flex;align-items:center;gap:8px;min-height:48px;margin:10px 0 4px;padding:0 4px;font-size:16px;font-weight:600;color:var(--ink);text-align:left}
  .sec-t .sec-n{flex:1;font-size:13px;font-weight:500;color:var(--soy)}
  .sec-t .chev{color:var(--sub);transition:transform .15s}
  .sec-t.shut .chev{transform:rotate(-90deg)}
  .card.folded{display:none}
  .sum-row{width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font-size:15px;color:var(--ink)}
  .sum-row .sum-edit{flex:none;display:inline-flex;align-items:center;gap:2px;font-size:14px;color:var(--soy)}
  .sum-row.open .chev{transform:rotate(180deg)}
  .sum-row:active{opacity:.6}
  #optBody{border-top:1px solid var(--hair)}
  .ps-spec{margin-left:6px;font-size:13px;color:var(--sub)}
  .line.memo textarea{padding:12px 0;min-height:44px}
  /* UX 調整 */
  .it.picked{background:var(--soy-tint);margin:0 -14px;padding-left:14px;padding-right:14px;box-shadow:inset 4px 0 0 var(--soy)}

<script>
/* core.js 是訂購頁和剩貨頁共用的程式，沒有載入就停止，避免動到資料 */
if (typeof MENU === "undefined" || typeof CORE_VERSION === "undefined" || CORE_VERSION < 5) {
  document.body.insertAdjacentHTML("afterbegin", '<p style="margin:0;padding:14px 16px;background:#B3261E;color:#fff;font-size:15px">程式檔 shared.js 或 core.js 沒有載入或版本太舊。請把 shared.js、core.js 和這個頁面放在同一個資料夾，然後重新整理。</p>');
  throw new Error("core.js missing");
}


const qty = {};      // key -> 數量
const amounts = {};  // key -> 金額（豬頭皮）
const prices = {};   // key -> 單價（頁面上直接打）
const pcPrice = {};  // key -> 腱子肉每塊金額（秤重，每次不同）
const want = {};     // key -> 秤重品項有沒有要
let savedPrices = {};
try { savedPrices = JSON.parse(localStorage.getItem("prices") || "{}"); } catch (e) {}
function savePrices(){ try { localStorage.setItem("prices", JSON.stringify(prices)); } catch (e) {} }

/* 顯示順序（資料仍用原本的位置，記住的單價不受影響） */
function byLen(items){ return sortNames(items, it => it.name); }

/* 收合狀態（記在這支手機） */
function folded(){ try { return JSON.parse(localStorage.getItem("orderFold") || "[]"); } catch (e) { return []; } }
/* 品項列上的小字單價 */
function paintPrices(){
  document.querySelectorAll("#menu [data-pr]").forEach(el => {
    const v = prices[el.dataset.pr], pc = el.dataset.pr.endsWith("-pc"), note = el.dataset.note ? `・${el.dataset.note}` : "";
    const w = pc || el.dataset.w;
    el.textContent = pc ? (v ? `約$${v}/塊・秤重` : "秤重") : w ? (v ? `約$${v}・秤重` : "秤重") : (v ? `$${v}${note}` : `未設價${note}`);
    el.classList.toggle("none", !v && !w);
  });
}
/* 單價設定：集中在這裡改，品項列就只剩一行 */
function showPrices(focusKey){
  let html = `<h3>單價設定</h3><p class="note">改了會自動記住（這支手機），之後接單直接用。</p>`;
  MENU.forEach((sec, si) => {
    const rows = [];
    byLen(sec.items).forEach(([it, ii]) => {
      if (it.type === "piece") {
        const k = `${si}-${ii}-pc`;
        rows.push(`<div class="row" style="align-items:center"><span style="color:var(--ink)">${escapeHtml(it.name)}<small class="ps-spec">一塊大約（秤重）</small></span>
          <label class="pin">$<input type="number" min="0" inputmode="numeric" data-ps="${k}" value="${prices[k] || ""}" placeholder="可不填"></label></div>`);
        return;
      }
      if (!it.opts) return;
      it.opts.forEach((o, oi) => {
        const k = `${si}-${ii}-${oi}`;
        rows.push(`<div class="row" style="align-items:center"><span style="color:var(--ink)">${escapeHtml(it.name)}<small class="ps-spec">${escapeHtml(o.label)}</small></span>
          <label class="pin">$<input type="number" min="0" inputmode="numeric" data-ps="${k}" value="${prices[k] || ""}" placeholder="單價"></label></div>`);
      });
    });
    if (rows.length) html += `<p class="prep-cat">${escapeHtml(sec.cat)}</p><div class="rows">${rows.join("")}</div>`;
  });
  html += `<div class="actions"><button type="button" class="btn" id="psDone">完成</button></div>`;
  sheet.dataset.view = ""; sheet.dataset.sub = "prices";
  sheet.innerHTML = html; modal.classList.add("show"); sheet.scrollTop = 0;
  sheet.querySelectorAll("[data-ps]").forEach(inp => inp.addEventListener("input", () => {
    prices[inp.dataset.ps] = money(inp.value); if (inp.value && Number(inp.value) < 0) inp.value = ""; savePrices(); paintPrices(); update();
  }));
  const f = focusKey && sheet.querySelector(`[data-ps="${focusKey}"]`);
  if (f) setTimeout(() => { f.scrollIntoView({ block: "center" }); f.focus(); }, 80);
  document.getElementById("psDone").onclick = () => { if (document.activeElement.blur) document.activeElement.blur(); modal.classList.remove("show"); };
}

function render(){
  const menu = document.getElementById("menu");
  // 滷味直接打數字（量比較多，按＋－太慢）；其他照舊用＋－
  const stepper = (key, typed, label) => typed ? `<div class="stepper typed" id="s-${key}">
      <input class="q" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" enterkeyhint="done" data-qk="${key}" placeholder="0" aria-label="${label}幾個"></div>`
    : `<div class="stepper" id="s-${key}">
      <button type="button" data-k="${key}" data-d="-1" aria-label="減少">${ICON.minus}</button>
      <span class="q">0</span>
      <button type="button" data-k="${key}" data-d="1" aria-label="增加">${ICON.plus}</button></div>`;
  const priceIn = (attr, key, val, ph) =>
    `<label class="pin">$<input type="number" min="0" inputmode="numeric" enterkeyhint="done" ${attr}="${key}" value="${val || ""}" placeholder="${ph}"></label>`;
  MENU.forEach((sec, si) => {
    const shut = folded().includes(sec.cat);
    const h = document.createElement("button");
    h.type = "button"; h.className = "sec-t" + (shut ? " shut" : ""); h.dataset.cat = sec.cat; h.setAttribute("aria-expanded", !shut);
    h.innerHTML = `<span>${sec.cat}</span><span class="sec-n" data-n="${sec.cat}"></span>${ICON.chev}`;
    menu.appendChild(h);
    const card = document.createElement("section");
    card.className = "card" + (shut ? " folded" : ""); card.dataset.card = sec.cat;
    let html = "";
    byLen(sec.items).forEach(([it, ii]) => {
      if (it.type === "money" || it.type === "amount") {
        const key = `${si}-${ii}-amt`, w = it.type === "amount";
        html += `<div class="it one" data-item="${it.name}"><div class="it-main">
            <span class="it-name">${it.name}</span>
            <span class="span2"><label class="pin">${w ? `<span class="approx">約</span>` : ""}$<input type="number" min="0" inputmode="numeric" data-amt="${key}" placeholder="金額" aria-label="${it.name}${w ? "大約" : ""}要買多少錢"></label>${w ? `<span class="wtag">秤重</span>` : ""}</span></div>
          <button type="button" class="want" data-want="${key}" aria-label="${it.name}要不要"></button></div>`;
      } else if (it.type === "piece") {
        const key = `${si}-${ii}-pc`;
        qty[key] = 0;
        prices[key] = savedPrices[key] || 0;
        html += `<div class="it one" data-item="${it.name}"><div class="it-main">
            <span class="it-name">${it.name}</span><span class="spec-s">按塊</span>
            <button type="button" class="pr" data-pr="${key}" aria-label="設定一塊大約多少錢"></button></div>
          ${stepper(key)}</div>`;
      } else {
        const rows = it.opts.map((o, oi) => {
          const key = `${si}-${ii}-${oi}`;
          qty[key] = 0;
          const saved = savedPrices[key];
          prices[key] = saved !== undefined ? saved : (o.price || 0);
          const multi = it.opts.length > 1;
          return `<div class="it one${multi && oi ? " sub" : ""}" data-item="${it.name}"><div class="it-main">
              <span class="it-name">${multi && oi ? "" : it.name}</span><span class="${multi ? "spec-m" : "spec-s"}">${o.label.replace(/（.*?）/, "")}</span>
              <button type="button" class="pr" data-pr="${key}" data-note="${(o.label.match(/（(.*?)）/) || [])[1] || ""}"${it.weigh ? ' data-w="1"' : ""} aria-label="設定單價"></button></div>
            ${stepper(key, sec.cat === "滷味", it.name + (multi ? o.label : ""))}</div>`;
        }).join("");
        html += it.opts.length > 1 ? `<div class="grp g1">${rows}</div>` : rows;
      }
    });
    card.innerHTML = html;
    menu.appendChild(card);
  });
  paintPrices();
  menu.addEventListener("click", e => {
    if (e.target.closest(".pr")) { showPrices(e.target.closest(".pr").dataset.pr); return; }
    const t = e.target.closest(".sec-t"); if (!t) return;
    const cat = t.dataset.cat, f = new Set(folded()), shut = !f.has(cat);
    shut ? f.add(cat) : f.delete(cat);
    try { localStorage.setItem("orderFold", JSON.stringify([...f])); } catch (x) {}
    t.classList.toggle("shut", shut); t.setAttribute("aria-expanded", !shut);
    menu.querySelector(`[data-card="${CSS.escape(cat)}"]`).classList.toggle("folded", shut);
  });

  menu.addEventListener("click", e => {
    const w = e.target.closest("button[data-want]");
    if (w) {
      const k = w.dataset.want; want[k] = !want[k]; w.classList.toggle("on", want[k]);
      if (!want[k]) { delete amounts[k]; const inp = menu.querySelector(`[data-amt="${k}"]`); if (inp) inp.value = ""; }   // 取消就清掉金額，不會留在訂單
      update(); return;
    }
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const k = b.dataset.k;
    qty[k] = Math.max(0, qty[k] + Number(b.dataset.d));
    const s = document.getElementById("s-" + k);
    s.querySelector(".q").textContent = qty[k];
    s.classList.toggle("on", qty[k] > 0);
    update();
  });
  menu.addEventListener("input", e => {
    if (e.target.dataset.qk) {
      const k = e.target.dataset.qk, n = Math.min(999, Math.max(0, Math.floor(Number(e.target.value) || 0)));
      if (e.target.value !== "" && String(n) !== e.target.value) e.target.value = n || "";
      qty[k] = n; e.target.closest(".stepper").classList.toggle("on", n > 0);
      update(); return;
    }
    if (e.target.dataset.amt) {
      const k = e.target.dataset.amt; amounts[k] = money(e.target.value); if (Number(e.target.value) < 0) e.target.value = "";
      if (amounts[k] > 0 && !want[k]) { want[k] = true; menu.querySelector(`[data-want="${k}"]`).classList.add("on"); }
      update();
    }

    if (e.target.dataset.p) { prices[e.target.dataset.p] = money(e.target.value); savePrices(); update(); }
  });
}

/* 數量顯示：＋－ 的是文字，滷味的是輸入框（0 顯示空白） */
function setQ(st, v){ const q = st.querySelector(".q"); if (q.tagName === "INPUT") q.value = v ? v : ""; else q.textContent = v; }

function getLines(){
  const lines = [];
  MENU.forEach((sec, si) => byLen(sec.items).forEach(([it, ii]) => {
    if (it.type === "money") {
      const k = `${si}-${ii}-amt`, a = amounts[k] || 0;
      if (want[k]) lines.push({ cat: sec.cat, nm: it.name, kind: "amount", q: 1, weigh: false, est: null,
        short: it.name, item: `${it.name} $${a}`, text: `【${sec.cat}】${it.name}`, sub: a > 0 ? a : null });
    } else if (it.type === "amount") {
      const k = `${si}-${ii}-amt`, a = amounts[k] || 0;
      if (want[k]) lines.push({ cat: sec.cat, nm: it.name, kind: "amount", q: 1, weigh: true, est: a || null,
        short: `${it.name}${a ? " 約$" + a : ""}`, item: `${it.name}${a ? " 約$" + a : ""}`,
        text: `【${sec.cat}】${it.name}${a ? " 約$" + a : ""}`, sub: null });
    } else if (it.type === "piece") {
      const k = `${si}-${ii}-pc`, q = qty[k], p = pcPrice[k] || prices[k] || 0;
      if (q > 0) lines.push({ cat: sec.cat, nm: it.name, kind: "piece", q, weigh: true, est: p ? p * q : null, short: `${it.name}×${q}塊`, item: `${it.name} × ${q} 塊`,
        text: `【${sec.cat}】${it.name} × ${q} 塊${p ? "　一塊約$" + p : ""}`, sub: null });
    } else {
      it.opts.forEach((o, oi) => {
        const k = `${si}-${ii}-${oi}`, q = qty[k], p = prices[k];
        const lab = it.opts.length > 1 ? o.label.replace(/\s*一份/, "") : "";
        if (q > 0 && it.weigh) lines.push({ cat: sec.cat, nm: it.name, sp: o.label, kind: "qty", q, weigh: true, est: p ? p * q : null,
          short: `${it.name}${lab}×${q}${it.unit || ""}`, item: `${it.name}（${o.label}）× ${q}${p ? "　約$" + p : ""}`,
          text: `【${sec.cat}】${it.name}（${o.label}）× ${q}${p ? "　約$" + p : ""}`, sub: null });
        else if (q > 0) lines.push({ cat: sec.cat, nm: it.name, sp: o.label, kind: "qty", q, short: `${it.name}${lab}×${q}${it.unit || ""}`, item: `${it.name}（${o.label}）× ${q}${p ? "　單價$" + p : ""}`,
          text: `【${sec.cat}】${it.name}（${o.label}）× ${q}${p ? "　@$" + p : ""}`, sub: p ? p * q : null });
      });
    }
  }));
  return lines;
}


/* 電話遮蔽：0912-***-678 */
function maskPhone(p){
  const d = String(p || "").replace(/\D/g, "");
  if (d.length >= 10) return `${d.slice(0, 4)}-***-${d.slice(-3)}`;
  if (d.length > 4) return `${d.slice(0, 2)}***${d.slice(-2)}`;
  return "***";
}

/* 產生可複製的純文字訂單 */
/* 電話一律完整顯示（店裡的人要能直接打）；地址要 opts.fullPhone=true 才完整，預設遮蔽 */
const lineHead = t => `━━ ${t} ━━━━━━`;
function buildText(o, opts = {}){
  // LINE 裡看的排版：一段一段分開，標題寫在分隔線裡，品項內縮（和剩貨分享同一種排法，不用 emoji）
  const L = [];
  L.push(`【訂單${o.st ? "・" + stLabel(o) : ""}】`);   // 和剩貨（▍剩貨）、要帶（▍要帶）分得出來
  L.push(o.phone ? `${o.name}　${o.phone}` : o.walk ? o.name : `${o.name}　電話未留`);
  L.push("━━━━━━━━━━━━");
  if (o.date) L.push(`取貨　${fmtDate(o.date)}${o.ptime ? " " + o.ptime : ""}`);
  if (o.market) L.push(`地點　${o.market}`);
  if (o.addr) L.push(`地址　${opts.fullPhone ? o.addr : maskAddr(o.addr)}`);
  if (o.odate) L.push(`訂購　${fmtDate(o.odate)}`);
  L.push("", lineHead("品項"));
  o.items.forEach(l => {
    const name = l.sub !== null && l.weigh ? (l.short || l.item).replace(/ 約\$\d+/, "") : (l.short || l.item);
    L.push(`　${name}　${l.sub === null ? (l.weigh ? "（待秤）" : "（未定價）") : "$" + l.sub}`);
  });
  if (o.prep) L.push("", lineHead("處理"), `　${prepText(o.prep)}`);
  if (o.memo) L.push("", lineHead("備註"), `　${o.memo}`);
  o.total = calcTotal(o.items);
  L.push("", "━━━━━━━━━━━━", `合計　$${o.total}${totalNote(o.items)}`);
  if (o.pay) L.push(`付款　${payText(o)}`);
  if (o.st === "cancel" && o.refund) L.push(`退款　已收 $${paidOf(o)}・${REFUND[o.refund]}`);
  return L.join("\n");
}
/* LINE 卡片版的訂單（內容和 buildText 一樣，排成收據樣子） */
function orderCard(o, opts = {}){
  const K = LineCard, C = K.C, total = calcTotal(o.items);
  const when = o.date ? `${fmtDate(o.date)}${o.ptime ? " " + o.ptime : ""} 取` : "取貨日未定";
  const body = [
    K.t(o.name || "客人", { size: "xl", weight: "bold", margin: "md" }),
    o.phone ? K.t(o.phone, { size: "md", color: C.blue, action: { type: "uri", label: "打電話", uri: "tel:" + o.phone } })
      : K.t(o.walk ? "現場客" : "電話未留", { size: "sm", color: C.sub }),
  ];
  if (o.st) body.push(K.t(stLabel(o), { size: "sm", weight: "bold", color: o.st === "cancel" ? C.red : "#2F6B3D", margin: "sm" }));
  body.push(K.sep());
  if (o.market) body.push(K.kv("地點", o.market));
  if (o.addr) body.push(K.kv("地址", opts.fullPhone ? o.addr : maskAddr(o.addr)));
  if (o.odate) body.push(K.kv("訂購", fmtDate(o.odate)));
  body.push(K.label("品項"));
  o.items.forEach(l => {
    const name = l.sub !== null && l.weigh ? (l.short || l.item).replace(/ 約\$\d+/, "") : (l.short || l.item);
    body.push(K.row(name, l.sub === null ? (l.weigh ? "待秤" : "未定價") : "$" + l.sub, { rc: l.sub === null ? C.gold : C.ink }));
  });
  if (o.prep) { body.push(K.label("處理")); body.push(K.t(prepText(o.prep), { size: "md", margin: "sm" })); }
  if (o.memo) { body.push(K.label("備註")); body.push(K.t(o.memo, { size: "md", margin: "sm" })); }
  body.push(K.sep());
  body.push(K.row("合計", "$" + total, { margin: "lg", size: "lg", lw: true, rw: true }));
  const note = totalNote(o.items); if (note) body.push(K.t(note.replace(/^＋/, ""), { size: "xs", color: C.gold, align: "end" }));
  if (o.pay) { const pt = payText(o); body.push(K.kv("付款", pt, { c: pt === "未付款" ? C.red : C.ink, bold: true })); }
  if (o.st === "cancel" && o.refund) body.push(K.kv("退款", `已收 $${paidOf(o)}・${REFUND[o.refund]}`));
  return { alt: `訂單｜${o.name || "客人"}　${when}`, contents: K.bubble(K.band("o", "訂單", when, o.market || ""), body) };
}
/* 金額一律是 0 以上的整數（負數、亂打都當 0） */
const money = v => { const n = Math.round(Number(v)); return Number.isFinite(n) && n > 0 ? Math.min(n, 9999999) : 0; };
function calcTotal(items){ return items.reduce((s, l) => s + (l.sub || 0), 0); }
const hasUnpriced = items => items.some(l => l.sub === null && !l.weigh);
/* 合計後面的提醒：秤重還沒補、或有品項沒設價格 → 合計不是最後金額 */
function totalNote(items){
  const a = hasPending(items), b = hasUnpriced(items);
  return a && b ? "＋秤重、未定價另計" : a ? "＋秤重另計" : b ? "＋未定價另計" : "";
}
function hasPending(items){ return items.some(l => l.weigh && l.sub === null); }

let sharing = false;
async function shareText(text, btn){
  if (sharing) return;                      // 避免連點開兩次分享選單
  const data = { text };
  if (!canNativeShare(data)) {
    // 不支援分享 → 改成複製
    const ok = await copyText(text, btn);
    if (ok) toast("這支手機不支援分享，已改成「已複製」，請到 LINE 貼上");
    return ok ? "copied" : "fail";
  }
  sharing = true;
  const old = btn ? btn.innerHTML : "";
  if (btn) { btn.disabled = true; btn.textContent = "開啟分享中…"; }
  try {
    await navigator.share(data);            // 必須在使用者點擊時直接呼叫
    toast("已交給分享選單，請到 LINE 等 App 確認有送出");
    return "shared";
  } catch (e) {
    if (e && e.name === "AbortError") { toast("已取消，沒有分享"); return "cancel"; }
    toast("分享沒有成功，請改按「複製」再貼上", true);
    return "fail";
  } finally {
    sharing = false; if (btn) { btn.disabled = false; btn.innerHTML = old; }
  }
}


/* 訂單預覽＋電話選項＋分享／複製（共用同一份 buildText） */
function shareBlock(shareLabel, copyLabel){
  return `<pre class="preview" data-preview></pre>
    <div class="phone-opt"><span data-phstate></span><button type="button" class="link-btn" data-phtoggle></button></div>
    <button type="button" class="btn line ln-full" data-act="line">傳到 LINE 群組</button>
    <div class="share-actions">
      <button type="button" class="btn ghost" data-act="share">${ICON.share}${shareLabel}</button>
      <button type="button" class="btn ghost" data-act="copy">${ICON.copy}${copyLabel}</button></div>`;
}
function bindShare(root, o){
  let full = false;
  const pre = root.querySelector("[data-preview]"), st = root.querySelector("[data-phstate]"), tg = root.querySelector("[data-phtoggle]");
  const text = () => buildText(o, { fullPhone: full });
  st.parentNode.hidden = !o.addr;   // 電話已經是完整的；只有外送地址可以選遮蔽或完整
  const paint = () => {
    pre.textContent = text();
    st.textContent = full ? "分享內容含完整地址（只用這一次）" : "地址已遮蔽";
    st.className = full ? "warn" : "";
    tg.textContent = full ? "改回遮蔽" : "改成完整地址";
  };
  tg.onclick = async () => {
    if (!full && !(await askConfirm({ title: "分享完整地址？", ok: "包含完整地址", danger: true,
      msg: "分享或複製出去的文字會有客人的完整地址。只有確定對方需要時才這樣做（例如給外送的人）。" }))) return;
    full = !full; paint();
  };
  // 完整電話只用一次：分享或複製之後自動改回遮蔽
  const use = (fn, btn) => { const p = fn(text(), btn); if (full) { full = false; paint(); } return p; };
  root.querySelector('[data-act="share"]').onclick = e => use(shareText, e.currentTarget);
  root.querySelector('[data-act="copy"]').onclick = e => use(copyText, e.currentTarget);
  root.querySelector('[data-act="line"]').onclick = e => use(async (t, b) => {
    const r = await LineBot.send(t, b, orderCard(o, { fullPhone: full }));
    if (r) toast(`已傳到 LINE「${r.group}」${LineBot.quotaText(r.quota) ? "，" + LineBot.quotaText(r.quota) : ""}`);
  }, e.currentTarget);
  paint();
}

/* ===== 對話框（確認／密碼） ===== */
const dlg = document.getElementById("dlg"), dlgBox = document.getElementById("dlgBox");
const pinField = (id, ph) => `<input class="pin-in" id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="${ph}">`;
function unlockDialog(){
  return new Promise(resolve => {
    const shared = (Vault.meta() || {}).shared;
    dlgBox.innerHTML = `<h4>輸入訂單密碼</h4><p>訂單裡有客人電話，輸入密碼後才能查看。</p>
      ${shared ? pwField("pinU", "店家密碼") : pinField("pinU", "密碼")}<div class="dlg-err" id="pinErr"></div>
      <div class="dlg-btns"><button type="button" class="btn ghost" data-no>取消</button><button type="button" class="btn" data-yes>解鎖</button></div>
      <div style="text-align:center;margin-top:8px"><button type="button" class="link-btn" data-forgot>忘記密碼</button></div>`;
    dlg.classList.add("show");
    const inp = $("pinU"), err = $("pinErr");
    setTimeout(() => inp.focus(), 50);
    const go = async () => {
      err.textContent = "解鎖中…";
      const pw = inp.value;
      if (await Vault.unlock(pw)) {
        closeDlg(); resolve(true);
        if (shared) Sync.ensureMember(pw);       // 舊版升級：順便把這支手機登記為店家裝置
        if (Sync.merges().length) Sync.soon();   // 之前沒解鎖時遇到的衝突，現在合併
      }
      else { err.textContent = "密碼不正確"; inp.value = ""; inp.focus(); }
    };
    inp.onkeydown = e => { if (e.key === "Enter") go(); };
    dlgBox.querySelector("[data-yes]").onclick = go;
    dlgBox.querySelector("[data-no]").onclick = () => { closeDlg(); resolve(false); };
    dlgBox.querySelector("[data-forgot]").onclick = async () => {
      closeDlg();
      const a = await askConfirm({ title: "忘記密碼", ok: "清除並重設", danger: true,
        msg: shared ? "會清除這支手機上的訂單資料。雲端的訂單不受影響，之後用正確的店家密碼就能重新加入。" : "密碼無法找回。要重新設定，必須刪除這支手機上所有已存的訂單。" });
      const b = a && await askConfirm({ title: "確定刪除全部訂單？", ok: "刪除全部", danger: true,
        msg: shared ? "這支手機上還沒同步的訂單會刪除（清除前會先留一份加密備份）。" : "所有訂單和客人電話都會從這支手機刪除（清除前會先留一份加密備份，想起密碼時可以復原）。" });
      if (b) { await Backup.snapshot("before-wipe"); Vault.wipe(); localStorage.removeItem(SYNC_KEY); Sync.paint(); toast("已清除這支手機的資料，下次存檔時會請你輸入店家密碼"); }
      resolve(false);
    };
  });
}

/* ===== 訂單加密保存 =====
   每筆訂單用 AES-GCM 加密，金鑰再用 RSA 公鑰包起來。
   接單存檔只需要公鑰；讀取需要私鑰，私鑰由店家密碼（PBKDF2）加密保存。
   第一次輸入密碼後，私鑰以「不可匯出」的形式記在這支手機的 IndexedDB，之後打開不用再輸入；按「鎖定」才會忘記。
   更換店家密碼會換一組新金鑰；舊金鑰用新密碼加密後留在「金鑰圈」，舊手機還沒上傳的訂單才讀得到。
   刪除只是移到「最近刪除」，30 天內可以復原。 */

/* ===== 訂單更新通知（網頁開著時）：上方跳出、震動、提示音；網頁在背景時標題顯示數字 ===== */
const Notify = {

    try {

      [0, 0.18].forEach(t => {
        const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.15);

};
setTimeout(() => Notify.init(), 0);

const Vault = {
  pub: null, priv: null, keys: null, kid: "", orders: null, trash: null, unlockedAt: 0,
  supported(){ return !!(window.isSecureContext && window.crypto && crypto.subtle); },
  meta(){ try { return JSON.parse(localStorage.getItem(VAULT_KEY) || "null"); } catch (e) { return null; } },
  exists(){ return !!this.meta(); },
  records(){ try { return JSON.parse(localStorage.getItem(ENC_KEY) || "[]"); } catch (e) { return []; } },
  writeRecords(r){ localStorage.setItem(ENC_KEY, JSON.stringify(r)); },
  legacy(){ try { const a = JSON.parse(localStorage.getItem(LEGACY_KEY) || "[]"); return Array.isArray(a) ? a.filter(o => o && o.items) : []; } catch (e) { return []; } },
  async loadPub(){
    if (this.pub) return;
    const m = this.meta(); if (!m) throw new Error("no vault");
    this.pub = await crypto.subtle.importKey("jwk", m.pub, RSA, false, ["wrapKey"]);
    this.kid = await kidOf(m);
  },
  async unlock(pin){
    const m = this.meta(); if (!m || typeof pin !== "string" || pin.length < 4 || pin.length > 64) return false;
    const keys = await Backup.keys(m, pin);
    if (!keys) return false;
    await this.useKeys(keys, m);
    return true;
  },
  async useKeys(keys, m){
    this.keys = keys; this.kid = await kidOf(m); this.priv = keys.get(this.kid);
    await this.reload();
    this.unlockedAt = Date.now();
    armIdle();
    await KV.set(KEYS_KV, { kid: this.kid, keys: [...keys.entries()] });   // 記住（不可匯出的金鑰物件）
  },
  /* 打開網頁時：用記住的金鑰自動解鎖，不用再輸入密碼 */
  async autoUnlock(){
    if (this.keys) return true;
    const m = this.meta(), s = await KV.get(KEYS_KV);
    if (!m || !s || !Array.isArray(s.keys) || s.kid !== await kidOf(m)) return false;
    this.keys = new Map(s.keys); this.kid = s.kid; this.priv = this.keys.get(this.kid);
    if (!this.priv) { this.keys = null; return false; }
    await this.reload();
    this.unlockedAt = Date.now();
    return true;
  },
  /* 只確認密碼對不對，不改變目前狀態 */
  async verify(pin){ const m = this.meta(); return !!(m && typeof pin === "string" && await Backup.keys(m, pin)); },
  async reload(){
    if (!this.keys) return;
    const list = [], trash = [];
    for (const rec of this.records()) {
      try { const o = await this.open(rec); if (rec.del) trash.push({ o, del: rec.del }); else list.push(o); } catch (e) {}
    }
    this.orders = list.sort((a, b) => b.id - a.id);
    this.trash = trash.sort((a, b) => b.del - a.del);
    lineDailySoon();
  },
  lock(forget){ this.priv = null; this.keys = null; this.orders = null; this.trash = null; this.unlockedAt = 0; if (forget) KV.del(KEYS_KV); },
  /* 取出原始私鑰（更換密碼時把舊金鑰放進新的金鑰圈） */
  async rawKeys(meta, pw){
    try {
      const pk = await Backup.pinKey(pw, unb64(meta.salt), meta.iter), out = [];
      out.push({ kid: await kidOf(meta), pk8: await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(meta.iv) }, pk, unb64(meta.priv)) });
      for (const r of meta.ring || []) { try { out.push({ kid: r.kid, pk8: await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(r.iv) }, pk, unb64(r.priv)) }); } catch (e) {} }
      return out;
    } catch (e) { return null; }
  },
  /* 產生一組新的金鑰，私鑰（和舊金鑰圈）用店家密碼加密 */
  async makeMeta(pw, shared, ring = []){
    const kp = await crypto.subtle.generateKey({ ...RSA, modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["wrapKey", "unwrapKey"]);
    const pubJwk = await crypto.subtle.exportKey("jwk", kp.publicKey);
    const pk8 = await crypto.subtle.exportKey("pkcs8", kp.privateKey);
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 300000;
    const pk = await Backup.pinKey(pw, salt, iter), kid = (await sha256hex(pubJwk.n)).slice(0, 16);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, pk, pk8);
    const encRing = [];
    for (const r of ring) {
      if (r.kid === kid || encRing.some(x => x.kid === r.kid)) continue;
      const riv = crypto.getRandomValues(new Uint8Array(12));
      encRing.push({ kid: r.kid, iv: b64(riv), priv: b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv: riv }, pk, r.pk8)) });
    }
    return { v: 3, kid, shared: !!shared, iter, salt: b64(salt), iv: b64(iv), priv: b64(ct),
      pub: { kty: pubJwk.kty, n: pubJwk.n, e: pubJwk.e, alg: pubJwk.alg, ext: true }, ring: encRing };
  },
  /* 換成新的金鑰（加入或建立店家同步），把手上的訂單用新金鑰重新加密 */
  async install(meta, pw, carry, carryTrash){
    const keep = carry || [], gone = carryTrash || [];
    const old = localStorage.getItem(VAULT_KEY), oldRecs = localStorage.getItem(ENC_KEY);
    try {
      localStorage.setItem(VAULT_KEY, JSON.stringify(meta));
      this.pub = null; this.lock();
      if (!(await this.unlock(pw))) throw new Error("pw");
      const recs = [];
      for (const o of keep) { o.upd = o.upd || o.id; const rec = await this.seal(o); if (meta.shared) rec.p = 1; recs.push(rec); }
      for (const t of gone) { const rec = await this.seal(t.o); rec.del = t.del; if (meta.shared) rec.p = 1; recs.push(rec); }
      this.writeRecords(recs.sort((a, b) => b.id - a.id));
      await this.reload();
      localStorage.removeItem(LEGACY_KEY);
    } catch (e) {
      // 失敗就還原，不遺失資料
      if (old) localStorage.setItem(VAULT_KEY, old); else localStorage.removeItem(VAULT_KEY);
      if (oldRecs) localStorage.setItem(ENC_KEY, oldRecs);
      this.pub = null; this.lock(true);
      throw e;
    }
  },
  /* 改用雲端的新金鑰（店家密碼更換後重新加入），保留手機上的訂單 */
  async adopt(meta, pw){
    const cur = this.meta();
    if (cur && JSON.stringify(cur) === JSON.stringify(meta)) { if (!(await this.unlock(pw))) throw new Error("pw"); return; }
    if (cur && !this.keys) { const k = await Backup.keys(cur, pw); if (k) await this.useKeys(k, cur); else await this.autoUnlock(); }
    const oldKid = cur ? await kidOf(cur) : "", kids = new Set([await kidOf(meta), ...(meta.ring || []).map(r => r.kid)]);
    const recs = this.records(), redo = [];
    for (const r of recs) {
      if (!r.kid && oldKid) r.kid = oldKid;
      if (r.kid && !kids.has(r.kid) && this.keys) { try { redo.push({ r, o: await this.open(r) }); } catch (e) {} }   // 新金鑰圈讀不到：先解開，換金鑰後重新加密
    }
    const old = localStorage.getItem(VAULT_KEY);
    localStorage.setItem(VAULT_KEY, JSON.stringify(meta)); this.pub = null;
    const keys = await Backup.keys(meta, pw);
    if (!keys) { if (old) localStorage.setItem(VAULT_KEY, old); this.pub = null; throw new Error("pw"); }
    for (const { r, o } of redo) { const n = await this.seal(o, await crypto.subtle.importKey("jwk", meta.pub, RSA, false, ["wrapKey"]), await kidOf(meta)); Object.assign(r, { iv: n.iv, wk: n.wk, ct: n.ct, kid: n.kid, p: 1 }); delete r.base; }
    this.writeRecords(recs);
    await this.useKeys(keys, meta);
  },
  async seal(order, pub, kid){
    if (!pub) { await this.loadPub(); pub = this.pub; kid = this.kid; }
    const k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, te.encode(JSON.stringify(order)));
    const wk = await crypto.subtle.wrapKey("raw", k, pub, { name: "RSA-OAEP" });
    return { id: order.id, iv: b64(iv), wk: b64(wk), ct: b64(ct), upd: order.upd || order.id, kid };
  },
  open(rec){ return Backup.openRec(this.keys || new Map(this.priv ? [["", this.priv]] : []), rec); },
  /* 開始修改一筆已同步的訂單前：記下雲端的上一版（衝突時三方比較用，也會存成歷史版本） */
  markEdit(x){
    if (!x.p && x.ut && !x.base) x.base = { iv: x.iv, wk: x.wk, ct: x.ct, kid: x.kid, upd: x.upd, ver: x.ver, del: x.del || 0, dtsRaw: x.dtsRaw, by: x.by, rts: x.rts };
    if (Sync.on()) x.p = 1;
  },
  async put(order){
    order.upd = Date.now();
    const rec = await this.seal(order);
    const r = this.records(), i = r.findIndex(x => x.id === order.id);
    if (i >= 0) {
      const x = r[i];
      this.markEdit(x);
      for (const k of ["ver", "ut", "gone", "dtsRaw", "by", "rts", "base", "del", "p"]) if (x[k] !== undefined) rec[k] = x[k];
      r[i] = rec;
    } else { if (Sync.on()) rec.p = 1; r.unshift(rec); }
    this.writeRecords(r);
    if (!this.records().some(x => x.id === order.id && x.ct === rec.ct)) throw new Error("save");   // 讀回確認真的存進去
    Sync.soon();
    if (this.orders) {
      const j = this.orders.findIndex(x => x.id === order.id);
      if (j >= 0) this.orders[j] = order; else this.orders.unshift(order);
      lineDailySoon();
    }
  },
  /* del=時間：移到「最近刪除」；del=0：復原 */
  setDel(ids, del){
    const set = new Set(ids), r = this.records();
    for (const x of r) if (set.has(x.id) && !!x.del !== !!del) { this.markEdit(x); x.del = del; }
    this.writeRecords(r);
    Sync.soon();
    if (this.orders) {
      if (del) { const moved = this.orders.filter(o => set.has(o.id)); this.orders = this.orders.filter(o => !set.has(o.id)); this.trash = [...moved.map(o => ({ o, del })), ...(this.trash || [])]; }
      else { const back = (this.trash || []).filter(t => set.has(t.o.id)); this.trash = (this.trash || []).filter(t => !set.has(t.o.id)); this.orders = [...this.orders, ...back.map(t => t.o)].sort((a, b) => b.id - a.id); }
      lineDailySoon();
    }
  },
  remove(id){ this.setDel([id], Date.now()); },
  restore(ids){ this.setDel(ids, 0); },
  clearOrders(){ this.setDel(this.records().filter(r => !r.del).map(r => r.id), Date.now()); localStorage.removeItem(LEGACY_KEY); },
  /* 刪除超過 30 天、也不用再上傳的，從手機移除 */
  prune(){
    const lim = Date.now() - TRASH_DAYS * DAY, r = this.records(), keep = r.filter(x => !(x.del && x.del < lim && !x.p));
    if (keep.length !== r.length) { this.writeRecords(keep); if (this.trash) this.trash = this.trash.filter(t => t.del >= lim); }
  },
  wipe(){ [VAULT_KEY, ENC_KEY, LEGACY_KEY, MERGE_KEY].forEach(k => localStorage.removeItem(k)); this.pub = null; this.lock(true); },
  /* 舊版明碼訂單 → 加密後才刪除原資料，避免遺失 */
  async migrateLegacy(){
    const old = this.legacy(); if (!old.length) return 0;
    const used = new Set(this.records().map(r => r.id));
    let base = Date.now();
    const recs = [];
    for (const o of old) {
      let id = Number(o.id) || base--;
      while (used.has(id)) id = base--;
      used.add(id);
      const n = { ...o, id, name: String(o.name || ""), phone: String(o.phone || "").replace(/\D/g, "") };
      delete n.time;
      const rec = await this.seal(n);
      if (Sync.on()) rec.p = 1;
      recs.push({ rec, order: n });
    }
    this.writeRecords([...recs.map(x => x.rec), ...this.records()]);
    if (this.records().length >= recs.length) localStorage.removeItem(LEGACY_KEY);
    if (this.orders) { this.orders.push(...recs.map(x => x.order)); this.orders.sort((a, b) => b.id - a.id); }
    Sync.soon();
    return recs.length;
  },
};

/* 兩支手機同時改了同一筆訂單：逐欄三方比較（B 共同上一版、L 這支手機、R 雲端先同步的），不看手機時間。
   兩邊改了同一個地方而且不同 → 先用雲端的版本，這支手機的版本放在 cf.alt，列表會提示讓使用者選擇。 */
const ORDER_FIELD = { name: "客人", surname: "姓氏", title: "稱謂", phone: "電話", addr: "地址", date: "取貨日期", ptime: "取貨時間", market: "市場", memo: "備註",
  prep: "處理方式", pay: "付款", deposit: "訂金", items: "品項", odate: "訂購日", st: "狀態", stAt: "狀態時間", refund: "退款", refundAt: "退款時間" };
function mergeOrder3(B, L, R){
  const out = {}, cf = [];
  const keys = new Set([...Object.keys(L), ...Object.keys(R), ...(B ? Object.keys(B) : [])]);
  for (const k of keys) {
    if (["upd", "total", "cf", "id"].includes(k)) continue;
    const bi = B && B.items;
    if (k === "items" && Array.isArray(L.items) && Array.isArray(R.items) && L.items.length === R.items.length && (!B || (Array.isArray(bi) && bi.length === L.items.length))) {
      out.items = L.items.map((l, i) => {
        const r = R.items[i];
        if (!B && l && r && same({ ...l, sub: 0 }, { ...r, sub: 0 })) {   // 沒有共同上一版：一邊有秤重金額、一邊還沒填 → 補上
          if ((r.sub === null || r.sub === undefined) && l.sub !== null && l.sub !== undefined) return l;
          if ((l.sub === null || l.sub === undefined) && r.sub !== null && r.sub !== undefined) return r;
        }
        const [v, c] = pick3(B && bi[i], l, r, !!B);
        if (c && !cf.includes("items")) cf.push("items");
        return v;
      });
      continue;
    }
    const [v, c] = pick3(B ? B[k] : undefined, L[k], R[k], !!B);
    if (c) cf.push(k);
    if (v !== undefined) out[k] = v;
  }
  out.id = R.id; out.upd = Math.max(L.upd || 0, R.upd || 0); out.total = calcTotal(out.items || []);
  if (cf.length) { const alt = { ...L }; delete alt.cf; out.cf = { at: Date.now(), dev: deviceInfo().name, fields: cf, alt }; }
  else if (R.cf) out.cf = R.cf;
  return { m: out, conflict: cf.length > 0 };
}

/* ===== 雲端同步（訂單加密後才上傳，雲端只有亂碼） =====
   房間代號由店家密碼推算；每支手機第一次輸入店家密碼時，在背景自動登記為店家裝置。
   每筆資料有版本號：上傳時雲端版本若已被別支手機改過，就先合併再上傳，不會互相覆蓋。
   打開的手機每 6 秒檢查一次變動，其他手機的新增、修改、刪除、復原會自動出現。 */
const SYNC_KEY = "syncCfg", POLL_MS = 6000, FULL_MS = 3 * 3600 * 1000;
const NEED_TEXT = {
  join: "需要輸入一次店家密碼",
  retired: "店家密碼已更換，請輸入新的店家密碼",
  revoked: "這支手機的同步已被停用",
  rotating: "更換店家密碼還沒完成",
};
const Sync = {
  busy: false, again: false, last: 0, state: "", timer: null, cur: null, n: 0,
  cfg(){ try { return JSON.parse(localStorage.getItem(SYNC_KEY) || "null") || {}; } catch (e) { return {}; } },
  saveCfg(c){ localStorage.setItem(SYNC_KEY, JSON.stringify(c)); },
  upd(p){ this.saveCfg({ ...this.cfg(), ...p }); },
  on(){ return !!this.cfg().room; },
  need(){ return this.cfg().need || ""; },
  get lastFull(){ return Number(localStorage.getItem("fullAt:" + this.cfg().room)) || 0; },
  set lastFull(v){ try { localStorage.setItem("fullAt:" + this.cfg().room, String(v)); } catch (e) {} },
  merges(){ try { return JSON.parse(localStorage.getItem(MERGE_KEY) || "[]"); } catch (e) { return []; } },
  pending(){ return Vault.records().filter(r => r.p).length; },
  soon(){ this.paint(); clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 300); },
  run(force){
    if (!this.on()) { this.paint(); return Promise.resolve(); }
    if (this.busy) { this.again = true; return this.cur; }
    if (!navigator.onLine) { this.state = "off"; this.paint(); return Promise.resolve(); }
    if (this.need() && !force) { this.state = "need"; this.paint(); return Promise.resolve(); }
    this.busy = true; this.state = "busy"; this.paint();
    this.cur = (async () => {
      let changed = false;
      try {
        changed = await this.cycle();
        this.last = Date.now(); this.state = "ok";
        if (this.need() && this.need() !== "rotating") this.upd({ need: "" });
        Cloud.touch(this.cfg().room);
      } catch (e) {
        let why = "";
        if (e && (e.code === "retired" || e.code === "denied")) {   // 先看這支手機是不是被停用，再看密碼有沒有被更換
          why = await Cloud.diagnose(this.cfg().room).catch(() => e.code === "retired" ? "retired" : "");
          if (why === "denied" || why === "join") why = e.code === "retired" ? "retired" : why === "join" ? "join" : "";
          if (why === "retired" && this.cfg().rotating) why = "rotating";
        }
        if (why) { this.upd({ need: why }); this.state = "need"; }
        else this.state = navigator.onLine ? "err" : "off";
      } finally {
        this.busy = false; this.paint();
        if (changed && Vault.orders && modal.classList.contains("show")) refreshOrderView();
        if (this.again) { this.again = false; this.soon(); }
      }
    })();
    return this.cur;
  },
  async cycle(){
    const c = this.cfg(), room = c.room;
    if (c.purge && (typeof c.purge === "string" || Date.now() > c.purge.after)) {   // 更換密碼 7 天後清掉舊房間
      try { await Cloud.purgeRoom(c.purge.room || c.purge); this.upd({ purge: "" }); } catch (e) {}
    }
    if (c.legacy) { if (await Cloud.importLegacy(room, c.legacy) >= -1) this.upd({ legacy: "" }); }   // 舊版房間的資料搬過來
    let changed = false;
    if (Vault.keys) changed = await this.mergePending();
    // 舊版排隊中的刪除 → 改成「標記刪除」，30 天內還能復原
    for (const id of c.dels || []) {
      const d = await Cloud.getDoc(room, id);
      if (d && !d.data.del) await Cloud.put(room, id, { iv: d.data.iv, ct: d.data.ct, upd: d.data.upd, del: Date.now(), kid: d.data.kid }, { ver: d.data.ver || 0, ut: d.ut });
      const cc = this.cfg(); cc.dels = (cc.dels || []).filter(x => x !== id); this.saveCfg(cc);
    }
    const full = !this.lastFull || Date.now() - this.lastFull > FULL_MS;
    if (full || ++this.n % 5 === 0) { const rd = await Cloud.room(room); if (rd && rd.retired) throw new CloudError("retired"); }   // 約每 30 秒確認密碼有沒有被更換
    const docs = full ? await Cloud.list(room) : await Cloud.changedSince(room, (c.cursor || 0) - 10000);
    let me = ""; try { me = await Cloud.uid(); } catch (e) {}
    const news = [];
    changed = this.applyRemote(docs, full, me, news) || changed;
    changed = (await this.pushPending(room)) || changed;
    if (full) {
      this.lastFull = Date.now();
      await this.purgeOld(room, docs);
      Cloud.backupDaily(room, docs).catch(() => {});   // 雲端每日加密備份（今天已經有就跳過）
    }
    if (changed) await Vault.reload();
    if (news.length) Notify.show(news);
    return changed;
  },
  fromDoc(d){
    const p = String(d.data.ct || "").split(".");
    return { id: Number(d.id), iv: d.data.iv, wk: p[0], ct: p[1], upd: d.data.upd || 0, kid: d.data.kid || undefined, del: d.data.del || 0, ver: d.data.ver || 0, ut: d.ut,
      dtsRaw: d.dtsRaw, by: d.data.by, rts: d.data.ts };
  },
  fields(l){ return { iv: l.iv, ct: l.wk + "." + l.ct, upd: l.upd, del: l.del || 0, kid: l.kid, ver: l.ver }; },
  applyRemote(docs, full, me, news){
    const recs = Vault.records(), byId = new Map(recs.map(r => [r.id, r])), known = new Set(this.cfg().known || []);
    const first = !this.cfg().cursor;   // 第一次同步（新手機）不通知，免得一次跳一大堆
    let changed = false, maxTs = this.cfg().cursor || 0;
    const seen = new Set();
    for (const d of docs) {
      if (d.data.ts > maxTs) maxTs = d.data.ts;
      if (!ORDER_ID.test(d.id) || !d.data.ct) continue;
      const id = Number(d.id); seen.add(id);
      const l = byId.get(id);
      if (l && l.ut === d.ut) continue;
      // 換房間（升級或更換密碼）後：雲端已經有一樣的這筆（同一次修改），直接接上，不用再上傳
      if (l && l.p && !l.ut && !l.base && l.upd === (d.data.upd || 0) && !!l.del === !!d.data.del) { byId.set(id, this.fromDoc(d)); continue; }
      if (l && l.p) continue;    // 這支手機有待上傳的修改（上傳時合併）
      byId.set(id, this.fromDoc(d)); changed = true;
      if (news && !first && me && d.data.by && d.data.by !== me)   // 只通知「別支手機」做的新增／修改／刪除
        news.push({ id, kind: !l ? "new" : d.data.del && !l.del ? "del" : !d.data.del && l.del ? "back" : "edit" });
    }
    if (full) {
      for (const l of byId.values()) {
        if (seen.has(l.id) || l.p) continue;
        if (l.ut || known.has(l.id)) { if (!l.del) { l.del = Date.now(); l.gone = 1; changed = true; } }   // 雲端已經沒有：移到最近刪除，不直接刪
        else l.p = 1;                                                                                    // 從來沒上傳過
      }
    }
    Vault.writeRecords([...byId.values()].sort((a, b) => b.id - a.id));
    const c = this.cfg(); c.cursor = maxTs; if (full) delete c.known; this.saveCfg(c);
    return changed;
  },
  markPushed(id, sent, res, uid){
    const r = Vault.records(), x = r.find(y => y.id === id); if (!x) return;
    Object.assign(x, { ver: res.ver, ut: res.ut, dtsRaw: res.dtsRaw, by: uid, rts: Date.now() }); delete x.gone;
    if (x.ct === sent.ct && (x.del || 0) === (sent.del || 0)) { delete x.p; delete x.base; }
    else x.base = { iv: sent.iv, wk: sent.wk, ct: sent.ct, kid: sent.kid, upd: sent.upd, ver: res.ver, del: sent.del || 0, dtsRaw: res.dtsRaw, by: uid, rts: Date.now() };   // 上傳途中又改了：剛上傳的就是新的上一版
    Vault.writeRecords(r);
  },
  async pushPending(room){
    let changed = false;
    const pushed = [];
    try { return await this.pushPendingInner(room, pushed); } finally { if (pushed.length) Push.notify(pushed); }
  },
  async pushPendingInner(room, pushed){
    let changed = false;
    const uid = await Cloud.uid();
    for (const id of Vault.records().filter(r => r.p).map(r => r.id)) {
      for (let tries = 0; tries < 4; tries++) {
        const l = Vault.records().find(r => r.id === id); if (!l || !l.p) break;
        try {
          const b = l.base, base = l.gone || !l.ut ? null : { ver: l.ver, ut: l.ut, del: b ? b.del : 0, dtsRaw: b ? b.dtsRaw : undefined };
          const prev = b && base && Cloud.keepPrev({ ver: l.ver, by: b.by, rts: b.rts }, uid) ? { ...this.fields(b), ver: l.ver } : null;
          const res = await Cloud.put(room, id, this.fields(l), base, prev);
          this.markPushed(id, l, res, uid);
          const t = Math.max(l.upd || 0, l.del || 0);
          if (Date.now() - t < 10 * 60 * 1000) pushed.push(l.del ? "del" : !l.ut ? "new" : "edit");   // 剛剛才改的才通知（換房間搬資料不算）
          break;
        } catch (e) {
          if (e.code === "denied") { const why = await Cloud.diagnose(room); if (why !== "denied") throw e; }   // 被拒絕是因為版本不對 → 當成衝突
          else if (e.code !== "conflict") throw e;
          const r = await this.resolve(room, l);
          if (r) changed = true;
          if (r === "deferred") break;
        }
      }
    }
    return changed;
  },
  /* 衝突：讀雲端最新版本，逐欄三方合併。兩邊改了同一個地方 → 用雲端的，這支手機的版本存成歷史並提示使用者 */
  async resolve(room, l){
    const d = await Cloud.getDoc(room, l.id);
    const r = Vault.records(), i = r.findIndex(x => x.id === l.id);
    if (!d) { r[i].gone = 1; Vault.writeRecords(r); return false; }   // 雲端被清掉了：下一輪當新的一筆上傳
    const rr = this.fromDoc(d);
    if (!Vault.keys) {
      // 還沒解鎖：先用雲端版本，這支手機的版本留著，解鎖後再合併
      const m = this.merges(); const x = { ...l }; delete x.p; m.push(x);
      localStorage.setItem(MERGE_KEY, JSON.stringify(m));
      r[i] = rr; Vault.writeRecords(r);
      return "deferred";
    }
    let L, R, B = null;
    try { L = await Vault.open(l); R = await Vault.open(rr); } catch (e) { r[i] = rr; Vault.writeRecords(r); await Cloud.saveRev(room, l.id, this.fields(l)); return true; }
    if (l.base) { try { B = await Vault.open(l.base); } catch (e) {} }
    const { m, conflict } = mergeOrder3(B, L, R);
    const delL = !!l.del, delR = !!rr.del, delB = B ? !!l.base.del : null;
    const [delPick] = pick3(delB, delL, delR, B !== null);
    const del = delPick ? (rr.del || l.del) : 0;
    const sameAsR = same({ ...m, upd: 0, total: 0 }, { ...R, upd: 0, total: 0 }) && !!del === delR;
    if (sameAsR) { r[i] = rr; Vault.writeRecords(r); return true; }   // 合併後就是雲端版本：不用再上傳
    if (conflict) {
      await Cloud.saveRev(room, l.id, this.fields(l), "conflict");
      toast(`另一支手機同時修改了「${m.name || "訂單"}」，有不同的地方。已先保留先同步的版本，請在訂單列表確認。`, true);
    }
    const rec = await Vault.seal(m);
    Object.assign(rec, { del, ver: rr.ver, ut: rr.ut, dtsRaw: rr.dtsRaw, by: rr.by, rts: rr.rts, p: 1,
      base: { iv: rr.iv, wk: rr.wk, ct: rr.ct, kid: rr.kid, upd: rr.upd, ver: rr.ver, del: rr.del, dtsRaw: rr.dtsRaw, by: rr.by, rts: rr.rts } });
    r[i] = rec; Vault.writeRecords(r);
    return true;
  },
  async mergePending(){
    const m = this.merges(); if (!m.length) return false;
    const rest = [];
    for (const x of m) {
      const r = Vault.records(), i = r.findIndex(y => y.id === x.id);
      try {
        const X = await Vault.open(x);
        if (i < 0) { await Vault.put(X); continue; }
        const H = await Vault.open(r[i]);
        let B = null; if (x.base) { try { B = await Vault.open(x.base); } catch (e) {} }
        const { m: M, conflict } = mergeOrder3(B, X, H);
        if (same({ ...M, upd: 0, total: 0 }, { ...H, upd: 0, total: 0 })) continue;
        if (conflict) toast(`另一支手機同時修改了「${M.name || "訂單"}」，請在訂單列表確認。`, true);
        const rec = await Vault.seal(M);
        const cur = r[i];
        Object.assign(rec, { del: cur.del || 0, ver: cur.ver, ut: cur.ut, dtsRaw: cur.dtsRaw, by: cur.by, rts: cur.rts, p: 1,
          base: cur.ut ? { iv: cur.iv, wk: cur.wk, ct: cur.ct, kid: cur.kid, upd: cur.upd, ver: cur.ver, del: cur.del || 0, dtsRaw: cur.dtsRaw, by: cur.by, rts: cur.rts } : undefined });
        r[i] = rec; Vault.writeRecords(r);
      } catch (e) { rest.push(x); }
    }
    localStorage.setItem(MERGE_KEY, JSON.stringify(rest));
    return true;
  },
  /* 刪除超過 30 天的，雲端與手機都清掉（雲端以伺服器記下的刪除時間為準） */
  async purgeOld(room, docs){
    const lim = Date.now() - TRASH_DAYS * DAY - 3600 * 1000;
    const old = docs.filter(d => ORDER_ID.test(d.id) && d.data.del && d.data.dts && d.data.dts < lim);
    for (const d of old.slice(0, 100)) { try { await Cloud.commit([Cloud.del(`/rooms/${room}/orders/${d.id}`)]); } catch (e) {} }
    Vault.prune();
  },
  /* 換到另一個房間（舊版升級、店家密碼更換）或重新加入 */
  async switchTo(room, meta, pw, legacy){
    const c = this.cfg();
    if (Vault.exists()) await Vault.adopt(meta, pw); else await Vault.install(meta, pw, Vault.legacy());
    let known;
    if (c.room !== room) {
      const r = Vault.records();
      // 更換密碼：舊房間的資料都已經搬到新房間，新房間沒有的代表已刪除 → 放到最近刪除，不重新上傳
      if (c.v2) known = r.filter(x => x.ut && !x.p).map(x => x.id);
      r.forEach(x => { delete x.ut; delete x.ver; delete x.gone; delete x.dtsRaw; });   // 上一版內容（base）保留：衝突時仍可三方比較
      Vault.writeRecords(r);
    }
    const n = { ...this.cfg(), room, member: room, v2: true, need: "", legacy: legacy || "", cursor: c.room === room ? c.cursor : 0 };
    if (c.room !== room) { if (known) n.known = known; else delete n.known; }
    this.saveCfg(n);
    this.lastFull = 0;
    try { await StockCfg.join(room, pw, meta, legacy); } catch (e) {}
  },
  /* 輸入密碼解鎖時順便確認這支手機已加入新版房間（舊版升級，背景完成） */
  async ensureMember(pw){
    const c = this.cfg();
    if (!c.room || (c.v2 && c.member === c.room && StockCfg.get().member === c.room)) return;
    try {
      const r = await Cloud.enter(pw);
      if (r.state === "retired") { this.upd({ need: c.rotating ? "rotating" : "retired" }); this.paint(); return; }
      if (!r.meta) return;
      await this.switchTo(r.room, r.meta, pw, r.legacy);
      this.run();
    } catch (e) {}
  },
  label(){
    if (this.need()) return NEED_TEXT[this.need()] || "需要輸入店家密碼";
    const n = this.pending(), t = this.last ? hm(this.last) : "";
    if (this.state === "off") return n ? `離線中，${n} 筆已存在這支手機，有網路後自動上傳` : "離線中，有網路後會自動同步";
    if (this.state === "err") return n ? `上傳失敗，${n} 筆已存在這支手機，稍後自動重試` : "同步失敗，稍後自動重試";
    if (this.state === "busy") return "同步中…";
    if (this.state === "ok") return n ? `${n} 筆等待上傳` : `已同步 ${t}`;
    return "等待同步";
  },
  paint(){
    const p = $("syncPill");
    if (!this.on()) { p.hidden = true; return; }
    p.hidden = false;
    const st = this.need() ? "err" : this.state, n = this.pending();
    p.className = "sync-pill " + (st || "");
    p.textContent = this.need() ? "未同步" : st === "busy" ? "同步中" : st === "off" ? (n ? `離線・${n} 筆待傳` : "離線") : st === "err" ? (n ? `${n} 筆未上傳` : "未同步") : st === "ok" ? (n ? `${n} 筆待傳` : "已同步") : "同步";
    const box = $("syncLine"); if (box) box.textContent = this.label();
  },
};
$("syncPill").onclick = () => Sync.need() ? rejoinDialog() : Sync.run();
setInterval(() => { if (!document.hidden) Sync.run(); }, POLL_MS);
window.addEventListener("online", () => Sync.run());
window.addEventListener("offline", () => { Sync.state = "off"; Sync.paint(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) Sync.run(); });


/* LINE 中午提醒：只交「哪天幾筆、幾點取、在哪、要不要秤」，不交客人名字電話。
   內容沒變就不傳；同步中先等同步完，免得拿舊資料蓋掉別支手機剛存的。 */
var lineDailyTimer = null;
function lineDailySoon(){
  clearTimeout(lineDailyTimer);
  lineDailyTimer = setTimeout(lineDailySend, 4000);
}
async function lineDailySend(){
  if (!Vault.orders || !Sync.on() || !navigator.onLine) return;
  if (Sync.busy) { lineDailySoon(); return; }
  const today = ymd(new Date()), end = ymd(new Date(Date.now() + 45 * 864e5)), daily = {};
  for (const o of Vault.orders) {
    if (o.st || !o.date || o.date < today || o.date > end) continue;
    (daily[o.date] = daily[o.date] || []).push({ t: /^\d{1,2}:\d{2}$/.test(o.ptime || "") ? o.ptime : "", m: o.market === "外送" ? "" : String(o.market || "").slice(0, 12),
      w: (o.items || []).some(l => l.sub === null) ? 1 : 0, d: o.market === "外送" ? 1 : 0 });
  }
  const sig = JSON.stringify(daily), memo = "lineDaily:" + today;
  try { if (localStorage.getItem("lineDailySig") === memo + sig) return; } catch (e) {}
  try {
    await LineBot.call({ op: "daily", daily });
    try { localStorage.setItem("lineDailySig", memo + sig); } catch (e) {}
  } catch (e) {}   // 還沒連 LINE 或暫時連不上：下次有變動再傳
}

function refreshOrderView(){
  if (!Vault.orders || !modal.classList.contains("show")) return;
  const s = sheet.dataset.sub;
  if (s === "list") showOrders(true); else if (s === "prep") showPrep(); else if (s === "manage") showManage();
}

/* 需要重新輸入店家密碼（舊版升級、密碼已更換、被停用） */
async function rejoinDialog(reason){
  const need = (typeof reason === "string" && reason) || Sync.need();
  if (need === "rotating") { rotateFlow(); return; }
  const msg = {
    retired: "店家密碼已經在另一支手機更換。請輸入新的店家密碼，這支手機還沒上傳的訂單會一起帶過去。",
    revoked: "這支手機的同步已被其他手機停用。輸入店家密碼可以重新加入。",
    join: "這次更新需要再輸入一次店家密碼，之後這支手機會記住，不用再輸入。",
  }[need] || "請輸入店家密碼。";
  const ok = await askPassword({ title: need === "retired" ? "輸入新的店家密碼" : "輸入店家密碼", msg, ok: "繼續", cancel: "稍後",
    check: async pw => {
      if (!navigator.onLine) return "需要網路，請連上網路再試";
      const r = await Cloud.enter(pw);
      if (r.state === "retired") return "這是已經換掉的舊密碼，請輸入新的店家密碼";
      if (r.state === "none") return "找不到使用這組密碼的店家，請確認有沒有打錯";
      await Sync.switchTo(r.room, r.meta, pw, r.legacy);
      return true;
    } });
  if (!ok) return;
  toast("已加入店家同步");

}

/* 店家密碼：第一次使用、或把這支手機加入同步 */
function storeDialog(carry, intro, carryTrash){
  return new Promise(resolve => {
    const done = v => { closeDlg(); resolve(v); };
    const finish = async (r, pw) => {
      await Vault.install(r.meta, pw, carry, carryTrash);
      Sync.saveCfg({ ...Sync.cfg(), room: r.room, member: r.room, v2: true, need: "", cursor: 0, legacy: r.legacy || "" });
      Sync.lastFull = 0;
      try { await StockCfg.join(r.room, pw, r.meta, r.legacy); } catch (e) {}
    };
    const step1 = () => {
      dlgBox.innerHTML = `<h4>輸入店家密碼</h4>
        <p>${intro || ""}其他手機已經在用的話，輸入同一組密碼就會自動同步訂單；第一次建立請自己設定一組（至少 8 碼，忘記就無法找回）。</p>
        ${pwField("spw", "店家密碼")}<div class="dlg-err" id="pwErr"></div>
        <div class="dlg-btns"><button type="button" class="btn ghost" data-no>取消</button><button type="button" class="btn" data-yes>下一步</button></div>`;
      dlg.classList.add("show");
      const inp = $("spw"), err = $("pwErr"), yes = dlgBox.querySelector("[data-yes]");
      setTimeout(() => inp.focus(), 50);
      dlgBox.querySelector("[data-no]").onclick = () => done(false);
      const go = async () => {
        const pw = inp.value;
        if (pw.length < 8) { err.textContent = "店家密碼至少 8 碼"; return; }
        if (!navigator.onLine) { err.textContent = "第一次設定需要網路，請連上網路再試"; return; }
        yes.disabled = true; err.textContent = "連線中…";
        try {
          const r = await Cloud.enter(pw);
          if (r.state === "retired") { yes.disabled = false; err.textContent = "這是已經換掉的舊密碼，請輸入新的店家密碼"; return; }
          if (r.meta) { err.textContent = "加入中…"; await finish(r, pw); done("joined"); }
          else step2(pw);
        } catch (e) { yes.disabled = false; err.textContent = "連不上同步伺服器，請確認網路後再試"; }
      };
      inp.onkeydown = e => { if (e.key === "Enter") go(); };
      yes.onclick = go;
    };
    const step2 = pw => {
      dlgBox.innerHTML = `<h4>建立新的店家同步</h4>
        <p>找不到使用這組密碼的店家，會用它建立新的。如果其他手機已經在用，請按「返回」確認密碼有沒有打錯。</p>
        ${pwField("spw2", "再輸入一次店家密碼")}<div class="dlg-err" id="pwErr"></div>
        <div class="dlg-btns"><button type="button" class="btn ghost" data-no>返回</button><button type="button" class="btn" data-yes>建立</button></div>`;
      const inp = $("spw2"), err = $("pwErr"), yes = dlgBox.querySelector("[data-yes]");
      setTimeout(() => inp.focus(), 50);
      dlgBox.querySelector("[data-no]").onclick = step1;
      const go = async () => {
        if (inp.value !== pw) { err.textContent = "兩次輸入不一樣"; return; }
        yes.disabled = true; err.textContent = "建立中…";
        try {
          const meta = await Vault.makeMeta(pw, true);
          const r = await Cloud.enter(pw, { create: true, newMeta: meta });
          if (r.state === "retired" || !r.meta) throw new Error("retired");
          await finish(r, pw);
          done(r.state === "created" ? "created" : "joined");
        } catch (e) { yes.disabled = false; err.textContent = "建立失敗，請確認網路後再試"; }
      };
      inp.onkeydown = e => { if (e.key === "Enter") go(); };
      yes.onclick = go;
    };
    step1();
  });
}

    if (Sync.on()) {

/* 等這一筆真的上傳完（最多 ms 毫秒），回傳 synced／offline／retry */
async function syncOne(id, ms){
  const end = Date.now() + ms;
  while (Date.now() < end) {
    const rec = Vault.records().find(r => r.id === id);
    if (!rec || !rec.p) return "synced";
    if (!navigator.onLine) return "offline";
    if (!Sync.busy) { await Sync.run(); if (Sync.state === "err") await new Promise(r => setTimeout(r, 1500)); }   // 失敗了稍等再試，不要一直打伺服器
    else await new Promise(r => setTimeout(r, 250));
  }
  const rec = Vault.records().find(r => r.id === id);
  return !rec || !rec.p ? "synced" : navigator.onLine ? "retry" : "offline";
}

/* 儲存結果：成功／只存在手機／同步失敗／沒存到，分開顯示 */
function showSaveResult(order, state, edited){
  const ok = !["fail", "nosupport"].includes(state);
  const msg = {
    synced: ["ok", "已儲存，並同步到所有手機"],
    local: ["ok", "已儲存在這支手機（沒有開啟多支手機同步）"],
    offline: ["warn", "目前離線：已存在這支手機，有網路後會自動同步"],
    retry: ["warn", "已存在這支手機，但還沒同步成功，會自動重試"],
    fail: ["bad", "訂單沒有儲存成功。請先按「分享」或「複製」保留內容，再按「再試一次」"],
    nosupport: ["bad", "這個網址無法加密存檔（需要 https 網址），這筆沒有儲存，請先分享或複製"],
  }[state];
  sheet.dataset.view = ""; sheet.dataset.sub = "";
  sheet.innerHTML = `<h3 class="${ok ? "" : "bad"}">${ok ? ICON.check : ""}${ok ? (edited ? "訂單已修改" : "訂單已儲存") : "訂單沒有儲存"}</h3>
    <div class="state ${msg[0]}">${msg[1]}</div>
    ${shareBlock("分享訂單", "複製訂單")}
    <div class="actions">${state === "fail" ? `<button type="button" class="btn" id="retrySave">再試一次</button>` : ""}
      <button type="button" class="btn ghost" id="nextOrder">${ok ? "下一筆" : "放棄這筆"}</button></div>`;
  bindShare(sheet, order);
  const rs = document.getElementById("retrySave");
  if (rs) rs.onclick = async () => {
    rs.disabled = true; rs.textContent = "儲存中…";
    try { await Vault.put(order);
      showSaveResult(order, !Sync.on() ? "local" : await syncOne(order.id, 8000), edited);
    } catch (e) { rs.disabled = false; rs.textContent = "再試一次"; toast("還是沒有儲存成功", true); }
  };
  document.getElementById("nextOrder").onclick = async () => {
    if (!ok && !(await askConfirm({ title: "放棄這筆訂單？", msg: "這筆沒有儲存，離開後就找不回來了。", ok: "放棄", danger: true }))) return;
    navigator.onLine ? location.reload() : resetForm();   // 離線時重新整理會打不開頁面，改成直接清空表單
  };
}

/* ===== 修改訂單：把訂單帶回表單 ===== */
let editing = null;
function fillForm(o){
  // 清空
  Object.keys(qty).forEach(k => qty[k] = 0);
  Object.keys(amounts).forEach(k => delete amounts[k]);
  Object.keys(want).forEach(k => delete want[k]);
  Object.keys(pcPrice).forEach(k => delete pcPrice[k]);
  for (const l of o.items || []) {
    const p = parseLine(l); if (!p) continue;
    const si = MENU.findIndex(s => s.cat === p.cat), sec = MENU[si]; if (!sec) continue;
    const ii = sec.items.findIndex(it => it.name === p.nm), it = sec.items[ii]; if (!it) continue;
    if (it.type === "amount" || it.type === "money") {
      const k = `${si}-${ii}-amt`; want[k] = true;
      amounts[k] = it.type === "money" ? (Number(l.sub) || 0) : (Number(l.est) || 0);
    } else if (it.type === "piece") {
      const k = `${si}-${ii}-pc`; qty[k] = p.q;
      const tot = l.est || 0; pcPrice[k] = tot && p.q ? Math.round(tot / p.q) : 0;
    } else {
      const oi = it.opts.findIndex(x => x.label === p.sp); if (oi < 0) continue;
      const k = `${si}-${ii}-${oi}`; qty[k] = (qty[k] || 0) + p.q;
      const v = it.weigh ? (l.est || l.sub) : l.sub;
      if (v && p.q) prices[k] = Math.round(v / p.q);
    }
  }
  // 畫面
  document.querySelectorAll("#menu .stepper").forEach(st => { const k = st.id.slice(2); setQ(st, qty[k] || 0); st.classList.toggle("on", (qty[k] || 0) > 0); });

/* 打開訂單列表：沒設密碼先設定，有設定就要解鎖 */
async function openOrders(){

  if (!Vault.exists()) {

/* ===== 訂單狀態：待處理 → 已取貨／已送達，或取消 ===== */
const ST_FILTERS = [["today", "今天"], ["open", "待處理"], ["done", "已完成"], ["cancel", "已取消"], ["all", "全部"]];
let listFilter = "open";
// 「今天」：今天取貨、沒取消的，照取貨時間排（LINE 中午提醒的按鈕會直接打開這裡）
const inFilter = (o, k) => k === "all" || (k === "today" ? o.date === ymd(new Date()) && o.st !== "cancel" : stGroup(o) === k);
const listOrder = (all, k) => { const ix = [...all.keys()]; if (k !== "today") return ix;
  const key = o => (o.st ? "1" : "0") + (o.ptime || "99");   // 還沒取的在前，照時間；取完的沉到最後
  return ix.sort((a, b) => key(all[a]) < key(all[b]) ? -1 : key(all[a]) > key(all[b]) ? 1 : 0); };
function todaySummary(all){
  const t = all.filter(o => inFilter(o, "today")); if (!t.length) return "";
  const left = t.filter(o => !o.st), pend = left.filter(o => hasPending(o.items)).length;
  const next = left.map(o => o.ptime).filter(Boolean).sort()[0];
  return `<div class="today-sum"><div><b>${left.length}</b><span>待取貨</span></div><div><b>${t.length - left.length}</b><span>已完成</span></div>
    <div><b>${pend}</b><span>待秤重</span></div><div><b>${next || "—"}</b><span>最早取貨</span></div></div>`;
}
const stGroup = o => o.st === "cancel" ? "cancel" : o.st ? "done" : "open";
const stLabel = o => ({ picked: "已取貨", delivered: "已送達", cancel: "已取消" })[o.st] || "";
const REFUND = { todo: "待退款", done: "已退款", none: "不退款" };
async function setStatus(o, v, btn){
  if (!o) return;
  const paid = paidOf(o);
  if (v === "cancel" && !(await askConfirm({ title: "取消這筆訂單？", ok: "取消訂單", cancel: "不要", danger: true,
      msg: `${o.name} ${fmtDate(o.date)} 的訂單會移到「已取消」，備料統計也不會再算。之後還可以改回來。${paid ? `\n\n已收 $${paid}，會記成「待退款」，退了再按「已退款」。` : ""}` }))) return;
  if (v === "picked" || v === "delivered") {
    // 交貨和付款是分開的：標成完成不會改付款狀態，只提醒還有哪些沒處理
    const items = o.items || [], warn = [];
    if (hasPending(items)) warn.push("有秤重品項還沒補金額");
    if (hasUnpriced(items)) warn.push("有品項還沒定價");
    if (o.pay !== "full") warn.push(o.pay === "deposit" ? payText(o).replace("・", "，") : "還沒付款");
    if (warn.length && !(await askConfirm({ title: "這筆還有沒處理的", ok: "還是標成" + (v === "picked" ? "已取貨" : "已送達"), cancel: "先不要",
        msg: warn.map(x => "・" + x).join("\n") + "\n\n標成完成不會改變付款狀態，收到錢要另外標「已付清」。" }))) return;
  }
  if (btn) btn.disabled = true;
  const n = { ...o, st: v || "", stAt: v ? Date.now() : 0 };
  if (v === "cancel" && paid) { n.refund = "todo"; n.refundAt = 0; }
  if (!v) { delete n.st; delete n.stAt; delete n.refund; delete n.refundAt; }   // 改回待處理：備料統計重新計入
  try { await Vault.put(n); }
  catch (e) { toast("沒有存成功，請再試一次", true); if (btn) btn.disabled = false; return; }
  toast(v ? `已標成「${stLabel(n)}」` : "已改回待處理");
  showOrders(true);
}
async function setRefund(o, v){
  try { await Vault.put({ ...o, refund: v, refundAt: Date.now() }); } catch (e) { toast("沒有存成功，請再試一次", true); return; }
  toast(`已記錄「${REFUND[v]}」`); showOrders(true);
}
/* 收到全部的錢：只有金額都確定了才能標已付清 */
async function setPaid(o){
  if (hasPending(o.items || []) || hasUnpriced(o.items || [])) { toast("還有秤重或未定價的品項，金額確定後才能標已付清", true); return; }
  try { await Vault.put({ ...o, pay: "full", deposit: 0, paidAt: Date.now(), depositWas: o.pay === "deposit" ? o.deposit : undefined }); }
  catch (e) { toast("沒有存成功，請再試一次", true); return; }
  toast("已標成「已付清」"); showOrders(true);
}
