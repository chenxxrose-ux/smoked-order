<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="剩貨">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://fodibhcjitnrgpvqttky.supabase.co; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>剩貨紀錄</title>
<style>
  :root{
    --paper:#F7F6F3; --card:#FFFFFF; --ink:#1E1A17; --sub:#8A847D; --hair:#ECE9E4; --fill:#F1EFEB; --fill-press:#E6E3DE;
    --soy:#7B1F24; --soy-press:#5E171B; --soy-tint:#F5E9E9;
    --gold:#9A6B17; --gold-soft:#F7F0E1; --red:#B3261E; --red-soft:#FBECEA;
    --r:14px; --gut:16px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
    padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  input,textarea,button{-webkit-appearance:none;appearance:none;font-family:inherit;color:inherit}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  button{touch-action:manipulation;cursor:pointer;border:none;background:none;padding:0}
  :focus-visible{outline:2px solid var(--soy);outline-offset:2px}
  .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* 頂部 */
  .top{position:sticky;top:0;z-index:5;background:rgba(242,245,243,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    padding:calc(10px + env(safe-area-inset-top)) var(--gut) 10px;border-bottom:1px solid var(--hair)}
  .top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
  .today{margin:2px 0 0;font-size:13px;color:var(--sub)}
  .today small{font-size:13px;color:var(--sub)}
  .today small{display:block;margin-top:1px}
  .hdr-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:var(--card);
    border:1px solid var(--hair);font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
  .hdr-btn:active{background:var(--fill-press)}

  main{max-width:600px;margin:0 auto;padding:4px var(--gut) 24px}
  .sec{margin:22px 4px 8px;font-size:13px;font-weight:500;color:var(--sub);display:flex;align-items:baseline;gap:6px}
  .sec span{font-weight:400}
  .card{background:var(--card);border-radius:var(--r);padding:0 14px}

  /* 行內列 */
  .line{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-top:1px solid var(--hair)}
  .card > .line:first-child,.card > .block:first-child + .line,.card > :first-child{border-top:none}
  .block{padding:12px 0;border-top:1px solid var(--hair)}
  .lbl{flex:none;width:52px;font-size:15px;color:var(--sub)}
  .line input[type=text],.line input[type=number],.line input[type=time]{flex:1;min-width:0;height:44px;border:none;background:transparent;
    font-size:16px;padding:0;outline:none;border-radius:0}
  .line input[type=time]{text-align:left;display:flex;align-items:center}
  input::placeholder,textarea::placeholder{color:#B9B3AC}
  textarea{flex:1;min-width:0;border:none;background:transparent;font-size:16px;padding:12px 0;resize:none;outline:none;line-height:1.45}
  .line.memo{align-items:flex-start}
  .line.memo .lbl{padding-top:12px}
  .err{color:var(--red);font-size:13px;padding:0 0 10px 64px;display:none}
  .owe{flex:none;font-size:14px;color:var(--sub)}

  .field-btn{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:16px}
  .field-btn .ic{color:#B9B3AC}
  .date-field.empty #dateLabel{color:#B9B3AC}
  #dateLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 橫向選擇按鈕 */
  .seg{display:flex;gap:4px;padding:3px;background:var(--fill);border-radius:12px;flex:1;min-width:0}
  .seg button{flex:1;min-width:0;min-height:42px;border-radius:9px;font-size:15px;color:var(--ink);white-space:nowrap;
    transition:background .12s,transform .08s}
  .seg button:active{transform:scale(.96);background:var(--fill-press)}
  .seg button.on{background:var(--soy);color:#fff}
  .seg button.on:active{background:var(--soy-press)}
  .seg.small{flex:none;width:136px}
  .chips{display:flex;gap:6px;padding:0 0 12px 64px}
  .chips button{flex:1;min-width:0;min-height:36px;padding:0 6px;border-radius:18px;background:var(--fill);font-size:13px;white-space:nowrap}
  .chips button:active{background:var(--fill-press)}
  .chips button.on{background:var(--soy);color:#fff}

  /* 品項（行內） */
  .it{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-top:1px solid var(--hair)}
  .card > .it:first-child,.card > .grp:first-child{border-top:none}
  .grp{border-top:1px solid var(--hair);padding-top:12px}
  .grp-name{font-size:16px;font-weight:500}
  .grp .it{border-top:none;min-height:56px;padding:4px 0 4px 12px}
  .grp .it + .it{border-top:1px dashed var(--hair)}
  .grp .it-sub{margin-top:0;font-size:15px}
  .grp .it-sub .spec{color:var(--ink);min-width:44px}
  .it-main{flex:1;min-width:0}
  .it-name{font-size:16px;font-weight:500;line-height:1.3}
  .it-sub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-top:4px;font-size:13px;color:var(--sub)}
  .pin{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px;background:var(--fill);border-radius:8px;color:var(--sub)}
  .pin input{width:58px;height:32px;border:none;background:transparent;font-size:16px;color:var(--ink);padding:0;outline:none;text-align:left}
  .pin:focus-within{background:var(--soy-tint);color:var(--soy)}
  .wtag{color:var(--gold)}

  .stepper{flex:none;display:flex;align-items:center;gap:2px}
  .stepper button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fill);
    color:var(--ink);transition:background .12s,transform .08s}
  .stepper button .ic{width:18px;height:18px;stroke-width:2.2}
  .stepper button:active{transform:scale(.9);background:var(--fill-press)}
  .stepper button[data-d="1"]{background:var(--soy-tint);color:var(--soy)}
  .stepper button[data-d="1"]:active{background:var(--soy);color:#fff}
  .stepper .q{min-width:28px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums;color:#C4BEB7}
  .stepper.on .q{color:var(--ink);font-weight:600}
  .stepper:not(.on) button[data-d="-1"]{color:#C4BEB7}
  .want{flex:none;min-width:72px;min-height:44px;border-radius:22px;background:var(--fill);font-size:15px;transition:background .12s,transform .08s}
  .want:active{transform:scale(.94);background:var(--fill-press)}
  .want.on{background:var(--soy);color:#fff}
  .want::after{content:"要"}
  .want.on::after{content:"已選"}

  /* 底部訂單列 */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--hair);padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom))}
  .bar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .sum{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
  .sum-l{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  body.typing .bar{display:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;
    background:var(--soy);color:#fff;font-size:16px;font-weight:500;white-space:nowrap;transition:background .12s,transform .08s}
  .btn:active{transform:scale(.97);background:var(--soy-press)}
  .btn:disabled{opacity:.55}
  .btn.ghost{background:var(--fill);color:var(--ink)}
  .btn.ghost:active{background:var(--fill-press)}
  .btn.small{min-height:44px;padding:0 12px;font-size:15px;border-radius:10px}
  .btn.share{background:var(--soy);color:#fff}
  .bar-btns{display:flex;gap:8px;flex:none}
  .bar .btn{min-width:0;padding:0 16px}

  /* 底部彈窗 */
  .modal{position:fixed;inset:0;background:rgba(30,26,23,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.show{display:flex}
  .sheet{position:relative;background:var(--paper);width:100%;max-width:600px;max-height:90vh;max-height:90dvh;overflow:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:18px 18px 0 0;
    padding:26px var(--gut) calc(20px + env(safe-area-inset-bottom))}
  .sheet::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#D8D4CE}
  .sheet h3{margin:0 0 14px;font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px}
  .sheet h3 .ic{width:22px;height:22px;color:var(--soy)}
  .rows{background:var(--card);border-radius:var(--r);padding:0 14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--hair);font-size:15px}
  .rows .row:first-child{border-top:none}
  .row span:first-child{color:var(--sub);flex:none}
  .row span:last-child{text-align:right;min-width:0}
  .rows.items .row span:first-child{color:var(--ink);flex:1}
  .total{font-size:17px;font-weight:600}
  .total span:first-child{color:var(--ink)!important}
  .actions{display:flex;gap:10px;margin-top:12px}
  .actions .btn{flex:1;min-width:0}
  .note{font-size:13px;color:var(--sub);margin:0 0 12px}

  .order{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .order.pending{box-shadow:inset 3px 0 0 var(--gold)}
  .pend-tag{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);margin-bottom:8px}
  .pend-tag .ic{width:16px;height:16px}
  .order-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .order-btns .weigh-btn{grid-column:1 / -1;background:var(--gold-soft);color:var(--gold)}
  .order-btns .weigh-btn:active{background:#EFE3C8}
  .order-btns .btn{min-width:0}
  .preview{white-space:pre-wrap;word-break:break-word;background:var(--card);border-radius:var(--r);padding:14px;font-family:inherit;
    font-size:15px;line-height:1.7;margin:0 0 12px;user-select:text;-webkit-user-select:text}
  .order .preview{background:var(--paper);border-radius:10px;padding:12px}

  .share-actions{display:flex;gap:10px;margin-top:4px}
  .share-actions .btn{flex:1;min-width:0;padding:0 12px}
  @media (max-width:380px){ .share-actions{flex-direction:column} }
  @media (max-width:340px){ .order-btns{grid-template-columns:1fr} .seg.small{width:120px} .pin input{width:46px} .grp .it-sub .spec{min-width:0} .grp .it{padding-left:6px} }

  .toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;z-index:20;
    background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.5;text-align:center;
    opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .toast.err{background:var(--red)}

  /* 日曆 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-size:18px;font-weight:600}
  .cal-head button{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:22px;color:var(--ink)}
  .cal-head button:active{background:var(--fill-press)}
  .cal-head button:disabled{opacity:.3}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wk{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
  .cal-wk:first-child,.cal-wk:last-child{color:var(--red)}
  .cal-d{min-height:56px;border:1.5px solid transparent;border-radius:10px;background:var(--card);padding:5px 1px;display:flex;flex-direction:column;
    align-items:center;gap:1px;transition:transform .08s}
  .cal-d:active{transform:scale(.94)}
  .cal-d .n{font-size:16px;font-weight:500;line-height:1.2}
  .cal-d .l{font-size:10px;color:var(--sub);line-height:1.2}
  .cal-d .h{font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;max-width:100%}
  .cal-d.hol{background:var(--red-soft)}
  .cal-d.hol .n,.cal-d.hol .h{color:var(--red)}
  .cal-d.wor{background:var(--gold-soft)}
  .cal-d.wor .h{color:var(--gold)}
  .cal-d.today{border-color:var(--ink)}
  .cal-d.sel{background:var(--soy);border-color:var(--soy)}
  .cal-d.sel .n,.cal-d.sel .l,.cal-d.sel .h{color:#fff}
  .cal-d:disabled{opacity:.3}
  .cal-legend{display:flex;gap:16px;font-size:12px;color:var(--sub);margin-top:12px;flex-wrap:wrap}
  .cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* 姓氏＋稱謂 */
  #surname{flex:1;min-width:0}
  #titleSeg{width:128px}
  /* 對話框 */
  .dlg{position:fixed;inset:0;z-index:30;background:rgba(30,26,23,.45);display:none;align-items:center;justify-content:center;padding:20px}
  .dlg.show{display:flex}
  .dlg-box{background:var(--card);border-radius:16px;width:100%;max-width:340px;padding:20px}
  .dlg-box h4{margin:0 0 8px;font-size:18px;font-weight:600}
  .dlg-box p{margin:0 0 14px;font-size:15px;color:var(--sub);line-height:1.55}
  .dlg-btns{display:flex;gap:10px;margin-top:6px}
  .dlg-btns .btn{flex:1;min-width:0;padding:0 10px}
  .pin-in{width:100%;height:48px;border:none;border-radius:10px;background:var(--fill);font-size:20px;letter-spacing:.3em;text-align:center;margin-bottom:10px;outline:none}
  .pin-in:focus{background:var(--soy-tint)}
  .ln-code{font-size:34px;font-weight:700;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums;padding:10px 0 4px;color:var(--ink)}
  .btn.line{background:#06C755;color:#fff}
  .btn.line:active{background:#05A847}
  .dlg-err{color:var(--red);font-size:13px;min-height:18px;margin:-4px 0 6px}
  .btn.danger{background:var(--red);color:#fff}
  .btn.danger:active{background:#8F1E18}
  .link-btn{min-height:44px;padding:0 4px;font-size:14px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
  .link-btn.danger{color:var(--red)}
  .link-btn:active{opacity:.6}
  /* 電話保護 */
  .phone-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 10px;font-size:13px;color:var(--sub)}
  .phone-opt .warn{color:var(--red)}
  .order-tools{display:flex;justify-content:space-between;gap:4px;margin-top:4px}
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .list-head h3{margin:0}
  .privacy{font-size:12px;color:var(--sub);margin:0 0 12px}
  .prep-open{width:100%;margin-bottom:8px}
  .hdr-right{display:flex;align-items:center;gap:6px;flex:none}
  [hidden]{display:none!important}
  .sync-pill{min-height:40px;padding:0 10px;border-radius:20px;font-size:12px;color:var(--sub);background:transparent;display:inline-flex;align-items:center;gap:5px}
  .sync-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:#5B9A68}
  .sync-pill.busy::before{background:var(--gold)}
  .sync-pill.off::before,.sync-pill.err::before{background:var(--red)}
  .sync-box{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;color:var(--sub);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sync-box b{color:var(--ink);font-weight:500}
  .sync-box.cta{display:block}
  .sync-box.cta .btn{width:100%;margin-top:10px}
  .pw-in{width:100%;height:48px;border:none;border-radius:10px;background:var(--fill);font-size:17px;padding:0 14px;margin-bottom:10px;outline:none}
  .pw-in:focus{background:var(--soy-tint)}
  .sync-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .sync-btns .btn{min-width:0}
  .sync-btns .btn:only-child{grid-column:1 / -1}
  .code-in{width:100%;min-height:110px;border:none;border-radius:12px;background:var(--card);padding:12px;font-size:14px;font-family:ui-monospace,Menlo,monospace;
    word-break:break-all;resize:vertical;outline:none;margin-bottom:10px}
  .code-in:focus{box-shadow:0 0 0 2px var(--soy-tint)}
  .sheet .pin-in{background:var(--card)}
  .file-btn{position:relative;overflow:hidden}
  .file-btn input{position:absolute;inset:0;opacity:0;font-size:16px}
  @media (max-width:340px){ .sync-btns{grid-template-columns:1fr} }
  .day-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:var(--r);padding:4px;margin-bottom:10px}
  .day-nav button{width:44px;height:44px;border-radius:12px;font-size:22px}
  .day-nav button:active{background:var(--fill-press)}
  .day-nav b{font-size:17px;font-weight:600;text-align:center}
  .day-nav b small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
  .prep-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .prep-stats div{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center}
  .prep-stats b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .prep-stats span{font-size:12px;color:var(--sub)}
  .prep-cat{font-size:13px;color:var(--sub);margin:14px 4px 6px}
  .prep-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--hair)}
  .rows .prep-row:first-child{border-top:none}
  .prep-row .nm{font-size:16px;font-weight:500}
  .prep-row .det{font-size:13px;color:var(--sub);margin-top:2px}
  .prep-row .tot{flex:none;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .prep-row .tot small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }

  /* 剩貨頁：深綠配色（和訂購頁的酒紅區分） */
  :root{ --paper:#F2F5F3; --hair:#E2E8E4; --fill:#ECF0ED; --fill-press:#DDE5E0;
    --soy:#2F5D50; --soy-press:#234840; --soy-tint:#E3EEE9; }
  .qbox{flex:none;display:flex;align-items:center;gap:2px}
  .qbox button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fill);color:var(--ink)}
  .qbox button .ic{stroke-width:2.2}
  .qbox button:active{transform:scale(.9);background:var(--fill-press)}
  .qbox button[data-d="1"]{background:var(--soy-tint);color:var(--soy)}
  .qbox{gap:6px}
  .qbox input{width:72px;height:44px;border:none;border-radius:10px;background:var(--fill);text-align:center;font-size:18px;font-variant-numeric:tabular-nums;color:var(--ink);outline:none;padding:0}
  .qbox input::placeholder{color:#B9B3AC}
  .qbox input:focus{background:var(--soy-tint);box-shadow:0 0 0 2px var(--soy)}

  .hist:active{background:var(--fill)}

  .ctx{max-width:600px;margin:6px auto 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--sub)}

  .net-bar{margin:6px -16px -10px;padding:8px 16px;background:#FBF1DE;color:#8A5A00;font-size:14px;text-align:center}
  .state{padding:10px 12px;border-radius:12px;font-size:15px;margin:0 0 12px;line-height:1.5}
  .state.warn{background:#FBF1DE;color:#8A5A00}
  @media (max-width:430px){ .sync-pill{font-size:0;gap:0;padding:0 12px} }
  /* 分頁：固定在頂部、頁籤樣式（和市場按鈕區分） */
  .tabs{max-width:600px;margin:8px auto -10px;display:grid;grid-template-columns:1fr 1fr}
  .tabs button{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;color:var(--sub);
    border-bottom:3px solid transparent;font-weight:500}

    display:inline-flex;align-items:center;justify-content:center}

  /* 對齊：每列一行、同樣高度 */
  .it.one{min-height:56px;padding:4px 0}

  .mk-warn{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:#FBF1DE;color:#8A5A00;font-size:15px;font-weight:500;text-align:center}

  .wbox{flex:none;display:flex;align-items:center;gap:6px}

  .wbox input:focus{background:var(--soy-tint)}

  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:var(--r);padding:4px;margin:12px 0 10px}
  .datebar button{width:44px;height:44px;border-radius:12px;font-size:22px}

  .note-in{width:100%;min-height:64px;border:none;background:transparent;font-size:16px;padding:12px 0;resize:none;outline:none}
</style>

<body>

<header class="top">
  <div class="top-in">
    <div><h1>剩貨紀錄</h1><p class="today" id="todayLine"></p></div>
    <div class="hdr-right"><button type="button" class="sync-pill" id="syncPill" hidden></button>
      <button type="button" class="hdr-btn" id="histBtn">紀錄</button>
      <a class="hdr-btn" href="./">訂購頁</a></div>
  </div>
  <div class="ctx" id="ctx"></div>
  <div class="tabs" id="tabSeg" role="tablist">
    <button type="button" data-tab="left" role="tab">剩貨<span class="tab-n" id="tabLeftN"></span></button>
    <button type="button" data-tab="bring" role="tab">要帶的備品<span class="tab-n" id="tabBringN"></span></button>
  </div>
  <div class="net-bar" id="netBar" hidden>目前離線：可以繼續記，先存在這支手機，有網路後自動同步</div>
</header>

<main>
  <div class="datebar"><button type="button" id="dPrev" aria-label="前一天">‹</button><b id="dLabel"></b><button type="button" id="dNext" aria-label="後一天">›</button></div>
  <div class="seg" id="mkSeg">
    <button type="button" data-m="ba">爸爸市場</button>
    <button type="button" data-m="ma">媽媽市場</button>
  </div>
  <div class="mk-warn" id="mkWarn">請先選擇市場，再開始填寫</div>
  <div class="mk-warn cf-warn" id="cfWarn" hidden></div>
  <div id="list"></div>
  <h2 class="sec">備註</h2>
  <section class="card"><textarea class="note-in" id="note" rows="2" placeholder="其他要交代的"></textarea></section>
  <div class="actions"><button type="button" class="btn ghost" id="clearDay">重新填寫</button></div>
</main>

<div class="bar"><div class="bar-in">
  <div class="sum"><span class="sum-l"><span class="mk-tag" id="mkTag">未選市場</span>・<span id="saveState">已自動儲存</span></span><b><span id="cnt">0</span> 項有剩<small id="bring"></small></b></div>
  <div class="bar-btns"><button type="button" class="btn ghost" id="shareBtn">分享</button><button type="button" class="btn line" id="lineBtn">傳到群組</button></div>
</div></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dlg" id="dlg"><div class="dlg-box" id="dlgBox" role="dialog" aria-modal="true"></div></div>

<script src="shared.js?v=5"></script>
<script src="core.js?v=8"></script>
<script>
/* core.js 是訂購頁和剩貨頁共用的程式，沒有載入就停止，避免動到資料 */
if (typeof MENU === "undefined" || typeof CORE_VERSION === "undefined" || CORE_VERSION < 5) {
  document.body.insertAdjacentHTML("afterbegin", '<p style="margin:0;padding:14px 16px;background:#B3261E;color:#fff;font-size:15px">程式檔 shared.js 或 core.js 沒有載入或版本太舊。請把 shared.js、core.js 和這個頁面放在同一個資料夾，然後重新整理。</p>');
  throw new Error("core.js missing");
}


/* 備品（單位可以改這裡） */
const SUPPLIES = [
  ["兩斤袋子", "包"], ["一斤袋子", "包"], ["兩斤透明袋", "包"], ["半斤透明袋", "包"], ["四兩提袋", "包"], ["半斤提袋", "包"],
  ["胡椒", "包"], ["香油", "罐"], ["辣粉", "包"], ["便當盒", "個"], ["橡皮筋", "包"], ["牙籤", "盒"],
];
const MKT = { ba: "爸爸市場", ma: "媽媽市場" };
const WEIGH_UNIT = "斤";
/* 用選的品項：[數值, 文字]，再按一次取消 */
const LV_SMALL = [[2, "很多"], [1, "一點"]];
const LEVEL_ITEMS = { "鴨腸": LV_SMALL, "口香糖": LV_SMALL, "大腸": LV_SMALL, "海帶": LV_SMALL, "豆乾": LV_SMALL, "滷味|鴨胗": LV_SMALL };   // 「類別|品名」只改那一類（煙燻鴨胗還是打數字）
/* 用袋子算的品項：每種袋子分開打幾個 */
const BAG_PARTS = ["一包", "半包", "一斤手提", "兩斤手提", "兩斤透明"];
const BAG_ITEMS = { "雞腳": BAG_PARTS, "鴨翅": BAG_PARTS, "雞屁股": BAG_PARTS, "鴨腳": BAG_PARTS };
const COUNT_PARTS = { "豬頭皮": ["塊", "條", "件"], "米血": ["包", "片"] };   // 分開記幾塊、幾條、幾件

/* 要記的格子：key 用「品名|規格」，以後調整菜單也不會亂掉 */
const ROWS = [];
const byLen = arr => sortNames(arr, x => x.name).map(x => x[0]);
MENU.forEach(sec => byLen(sec.items).forEach(it => {
  const lvl = LEVEL_ITEMS[`${sec.cat}|${it.name}`] || LEVEL_ITEMS[it.name];
  if (lvl) ROWS.push({ cat: sec.cat, grp: it.name, key: `${it.name}|量`, name: it.name, kind: "lvl", unit: "", levels: lvl });
  else if (BAG_ITEMS[it.name]) BAG_ITEMS[it.name].forEach(b => ROWS.push({ cat: sec.cat, grp: it.name, multi: true, key: `${it.name}|袋|${b}`, name: it.name, spec: b, kind: "n", unit: "" }));
  else if (COUNT_PARTS[it.name]) COUNT_PARTS[it.name].forEach(u => ROWS.push({ cat: sec.cat, grp: it.name, multi: true, cnt: true, key: `${it.name}|${u}`, name: it.name, spec: u, kind: "n", unit: u }));
  else if (it.type === "amount") ROWS.push({ cat: sec.cat, grp: it.name, key: `${it.name}|`, name: it.name, kind: "w", unit: WEIGH_UNIT });
  else if (it.type === "piece") ROWS.push({ cat: sec.cat, grp: it.name, key: `${it.name}|塊`, name: it.name, kind: "n", unit: "塊" });
  else it.opts.forEach(o => {
    const m = o.label.match(/^一(.)(?:（(.+)）)?/);
    ROWS.push({ cat: sec.cat, grp: it.name, multi: it.opts.length > 1, key: `${it.name}|${o.label}`, name: it.name, spec: o.label,
      kind: "n", unit: it.opts.length > 1 ? "" : (m ? m[1] : "") });
  });
}));
byLen(SUPPLIES.map(([n, u]) => ({ name: n, u }))).map(x => [x.name, x.u]).forEach(([n, u]) => ROWS.push({ cat: "備品", grp: n, key: `備品|${n}`, name: n, kind: "n", unit: u, bring: true }));
const CAT_LABEL = { "備品": "要帶的備品" };   // 備品是要帶去攤位的，不是剩貨
const catLabel = c => CAT_LABEL[c] || c;

/* ===== 畫面 ===== */
function render(){
  let html = "", cat = "", grp = null;
  const close = () => { if (grp) { html += "</div>"; grp = null; } };
  ROWS.forEach((r, i) => {
    if (r.cat !== cat) {
      close(); if (cat) html += "</section>"; cat = r.cat;
      const shut = folded().includes(cat);
      html += `<button type="button" class="sec-t${shut ? " shut" : ""}" data-cat="${escapeHtml(cat)}" aria-expanded="${!shut}">
        <span>${escapeHtml(catLabel(cat))}</span><span class="sec-n" data-n="${escapeHtml(cat)}"></span>
        <svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <section class="card${shut ? " folded" : ""}" data-card="${escapeHtml(cat)}">`;
    }
    const first = r.multi && grp !== r.grp;
    if (r.multi) { if (first) { close(); grp = r.grp; html += `<div class="grp g1">`; } }
    else close();
    const ctrl = r.kind === "lvl"
      ? `<div class="seg small lvl${r.levels.length > 2 ? " l3" : ""}" id="b${i}">${r.levels.map(([v, t]) => `<button type="button" data-i="${i}" data-lv="${v}">${t}</button>`).join("")}</div>`
      : r.kind === "w"
      ? `<div class="wbox" id="b${i}"><input type="number" inputmode="decimal" step="0.1" min="0" data-i="${i}" placeholder="0" aria-label="${escapeHtml(r.name)}剩幾斤"><span class="unit">${r.unit}</span></div>`
      : `<div class="qbox" id="b${i}"><input type="number" inputmode="numeric" pattern="[0-9]*" min="0" data-i="${i}" placeholder="0"
          aria-label="${escapeHtml(r.name + (r.spec || ""))}${r.bring ? "要帶幾" : "剩幾"}${r.unit}"><span class="unit">${r.unit}</span></div>`;
    // 一行：品名｜份量（固定兩欄，和訂購頁一樣對齊）
    const spec = r.bring ? `要帶幾${r.unit}` : r.multi ? (r.cnt ? "幾" : "") + r.spec : r.kind === "w" ? "秤重" : r.kind === "lvl" ? "" : (r.spec || "").replace(/（.*?）/, "");
    html += `<div class="it one${r.multi && !first ? " sub" : ""}"><div class="it-main"><span class="it-name">${r.multi && !first ? "" : escapeHtml(r.name)}</span>
      <span class="spec-s">${escapeHtml(spec)}</span></div>${ctrl}</div>`;
  });
  close(); html += "</section>";
  $("list").innerHTML = html;
  applyTab();
}

/* ===== 分頁：剩貨／要帶的備品 ===== */
let tab = (() => { try { return localStorage.getItem("stockTab") === "bring" ? "bring" : "left"; } catch (e) { return "left"; } })();
function applyTab(){
  document.querySelectorAll("#tabSeg button").forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
  document.querySelectorAll("#list .sec-t, #list [data-card]").forEach(el => {
    const isBring = (el.dataset.cat || el.dataset.card) === "備品";
    el.hidden = tab === "bring" ? !isBring : isBring;
  });
}
$("tabSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  tab = b.dataset.tab; try { localStorage.setItem("stockTab", tab); } catch (x) {}
  applyTab(); window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ===== 收合（記在這支手機） ===== */
function folded(){ try { return JSON.parse(localStorage.getItem("stockFold") || "[]"); } catch (e) { return []; } }
/* 還沒選市場：先跳出來問，選完才能填 */
function askMarket(){
  return new Promise(res => {
    $("dlgBox").innerHTML = `<h4>這是哪個市場的？</h4><p>選好市場再填，才不會記到別的市場。</p>
      <div class="mk-pick">${Object.entries(MKT).map(([k, v]) => `<button type="button" class="btn" data-pick="${k}">${v}</button>`).join("")}</div>
      <div class="dlg-btns" style="margin-top:10px"><button type="button" class="btn ghost" data-no>取消</button></div>`;
    $("dlg").classList.add("show");
    $("dlgBox").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { closeDlg(); setMarket(b.dataset.pick); res(true); });
    $("dlgBox").querySelector("[data-no]").onclick = () => { closeDlg(); res(false); };
  });
}
function setMarket(m){ if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); mk = m; fill(); Sync.run(); toast(`現在記的是：${MKT[m]}`); }
async function needMarket(e){
  if (mk) return true;
  if (e) { e.preventDefault(); e.stopImmediatePropagation(); if (e.target.blur) e.target.blur(); }
  await askMarket();
  return false;
}
["pointerdown", "focusin"].forEach(ev => $("list").addEventListener(ev, e => {
  if (!mk && e.target.closest("input,button[data-lv]")) needMarket(e);
}, true));
$("note").addEventListener("focusin", e => { if (!mk) needMarket(e); }, true);

$("list").addEventListener("click", e => {
  const h = e.target.closest(".sec-t"); if (!h) return;
  const cat = h.dataset.cat, f = new Set(folded()), shut = !f.has(cat);
  shut ? f.add(cat) : f.delete(cat);
  try { localStorage.setItem("stockFold", JSON.stringify([...f])); } catch (x) {}
  h.classList.toggle("shut", shut); h.setAttribute("aria-expanded", !shut);
  document.querySelector(`[data-card="${CSS.escape(cat)}"]`).classList.toggle("folded", shut);
});

/* ===== 資料（每天＋市場一筆） =====
   每個品項各自記修改時間（t），兩支手機改不同品項時都會保留；刪除只是標記（del），30 天內可以復原。 */
const LOCAL = "stockData";
const ID_RE = /^inv_(\d{4}-\d{2}-\d{2})_(ba|ma)$/;
let date = ymd(new Date()), mk = "";   // 每次打開都要自己選市場，避免記錯
const docId = (d, m) => `inv_${d}_${m}`;
function all(){ try { return JSON.parse(localStorage.getItem(LOCAL) || "{}"); } catch (e) { return {}; } }
function saveAll(a){ localStorage.setItem(LOCAL, JSON.stringify(a)); }
const EMPTY = () => ({ v: {}, note: "", upd: 0 });
function cur(){ const r = all()[docId(date, mk)]; return r && !r.del ? r : EMPTY(); }
function clean(v, kind){ const n = Number(v); if (!Number.isFinite(n) || n <= 0) return 0; return kind === "w" ? Math.round(n * 10) / 10 : Math.min(Math.round(n), 99999); }
/* 取出要修改的紀錄：記下共同的上一版（衝突合併用）；已刪除的就當作清空後重新開始 */
function editRec(a, id){
  const rec = a[id] || { v: {}, note: "", upd: 0 };
  markStockEdit(rec, true);
  if (rec.del) { rec.v = {}; rec.note = ""; rec.del = 0; }
  rec.v = rec.v || {};
  a[id] = rec;
  return rec;
}

function fill(){
  const rec = cur();
  ROWS.forEach((r, i) => {
    const v = rec.v[r.key] || 0, inp = document.querySelector(`input[data-i="${i}"]`);
    if (r.kind === "lvl") document.querySelectorAll(`button[data-i="${i}"][data-lv]`).forEach(b => b.classList.toggle("on", Number(b.dataset.lv) === v));
    else if (document.activeElement !== inp) inp.value = v ? v : "";
    $("b" + i).classList.toggle("on", v > 0);
  });
  if (document.activeElement !== $("note")) $("note").value = rec.note || "";
  paintCounts(rec);
  const isToday = date === ymd(new Date());
  $("dLabel").innerHTML = `${fmtDate(date)}<small>${isToday ? "今天" : ""}${rec.upd ? (isToday ? "・" : "") + "最後更新 " + hm(rec.upd) : ""}</small>`;
  document.querySelectorAll("#mkSeg button").forEach(b => b.classList.toggle("on", b.dataset.m === mk));
  $("mkWarn").hidden = !!mk; $("mkSeg").classList.toggle("need", !mk);
  $("mkTag").textContent = mk ? MKT[mk] : "未選市場"; $("mkTag").classList.toggle("none", !mk);
  paintCtx();
  $("clearDay").textContent = "重新填寫";
  paintConflict(mk ? all()[docId(date, mk)] : null);
}
/* 兩支手機同時改了同一個品項：顯示兩邊的數字，讓使用者選 */
const keyName = k => { const r = ROWS.find(x => x.key === k); return r ? r.grp + (r.multi ? "（" + r.spec + "）" : "") : k.split("|")[0]; };
const valText = (k, v) => { const r = ROWS.find(x => x.key === k); if (!v) return "沒有"; if (r && r.kind === "lvl") return (r.levels.find(x => x[0] === v) || [])[1] || String(v); return String(v) + (r && r.unit ? " " + r.unit : ""); };
function paintConflict(rec){
  const box = $("cfWarn"), cf = rec && !rec.del && rec.cf;
  if (!cf || (!(cf.items || []).length && !cf.note)) { box.hidden = true; box.innerHTML = ""; return; }
  const who = escapeHtml(cf.dev || "另一支手機");
  const parts = (cf.items || []).map(x => `${escapeHtml(keyName(x.k))}：目前 ${escapeHtml(valText(x.k, x.theirs))}；${who} 改的是 ${escapeHtml(valText(x.k, x.mine))}`);
  if (cf.note) parts.push(`備註：${who} 改的是「${escapeHtml(cf.note.mine)}」`);

function resolveConflict(useOther){

}

/* 有規格的數量：「一隻」2 → 「2 隻」；「半隻」1 → 「半隻」；「半隻」2 → 「2 個半隻」
   同一品項的不同規格用「＋」接起來：雞肉　1 隻＋半隻 */
function specCount(spec, v){
  const m = String(spec).match(/^一(.)$/);
  return m ? `${v} ${m[1]}` : Number(v) === 1 ? spec : `${v} 個${spec}`;
}
/* 分享（只列有剩的）：和訂單長得不一樣，掃一眼就分得出來
   剩貨＝短清單「・雞肉 1 隻＋半隻」，分類用〔煙燻〕；要帶＝打勾清單「☐ 便當盒 2 個」（不用 emoji，每支手機看起來都一樣） */
const SHARE_HEAD = { "備品": "要帶" };
const shareHead = c => `〔${SHARE_HEAD[c] || catLabel(c)}〕`;
function stockText(rec = cur(), d0 = date, m0 = mk){
  const d = fmtDate(d0).replace("(", "（").replace(")", "）");
  let t = "", cat = "";
  const groups = [];
  ROWS.forEach(r => {
    const v = rec.v[r.key]; if (!v) return;
    let g = groups.find(x => x.cat === r.cat && x.grp === r.grp);
    if (!g) { g = { cat: r.cat, grp: r.grp, parts: [] }; groups.push(g); }
    g.parts.push(r.kind === "lvl" ? ((r.levels.find(x => x[0] === v) || [])[1] || v) : r.cnt ? `${v} ${r.unit}` : r.multi ? specCount(r.spec, v) : `${v}${r.unit ? " " + r.unit : ""}`);
  });
  // 標題照內容寫：只有備品就是【要帶】，不要和剩貨搞混
  const hasStock = groups.some(g => g.cat !== "備品"), hasBring = groups.some(g => g.cat === "備品");
  t = `▍${hasStock && hasBring ? "剩貨・要帶" : hasBring ? "要帶" : "剩貨"}　${d} ${MKT[m0]}\n`;
  if (!groups.length) t += "\n（沒有剩貨紀錄）";
  groups.forEach(g => {
    const bring = g.cat === "備品";
    if (g.cat !== cat) { cat = g.cat; t += "\n" + (bring && !hasStock ? "" : shareHead(cat) + "\n"); }
    t += `${bring ? "☐ " : "・"}${g.grp} ${g.parts.join("＋")}\n`;
  });
  if (rec.note) t += `\n※ ${rec.note}`;
  return t.trim();
}
/* LINE 卡片版：剩貨＝黃色標題的數量清單；只有備品＝藍色「要帶」打勾清單；兩種都有就同一張，下面接藍色「要帶」 */
function stockCard(rec = cur(), d0 = date, m0 = mk){
  const K = LineCard, C = K.C, d = fmtDate(d0).replace("(", "（").replace(")", "）");
  const groups = [];
  ROWS.forEach(r => {
    const v = rec.v[r.key]; if (!v) return;
    let g = groups.find(x => x.cat === r.cat && x.grp === r.grp);
    if (!g) { g = { cat: r.cat, grp: r.grp, parts: [], lv: null }; groups.push(g); }
    if (r.kind === "lvl") g.lv = v;
    g.parts.push(r.kind === "lvl" ? ((r.levels.find(x => x[0] === v) || [])[1] || v) : r.cnt ? `${v} ${r.unit}` : r.multi ? specCount(r.spec, v) : `${v}${r.unit ? " " + r.unit : ""}`);
  });
  const stock = groups.filter(g => g.cat !== "備品"), bring = groups.filter(g => g.cat === "備品");
  const body = [];
  let cat = "";
  stock.forEach(g => {
    if (g.cat !== cat) { if (cat) body.push(K.sep()); cat = g.cat; body.push(K.label(g.cat)); }
    body.push(K.row(g.grp, g.parts.join("＋"), { rw: true, rc: g.lv === 2 ? C.gold : g.lv === 1 ? C.sub : C.ink }));
  });
  if (bring.length) {
    if (stock.length) { body.push(K.sep()); body.push(K.label("要帶（出門前帶齊）", C.blue)); }
    bring.forEach(g => body.push(K.row("☐  " + g.grp, g.parts.join("＋"), { size: "lg", rw: true, margin: "md" })));
  }
  if (!groups.length) body.push(K.t("（沒有剩貨紀錄）", { color: C.sub, margin: "md" }));
  if (rec.note) { body.push(K.sep()); body.push(K.t("※ " + rec.note, { size: "sm", margin: "md" })); }
  const onlyBring = bring.length && !stock.length;
  const band = onlyBring ? K.band("b", "要帶", d, `${MKT[m0]}・出門前帶齊`)
    : K.band("s", stock.length && bring.length ? "剩貨＋要帶" : "剩貨", d, `${MKT[m0]}・收攤剩下的`);
  return { alt: `${onlyBring ? "要帶" : "剩貨"}｜${d} ${MKT[m0]}`, contents: K.bubble(band, body) };
}

}

        `<button type="button" class="link-btn" data-rev="${i}">還原</button>`)).join("")}</div>` : `<p class="note">這天還沒有歷史版本。</p>`) : `<p class="note">目前無法讀取歷史版本。</p>`}` : ""}
    ${on ? `<p class="prep-cat">雲端每日備份（保留 90 天，任何手機都不能修改或刪除）</p>
      ${clouds ? (clouds.length ? `<div class="rows">${clouds.slice(0, 7).map(c => row(`${when(c.ts)}・${escapeHtml(c.dev || "")}<br><small class="stat">共 ${c.nd} 筆資料</small>`,
        `<button type="button" class="link-btn" data-cloud="${escapeHtml(c.set)}">復原</button>`)).join("")}</div>` : `<p class="note">還沒有雲端備份，同步後會自動建立。</p>`) : `<p class="note">目前無法讀取雲端備份。</p>`}` : ""}
    <p class="prep-cat">這支手機的自動備份</p>
    ${snaps.length ? `<div class="rows">${snaps.slice(0, 6).map(s => row(`${when(s.at)}・${Backup.label(s.kind)}<br><small class="stat">剩貨 ${s.nStock || 0} 筆・訂單 ${s.nOrders || 0} 筆</small>`,
      `<button type="button" class="link-btn" data-snap="${escapeHtml(s.key)}">復原</button>`)).join("")}</div>` : `<p class="note">還沒有自動備份。</p>`}
    <div class="actions"><button type="button" class="btn ghost" id="bkBack">回剩貨紀錄</button></div>`;
  $("bkBack").onclick = () => showHistory();
  $("bkExport").onclick = async () => {
    try { if (await Backup.exportFile()) toast("已匯出加密備份檔，請存到安全的地方"); }
    catch (e) { toast(e.message === "nometa" ? "要先加入店家同步（設定店家密碼）才能匯出加密備份" : "匯出失敗，請再試一次", true); }
  };
  $("bkFile").onchange = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    let data; try { data = Backup.parse(await f.text()); } catch (x) { toast("這不是剩貨頁或訂購頁的備份檔", true); return; }
    await restoreStockBackup(data);
  };
  sheet.querySelectorAll("[data-snap]").forEach(b => b.onclick = async () => { const d = await Backup.get(b.dataset.snap); if (d) await restoreStockBackup(d); });
  sheet.querySelectorAll("[data-cloud]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "讀取中…";
    try { await restoreStockBackup(await Backup.fromCloud(Sync.cfg().room, b.dataset.cloud, await Sync.aes())); }
    catch (e) { toast("雲端備份讀取失敗，請確認網路", true); showBackup(); }
  });
  sheet.querySelectorAll("[data-rev]").forEach(b => b.onclick = async () => {
    const x = revs[b.dataset.rev];
    if (!(await askConfirm({ title: "還原這個版本？", ok: "還原", msg: `${fmtDate(date)} ${MKT[mk]} 改回 ${when(x.d.data.ts)} 的數字。目前的數字會保留在歷史版本。` }))) return;
    const a = all(), rec = editRec(a, id);
    rec.v = { ...x.r.v }; rec.note = x.r.note || ""; delete rec.cf; rec.upd = Date.now(); saveAll(a);
    fill(); Sync.run(); toast("已還原"); showBackup();
  });
}
async function restoreStockBackup(data){
  let map = data.stockPlain || null;
  if (!map && data.stock) {
    const keys = await askPassword({ title: "輸入備份的店家密碼", min: data.meta && data.meta.shared === false ? 4 : 8, ok: "復原",
      msg: `這份備份建立於 ${when(data.at)}。請輸入當時使用的店家密碼。`,
      check: async pw => (await Backup.keys(data.meta, pw)) || "密碼不正確" });
    if (!keys) return;
    try { map = await Backup.openStock(keys, data); } catch (e) { toast("備份無法解開", true); return; }
  }
  if (!map) { toast("這份備份沒有剩貨紀錄", true); return; }
  await Backup.snapshot("before-restore");
  const n = Backup.restoreStock(map, Sync.on());
  toast(n ? `已復原 ${n} 筆剩貨紀錄` : "備份裡的紀錄這支手機都已經有了");
  fill(); Sync.run(); showBackup();
}

$("clearDay").onclick = async () => {
  if (!mk) { await askMarket(); return; }
  if (!(await askConfirm({ title: `清除 ${fmtDate(date)} ${MKT[mk]} 的內容？`, ok: "清除", danger: true, msg: `只會清除 ${fmtDate(date)}「${MKT[mk]}」填的數字和備註。${MKT[mk === "ba" ? "ma" : "ba"]}和其他天都不受影響。` }))) return;
  await Backup.snapshot("before-clear");
  const a = all(), rec = editRec(a, docId(date, mk));
  rec.v = {}; rec.note = ""; rec.upd = Date.now(); saveAll(a); fill(); Sync.run();
};

/* ===== 同步（和訂購頁同一組店家密碼；資料加密後才上傳） =====
   金鑰存在 IndexedDB 而且不可匯出；第一次輸入店家密碼時在背景自動登記為店家裝置，之後不用再輸入。
   打開的手機每 6 秒檢查一次變動；同時修改時逐項三方比較，不看手機時間。 */
const NEED_TEXT = { join: "需要輸入一次店家密碼", retired: "店家密碼已更換，請輸入新的店家密碼", revoked: "這支手機的同步已被停用", nokey: "請再輸入一次店家密碼" };
const Sync = {
  busy: false, again: false, state: "", last: 0, key: null, cur: null, n: 0,
  cfg(){ return StockCfg.get(); },
  saveCfg(c){ StockCfg.save(c); },
  upd(p){ this.saveCfg({ ...this.cfg(), ...p }); },
  on(){ const c = this.cfg(); return !!(c.room && (c.k || c.hk === c.room || this.key)); },
  need(){ return this.cfg().need || ""; },
  get lastFull(){ return Number(localStorage.getItem("sFullAt:" + this.cfg().room)) || 0; },
  set lastFull(v){ try { localStorage.setItem("sFullAt:" + this.cfg().room, String(v)); } catch (e) {} },
  pending(){ return Object.values(all()).filter(r => r.p).length; },
  async aes(){
    if (!this.key) this.key = await StockCfg.key(this.cfg().room);
    if (!this.key) throw new CloudError("nokey");
    return this.key;
  },
  payload(l){ return { v: l.v || {}, note: l.note || "", upd: l.upd || 0, shared: l.shared || 0, via: l.via || "", ...(l.cf ? { cf: l.cf } : {}) }; },
  run(){
    if (!this.on()) { this.paint(); return Promise.resolve(); }
    if (this.busy) { this.again = true; return this.cur; }
    if (!navigator.onLine) { this.state = "off"; this.paint(); return Promise.resolve(); }
    if (this.need()) { this.state = "need"; this.paint(); return Promise.resolve(); }
    this.busy = true; this.state = "busy"; this.paint();
    this.cur = (async () => {
      try {
        await this.cycle();
        this.state = "ok"; this.last = Date.now();
        Cloud.touch(this.cfg().room);
      } catch (e) {
        let why = "";
        if (e && e.code === "nokey") why = e.code;
        else if (e && (e.code === "retired" || e.code === "denied")) {   // 先看這支手機是不是被停用，再看密碼有沒有被更換
          why = await Cloud.diagnose(this.cfg().room).catch(() => e.code === "retired" ? "retired" : "");
          if (why === "denied" || why === "join") why = e.code === "retired" ? "retired" : why === "join" ? "join" : "";
        }
        if (why) { this.upd({ need: why }); this.state = "need"; }
        else this.state = navigator.onLine ? "err" : "off";
      } finally {
        this.busy = false; this.paint();
        if (this.again) { this.again = false; setTimeout(() => this.run(), 300); }
      }
    })();
    return this.cur;
  },
  async cycle(){
    const c = this.cfg(), room = c.room, key = await this.aes();
    if (c.legacy) { if (await Cloud.importLegacy(room, c.legacy) >= -1) this.upd({ legacy: "" }); }   // 舊版房間的資料搬過來
    // 舊版排隊中的刪除 → 改成「標記刪除」，30 天內還能復原
    for (const id of c.dels || []) {
      const d = await Cloud.getDoc(room, id);
      if (d && !d.data.del) await Cloud.put(room, id, { iv: d.data.iv, ct: d.data.ct, upd: d.data.upd, del: Date.now() }, { ver: d.data.ver || 0, ut: d.ut });
      const cc = this.cfg(); cc.dels = (cc.dels || []).filter(x => x !== id); this.saveCfg(cc);
    }
    const full = !this.lastFull || Date.now() - this.lastFull > 3 * 3600 * 1000;
    if (full || ++this.n % 5 === 0) { const rd = await Cloud.room(room); if (rd && rd.retired) throw new CloudError("retired"); }
    const docs = full ? await Cloud.list(room) : await Cloud.changedSince(room, (this.cfg().cursor || 0) - 10000);
    let changed = await this.apply(docs, full, key);
    changed = (await this.push(room, key)) || changed;
    if (full) {
      this.lastFull = Date.now();
      await this.purgeOld(room, docs);
      Cloud.backupDaily(room, docs).catch(() => {});   // 雲端每日加密備份（今天已經有就跳過）
    }
    if (changed) { fill(); if (modal.classList.contains("show") && sheet.dataset.sub === "hist") showHistory(true); }
  },
  remote(d, key){ return aesOpen(key, d.data.iv, d.data.ct).then(x => ({ ...cleanStock(x, clean), del: d.data.del || 0, ver: d.data.ver || 0, ut: d.ut, dtsRaw: d.dtsRaw, by: d.data.by, rts: d.data.ts })); },
  async apply(docs, full, key){
    const a = all(); let changed = false, maxTs = this.cfg().cursor || 0;
    const seen = new Set();
    for (const d of docs) {
      if (d.data.ts > maxTs) maxTs = d.data.ts;
      if (!ID_RE.test(d.id) || !d.data.ct) continue;
      seen.add(d.id);
      const l = a[d.id];
      if (l && l.ut === d.ut) continue;
      // 換房間後：雲端已經有一樣的這筆（同一次修改），直接接上
      if (l && l.p && !l.ut && !l.b && l.upd === (d.data.upd || 0) && !!l.del === !!d.data.del) { try { a[d.id] = await this.remote(d, key); } catch (e) {} continue; }
      if (l && l.p) continue;   // 這支手機有待上傳的修改（上傳時合併）
      try { a[d.id] = await this.remote(d, key); changed = true; } catch (e) {}
    }
    if (full) for (const [id, l] of Object.entries(a)) {
      if (!ID_RE.test(id) || seen.has(id) || l.p || l.del) continue;
      if (l.ut || l.k0) { l.del = Date.now(); l.gone = 1; changed = true; }   // 雲端已經沒有：移到最近刪除，不直接刪
      else if (Object.keys(l.v || {}).length || l.note) l.p = 1;              // 從來沒上傳過
    }
    saveAll(a); this.upd({ cursor: maxTs });
    return changed;
  },
  async push(room, key){
    let changed = false;
    const uid = await Cloud.uid();
    for (const id of Object.keys(all()).filter(id => all()[id].p)) {
      for (let tries = 0; tries < 4; tries++) {
        const l = all()[id]; if (!l || !l.p) break;
        if (!ID_RE.test(id)) { delete l.p; const a = all(); a[id] = l; saveAll(a); break; }
        const pay = this.payload(l), body = await aesSeal(key, pay);
        const b = l.b, base = l.gone || !l.ut ? null : { ver: l.ver, ut: l.ut, del: b ? b.del : 0, dtsRaw: l.dtsRaw };
        const prev = b && base && Cloud.keepPrev({ ver: l.ver, by: l.by, rts: l.rts }, uid)
          ? { ...(await aesSeal(key, { v: b.v, note: b.note, shared: b.shared, upd: 0 })), upd: 0, ver: l.ver, del: b.del || 0 } : null;
        try {
          const res = await Cloud.put(room, id, { ...body, upd: l.upd || 0, del: l.del || 0 }, base, prev);
          const a = all(), x = a[id];
          if (x) {
            Object.assign(x, { ver: res.ver, ut: res.ut, dtsRaw: res.dtsRaw, by: uid, rts: Date.now() }); delete x.gone; delete x.k0;
            if (same(this.payload(x), pay) && (x.del || 0) === (l.del || 0)) { delete x.p; delete x.b; }
            else x.b = { ...stockBase({ ...pay, del: l.del || 0 }) };   // 上傳途中又改了：剛上傳的就是新的上一版
            saveAll(a);
          }
          break;
        } catch (e) {
          if (e.code === "denied") { const why = await Cloud.diagnose(room); if (why !== "denied") throw e; }   // 被拒絕是因為版本不對 → 當成衝突
          else if (e.code !== "conflict") throw e;
          // 衝突：讀雲端最新版本，逐項三方合併（不看手機時間）
          const d = await Cloud.getDoc(room, id);
          if (!d) { const a = all(); a[id].gone = 1; saveAll(a); continue; }
          const R = await this.remote(d, key);
          const { rec, conflict } = mergeStock3(l.b || null, l, R);
          const a = all();
          if (same(this.payload(rec), this.payload(R)) && !!rec.del === !!R.del) { a[id] = R; saveAll(a); changed = true; break; }   // 合併後就是雲端版本
          if (conflict) {
            await Cloud.saveRev(room, id, { ...body, upd: l.upd || 0, del: l.del || 0 }, "conflict");
            toast("另一支手機同時修改了同一天的剩貨，有不同的數字，請在上方確認", true);
          }
          a[id] = { ...rec, p: 1, ver: R.ver, ut: R.ut, dtsRaw: R.dtsRaw, by: R.by, rts: R.rts, b: stockBase(R) };
          saveAll(a); changed = true;
        }
      }
    }
    return changed;
  },
  /* 刪除超過 30 天的，雲端與手機都清掉（雲端以伺服器記下的刪除時間為準） */
  async purgeOld(room, docs){
    const lim = Date.now() - TRASH_DAYS * DAY - 3600 * 1000;
    const old = docs.filter(d => ID_RE.test(d.id) && d.data.del && d.data.dts && d.data.dts < lim);
    for (const d of old.slice(0, 100)) { try { await Cloud.commit([Cloud.del(`/rooms/${room}/orders/${d.id}`)]); } catch (e) {} }
    const a = all(); let n = 0;
    for (const [id, r] of Object.entries(a)) if (r.del && r.del < lim && !r.p) { delete a[id]; n++; }
    if (n) saveAll(a);
  },
  /* 加入或換到另一個房間（舊版升級、店家密碼更換） */
  async switchTo(room, pw, meta, legacy){
    const c = this.cfg();
    await StockCfg.join(room, pw, meta, legacy);
    this.key = null; this.lastFull = 0;
    this.upd({ cursor: c.room === room ? c.cursor : 0 });
  },
  paint(){
    if (typeof paintCtx === "function") paintCtx();
    const p = $("syncPill"), n = this.pending();
    if (!this.on() && !this.need()) { p.hidden = true; $("saveState").textContent = mk ? "只存在這支手機" : "選好市場就會自動儲存"; return; }
    const st = this.need() ? "err" : this.state;
    p.hidden = false; p.className = "sync-pill " + (st || "");
    p.textContent = this.need() ? "未同步" : st === "busy" ? "同步中" : st === "off" ? (n ? `離線・${n} 筆待傳` : "離線") : st === "err" ? (n ? `${n} 筆未上傳` : "未同步") : st === "ok" ? (n ? `${n} 筆待傳` : "已同步") : "同步";
    $("saveState").textContent = this.need() ? "已存在手機・需要店家密碼" : { off: "已存在手機・離線", err: "已存在手機・稍後重試上傳", busy: "已儲存・同步中", ok: n ? "已存在手機・等待上傳" : "已儲存・已同步" }[this.state] || "已自動儲存";
    if (!mk) $("saveState").textContent = "選好市場就會自動儲存";
  },
};
$("syncPill").onclick = () => Sync.need() ? askStorePw(Sync.need()) : Sync.run();
setInterval(() => { if (!document.hidden) Sync.run(); }, 6000);
window.addEventListener("online", () => Sync.run());
window.addEventListener("offline", () => { Sync.state = "off"; Sync.paint(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) Sync.run(); });

/* 輸入店家密碼加入同步（第一次、安全升級、密碼已更換、被撤銷） */
function askStorePw(reason){
  const msg = {
    join: "這次更新需要再輸入一次店家密碼，之後這支手機會記住，不用再輸入。",
    retired: "店家密碼已經在另一支手機更換。請輸入新的店家密碼，這支手機還沒上傳的剩貨會一起帶過去。",
    revoked: "這支手機的同步已被其他手機停用。輸入店家密碼可以重新加入。",
    nokey: "請再輸入一次店家密碼，才能繼續同步。",
  }[reason] || "輸入和訂購頁同一組店家密碼，剩貨紀錄就會在所有手機同步。";
  $("dlgBox").innerHTML = `<h4>${reason === "retired" ? "輸入新的店家密碼" : "輸入店家密碼"}</h4><p>${escapeHtml(msg)}</p>
    ${pwField("spw", "店家密碼")}
    <div class="dlg-err" id="pwErr"></div>
    <div class="dlg-btns"><button type="button" class="btn ghost" data-no>${reason ? "稍後" : "先不同步"}</button><button type="button" class="btn" data-yes>加入</button></div>`;
  $("dlg").classList.add("show");
  const inp = $("spw"), err = $("pwErr"), yes = $("dlgBox").querySelector("[data-yes]");
  setTimeout(() => inp.focus(), 50);
  $("dlgBox").querySelector("[data-no]").onclick = () => { closeDlg(); if (!reason) Sync.upd({ skip: 1 }); Sync.paint(); };
  const go = async () => {
    if (inp.value.length < 8) { err.textContent = "店家密碼至少 8 碼"; return; }
    if (!navigator.onLine) { err.textContent = "需要網路，請連上網路再試"; return; }
    yes.disabled = true; err.textContent = "連線中…";
    try {
      const r = await Cloud.enter(inp.value);
      if (r.meta) { await Sync.switchTo(r.room, inp.value, r.meta, r.legacy); closeDlg(); toast("已加入同步"); Sync.paint(); Sync.run(); if (sheet.dataset.sub === "hist" && modal.classList.contains("show")) showHistory(); }
      else { yes.disabled = false; err.textContent = r.state === "retired" ? "這是已經換掉的舊密碼，請輸入新的店家密碼" : "找不到這組店家密碼。請確認有沒有打錯，或先在訂購頁設定。"; }
    } catch (e) { yes.disabled = false; err.textContent = "連不上同步伺服器，請確認網路後再試"; }
  };
  inp.onkeydown = e => { if (e.key === "Enter") go(); };
  yes.onclick = go;
}

/* 啟動 */
(function(){
  const d = new Date();
  $("todayLine").textContent = `今天 ${d.getMonth() + 1}/${d.getDate()}（星期${WK[d.getDay()]}）`;
  render(); fill(); Sync.paint(); paintNet();
  const c = Sync.cfg(), canCrypto = window.isSecureContext && window.crypto && crypto.subtle;
  if (canCrypto) Backup.snapshot("auto");
  if (!Sync.on() && !c.room && !c.skip && canCrypto) askStorePw();
  else if (c.room && Sync.need()) askStorePw(Sync.need());
  else if (c.room && !c.v2 && canCrypto && Date.now() - (Number(localStorage.getItem("upAskS")) || 0) > 12 * 3600 * 1000) {
    // 舊版升級：這支手機還沒登記，請輸入一次店家密碼（每 12 小時最多問一次；按「稍後」照常同步）
    localStorage.setItem("upAskS", String(Date.now()));
    askStorePw("join");
  }
  Sync.run();
})();
